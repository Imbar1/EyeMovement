*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#808080;color:#fff;font-family:Calibri,Arial,sans-serif}button,input,select{font:inherit}.app{position:relative;width:100vw;height:100vh}.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2vh 4vw}.hidden{display:none!important}.panel{max-width:920px;max-height:92vh;overflow:auto;background:#0003;padding:24px;border-radius:14px}.consent-form{text-align:right;line-height:1.55}.consent-form h2{text-align:center}.btn{font-size:22px;color:#fff;background:#4f8f52;border:0;border-radius:8px;padding:12px 28px;cursor:pointer;margin:8px;box-shadow:0 2px 5px #0005}.btn:hover{background:#5da660}.btn:disabled{background:#777;color:#ddd;cursor:not-allowed}.no-btn{background:#9b3f3f}.input{font-size:24px;padding:12px;text-align:center;direction:ltr}.slide{width:70vw;height:58vh;object-fit:contain}.keyboard-nav{display:block;width:min(32vw,360px);max-height:14vh;object-fit:contain;margin:8px auto 14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:800px}.candidate{width:150px;height:150px;object-fit:cover;border:5px solid transparent;border-radius:8px;cursor:pointer}.candidate.sel{border-color:#00ff7f}.fix,.bottom-fix{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 128px/0.8 Arial;color:#fff}.bottom-fix{top:auto;bottom:7vh;height:auto}.count{font-size:110px}.trial-grid{position:absolute;inset:0}.pos{position:absolute;width:40vw;height:40vh;object-fit:contain}.p1{left:10vw;top:5vh}.p2{left:50vw;top:5vh}.p3{left:50vw;top:55vh}.p4{left:10vw;top:55vh}.center{position:absolute;left:30vw;top:30vh;width:40vw;height:40vh;object-fit:contain}.question{position:absolute;top:5vh;left:0;right:0;font-size:48px;font-weight:bold}.keys{position:absolute;bottom:4vh;left:0;right:0;font-size:54px;font-weight:bold;color:#063b88;direction:ltr}.keys .yes{position:absolute;right:8vw}.keys .no{position:absolute;left:8vw}.status{min-height:30px;color:#ffe66d}.selection-error{color:#9b3f3f;font-size:26px;font-weight:bold}.logo{position:absolute;top:3vh;left:20vw;width:60vw;height:17vh;object-fit:contain}.rating-face{display:block;width:40vw;height:40vh;object-fit:contain;margin:2vh auto}.scale{direction:ltr}.scale button{font-size:22px;width:42px;height:42px;margin:4px}

<body><main id="app" class="app"></main>
<script>
'use strict';
const A='https://raw.githubusercontent.com/Imbar1/EyeMovement/main/resources/';
const enc=n=>A+encodeURIComponent(String(n).split('/').pop());
const root=document.getElementById('app');
const imageCache=new Map();
const S={id:'',age:'',gender:'',female:[],male:[],raw:[],trials:[],ratings:[],cal1:0,cal2:0,calAcc1:0,calAcc2:0,lastSex:''};
const assets=['biu_logo.png','only_forward.jpg','back_and_forward.jpg','b_women_pics.jpg','b_men_pics.jpg','SMT_instructions.jpg','SMT_example.jpg','twoSessInst.jpg','b_practice.jpg','b_STM.jpg','b_sig_rate.jpg','EM_instructions.jpg',...Array.from({length:10},(_,i)=>`P${i+1}.webp`),...Array.from({length:14},(_,i)=>`UNf${i+1}.webp`),...Array.from({length:14},(_,i)=>`UNm${i+1}.webp`),...Array.from({length:12},(_,i)=>`F${i+1}.webp`),...Array.from({length:12},(_,i)=>`M${i+1}.webp`)];
function img(n,c=''){return `<img class="${c}" src="${enc(n)}" alt="${String(n).replace(/"/g,'')}">`}
function base(h){root.innerHTML=`<section class="screen">${h}</section>`}
function key(fn){document.onkeydown=e=>fn(e)}
function loadImage(n){const k=String(n).split('/').pop();if(imageCache.has(k))return imageCache.get(k);const p=new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>{console.warn('Asset failed:',k);r(null)};im.src=enc(k)});imageCache.set(k,p);return p}
function preload(names){return Promise.all(names.map(loadImage))}
async function preloadAll(){base('<div class="panel"><h1>נא להמתין בזמן שכל חומרי הניסוי נטענים</h1><progress id="pr" max="'+assets.length+'" value="0"></progress><p id="pc">0%</p></div>');let n=0;const progress=document.getElementById('pr');const percent=document.getElementById('pc');await Promise.all(assets.map(async x=>{await loadImage(x);n++;if(progress)progress.value=n;if(percent)percent.textContent=Math.round(n/assets.length*100)+'%'}));screen1()}
function screen1(){base('<div class="panel"><h1>ברוכים הבאים למחקר</h1><p>נא הזן/י את מספר המשתתף/ת.</p><input id="pid" class="input" inputmode="numeric"><br><button class="btn" id="go">המשך</button><p id="err" class="status"></p></div>');go.onclick=()=>{if(!pid.value.trim())return err.textContent='נא להזין מספר';S.id=pid.value.trim();screenDemographics()}}
function screenDemographics(){base('<div class="panel"><h2>פרטים אישיים</h2><p>נא להזין/י את גילך ולבחור מגדר.</p><input id="age" class="input" inputmode="numeric"><br><select id="gender" class="input"><option value="">יש לבחור</option><option>זכר</option><option>נקבה</option></select><br><button class="btn" id="demoGo">המשך</button><p id="demoErr" class="status"></p></div>');demoGo.onclick=()=>{if(!age.value.trim())return demoErr.textContent='נא להזין גיל';if(!gender.value)return demoErr.textContent='נא לבחור מגדר';S.age=age.value.trim();S.gender=gender.value;screen2()}}
function screen2(){base('<div class="panel"><h2>האם את/ה מרכיב/ה משקפיים?</h2><button class="btn" id="yes">כן</button><button class="btn no-btn" id="no">לא</button></div>');yes.onclick=()=>exit('תודה רבה על ההתעניינות במחקר שלנו. מכיוון שאת/ה מרכיב/ה משקפיים לא תוכל/י לבצע את הניסוי.');no.onclick=consentScreen}
function consentScreen(){base(`<div class="panel consent-form"><h2>טופס הסכמה מדעת להשתתפות בניסוי At First Glance</h2><p><strong>שם המחקר:</strong> At First Glance</p><p><strong>שם החוקר האחראי:</strong> אמבר מזרחי, המחלקה לקרימינולוגיה, אוניברסיטת בר-אילן.</p><p><strong>מטרת המחקר:</strong> מטרת המחקר הינה לבחון את זיהוי פריטים (זיכרון) בעת הצגת פריטים שונים על המסך, בהתאם להוראות שיוצגו בהמשך.</p><p><strong>מה תתבקש/י לעשות במחקר?</strong><br>בניסוי זה תבקש/י לבצע משימה מסוימת שבמהלכה ימדדו תנועות עינייך ביחידות של מספרים. נדגיש כי פנייך לא יוקלטו!</p><p><strong>כמה זמן ייקח המחקר?</strong> משך הניסוי הוא כ-15 דק'.</p><p><strong>מהם הסיכונים האפשריים הכרוכים בהשתתפות במחקר?</strong> אין סיכונים.</p><p><strong>איזו תועלת תצמח לך מהמחקר?</strong><br>תוכל/י לקבל חצי קופון. בנוסף, תוצאות הניסוי עשויות לתרום להבנה התאורטית של מבחן ה-CIT אשר מהווה תנאי חשוב ליישומו של מבחן זה.</p><p><strong>איך נשמור על המידע שנאגר במסגרת הניסוי?</strong><br>כדי להבטיח את שמירת החיסיון של המידע האישי שלך, כל נתוני המידע יקודדו ויישמרו במחשב באופן אנונימי ונפרד מהפרטים המזהים. בנוסף, לא יעשה שימוש מזהה כלשהו בנתונים שלך בפורום כלשהו או בפרסום מדעי או תקשורתי כלשהו.</p><p><strong>מה יקרה אם תרצה להפסיק את הניסוי באמצע?</strong><br>ההשתתפות בניסוי היא על בסיס התנדבותי. לפיכך – זכותך להפסיק את השתתפותך בניסוי בכל עת ומכל סיבה שהיא. לא תהינה שום השלכות לכך שבחרת להפסיק את הניסוי והחלטה זו לא תפגע בך בשום אופן. בנוסף, את הקרדיט היחסי עבור הניסוי תקבל גם במקרה שתחליט לפרוש.</p><p>במקרה הצורך ניתן ליצור קשר עם החוקרת האחראית – <strong>אמבר מזרחי</strong> – בכל שאלה ועניין בטלפון 050-3477040 ובאי-מייל imbar.mizrahi123@gmail.com.</p><p><strong>מידע ליצירת קשר לעזרה במקרה של פגיעה מהמחקר</strong><br>במידה ותרצה לשוחח על מחקר זה עם משהו שאינו מעורב ישירות במחקר, תוכל לדבר עם <strong>ד&quot;ר יהונתן לוי</strong> בכתובת המייל הבאה: jonathan.levy@biu.ac.il.</p><div><button class="btn" id="agree">אני מסכים/ה להשתתף בניסוי</button><button class="btn no-btn" id="decline">אני לא מסכים/ה להשתתף בניסוי</button></div></div>`);agree.onclick=()=>instr('b_women_pics.jpg',screen6);decline.onclick=()=>exit('תודה רבה על ההתעניינות במחקר שלנו. יום טוב :)')}
function instr(pic,next){base(`${img(pic,'slide')}<button class="btn" id="next">המשך</button>`);document.getElementById('next').onclick=next}
function choose(g){const ns=Array.from({length:12},(_,i)=>`${g}${i+1}.webp`);base('<h2>בחר/י בדיוק שני פרצופים מוכרים</h2><div class="grid">'+ns.map((n,i)=>`<img class="candidate" id="c${i}" src="${enc(n)}">`).join('')+'</div><button class="btn" id="chooseNext">המשך</button><p id="msg" class="selection-error">נבחרו: 0 מתוך 2</p>');ns.forEach((_,i)=>document.getElementById('c'+i).onclick=()=>{const x=document.getElementById('c'+i);if(x.classList.contains('sel'))x.classList.remove('sel');else if(document.querySelectorAll('.sel').length<2)x.classList.add('sel');msg.textContent='נבחרו: '+document.querySelectorAll('.sel').length+' מתוך 2'});chooseNext.onclick=()=>{const a=[...document.querySelectorAll('.sel')].map(x=>decodeURIComponent(x.src.split('/').pop()));if(a.length!==2)return msg.textContent='יש לבחור בדיוק שני פרצופים';S[g==='F'?'female':'male']=a;g==='F'?screen7():screen9()}}
function screen6(){choose('F')}function screen7(){instr('b_men_pics.jpg',screen8)}function screen8(){choose('M')}
let sl=1;function screen9(){const p=['SMT_instructions.jpg','SMT_example.jpg','twoSessInst.jpg','b_practice.jpg'];const navImage=sl===1?'only_forward.jpg':'back_and_forward.jpg';base(`${img(p[sl-1],'slide')}<p>השתמש/י בחצים כדי לנווט</p>${img(navImage,'keyboard-nav')}`);key(e=>{if(e.key==='ArrowLeft'&&sl>1){e.preventDefault();sl--;screen9()}else if(e.key==='ArrowRight'){e.preventDefault();if(sl<4){sl++;screen9()}else{document.onkeydown=null;countdown('practice')}}})}
function countdown(type){let n=3;base('<div id="ct" class="count">3</div>');const t=setInterval(()=>{n--;if(n<1){clearInterval(t);type==='practice'?practice():mainStart(type==='block2'?2:1)}else ct.textContent=n},1000)}
let showFeedback=false;const prac=[['P4','P6','P2','P8','P2','i'],['P1','P3','P5','P7','P9','e'],['P6','P8','P4','P10','P8','i'],['P3','P9','P7','P5','P1','e']];
function trial(row,done){const faces=row.slice(0,4).map(x=>String(x).endsWith('.webp')?x:x+'.webp');base('<div class="fix">+</div>');Promise.all([preload(faces),new Promise(r=>setTimeout(r,5000))]).then(()=>{base('<div class="trial-grid">'+faces.map((x,i)=>img(x,'pos p'+(i+1))).join('')+'</div>');setTimeout(()=>{base('<div class="bottom-fix">+</div>');setTimeout(()=>response(row,done),3000)},5000)})}
function response(row,done){const name=String(row[4]).endsWith('.webp')?row[4]:row[4]+'.webp';base(img(name,'center')+'<div class="question">האם הפרצוף הזה הופיע במסך הקודם?</div><div class="keys"><span class="yes">I = כן</span><span class="no">E = לא</span></div>');const start=performance.now();let answered=false;let timeoutId;const finish=q=>{if(answered)return;answered=true;clearTimeout(timeoutId);document.onkeydown=null;const correct=q===row[5];S.trials.push({phase:'main',rt:performance.now()-start,key:q,correct});if(showFeedback){base('<h2 style="color:'+(correct?'#00a83b':'#b32626')+'">'+(correct?'תשובה נכונה':'תשובה שגויה')+'</h2>');setTimeout(done,700)}else done()};document.onkeydown=e=>{const key=String(e.key||'').toLowerCase();const q=e.code==='KeyI'||key==='i'||e.key==='ך'?'i':e.code==='KeyE'||key==='e'||e.key==='ק'?'e':'';if(q){e.preventDefault();e.stopImmediatePropagation();finish(q)}};timeoutId=setTimeout(()=>{if(answered)return;answered=true;document.onkeydown=null;if(showFeedback){base('<h2 style="color:#9b3f3f">לאט מידי</h2>');setTimeout(done,700)}else done()},2000)}
function practice(){showFeedback=true;let i=0;const go=()=>i<prac.length?trial(prac[i++],go):(showFeedback=false,screenMovementInstructions());go()}
/* ---------- WebGazer: אתחול בסגנון PsychoPy ---------- */
let wgReady=false,wgStarting=null,lastGaze=null,lastGazeTime=0,monitorTimer=null,goodTimer=null;
const averagingWindow=1;
window.xGazes=new Array(averagingWindow).fill(0);
window.yGazes=new Array(averagingWindow).fill(0);
window.eyesExitedTimestamp=Date.now();
window.eyesReturnedDelay=250;
function cameraPopup(){let p=document.getElementById('cameraPopup');if(p)return p;p=document.createElement('div');p.id='cameraPopup';p.className='camera-popup';p.innerHTML='<div class="camera-label">בדיקת מיקום הפנים</div><div class="camera-frame" id="cameraFrame"></div><div class="camera-status" id="cameraStatus">ממתין לאיתור פנים…</div>';document.body.appendChild(p);return p}
function attachVideo(){return webgazer.getVideoElement?.()||document.getElementById('webgazerVideoFeed')}
function updateCamera(){const host=document.getElementById('webgazerVideoContainer');const box=document.getElementById('webgazerFaceFeedbackBox');if(!host)return;let inFrame=false;try{inFrame=typeof webgazer.checkEyesInValidationBox==='function'&&webgazer.checkEyesInValidationBox()===true}catch(e){}if(inFrame){host.style.borderColor='#35d36b';if(box)box.style.borderColor='#35d36b';window.eyesExitedTimestamp=Date.now();if(performance.now()-window._cameraShownAt>200){host.style.opacity='0';host.style.pointerEvents='none'}}else{window._cameraShownAt=performance.now();host.style.opacity='1';host.style.pointerEvents='none';host.style.borderColor='#d33';if(box)box.style.borderColor='#d33'}}
function startFaceMonitor(){cameraPopup();const host=document.getElementById('webgazerVideoContainer');if(host){host.style.opacity='1';host.style.pointerEvents='none'}clearInterval(monitorTimer);monitorTimer=setInterval(updateCamera,50);attachVideo()}
function stopFaceMonitor(){clearInterval(monitorTimer);monitorTimer=null;clearTimeout(goodTimer);document.getElementById('cameraPopup')?.remove()}
async function startWebgazer(){if(!window.webgazer)throw Error('WebGazer לא נטען');if(wgReady){startFaceMonitor();return true}if(wgStarting)return wgStarting;wgStarting=(async()=>{if(!window.isSecureContext)throw Error('הניסוי חייב לפעול דרך HTTPS או localhost');if(!navigator.mediaDevices?.getUserMedia)throw Error('הדפדפן אינו מאפשר גישה למצלמה');if(typeof webgazer.saveDataAcrossSessions==='function')webgazer.saveDataAcrossSessions(false);webgazer.params.showVideoPreview=true;webgazer.params.showFaceFeedbackBox=true;webgazer.params.showFaceOverlay=true;webgazer.params.showGazeDot=false;webgazer.params.showPredictionPoints=false;if(typeof webgazer.setRegression==='function')webgazer.setRegression('ridge');webgazer.setGazeListener(data=>{if(data!==null&&Number.isFinite(data.x)&&Number.isFinite(data.y)){window.xGazes.shift();window.xGazes.push(data.x);window.yGazes.shift();window.yGazes.push(data.y);lastGaze={x:window.xGazes.reduce((a,b)=>a+b,0)/averagingWindow,y:window.yGazes.reduce((a,b)=>a+b,0)/averagingWindow};lastGazeTime=performance.now()}});const r=webgazer.begin();if(r&&typeof r.then==='function')await r;const deadline=performance.now()+20000;while(performance.now()<deadline){const ready=typeof webgazer.isReady==='function'&&webgazer.isReady();const box=document.getElementById('webgazerFaceFeedbackBox');const video=document.getElementById('webgazerVideoFeed');if(ready&&box&&video){wgReady=true;startFaceMonitor();return true}await new Promise(x=>setTimeout(x,100))}throw Error('מצלמת WebGazer לא נעשתה זמינה בזמן שהוקצב')})().catch(e=>{console.error('WebGazer initialization failed',e);wgStarting=null;wgReady=false;throw e});return wgStarting}
function calibrate(block){const points=[[10,10],[50,10],[90,10],[10,50],[50,50],[90,50],[10,90],[50,90],[90,90]];const instruction=()=>{base('<div class="panel"><h2>הוראות כיול</h2><p>הסתכל/י על הנקודה ולחץ/י עליה חמש פעמים. שמור/י את הראש יציב.</p><button class="btn" id="startCal">התחל/י</button></div>');startCal.onclick=run};const run=()=>{let i=0;try{webgazer.showVideoPreview(true);webgazer.showFaceOverlay(true);webgazer.showFaceFeedbackBox(true);webgazer.showPredictionPoints(false)}catch(e){}const next=()=>{if(i>=points.length){try{webgazer.showPredictionPoints(false)}catch(e){}block===1?(S.cal1=1,S.calAcc1=100):(S.cal2=1,S.calAcc2=100);screen13(block);return}const [x,y]=points[i++];base(`<div class="calibration"><button class="calpoint" id="target" style="left:${x}%;top:${y}%"></button><div style="position:absolute;left:50%;bottom:3vh;transform:translateX(-50%);font-size:20px;background:#0008;padding:8px 14px;border-radius:8px;z-index:1200">הסתכל/י על הריבוע ולחץ/י עליו 5 פעמים (${i}/${points.length})</div></div>`);let clicks=0;target.onclick=e=>{const r=target.getBoundingClientRect();try{webgazer.recordScreenPosition(r.left+r.width/2,r.top+r.height/2,'click')}catch(err){console.warn(err)}target.textContent=++clicks;if(clicks>=5){target.disabled=true;target.classList.add('done');setTimeout(next,300)}}};next()};startWebgazer().then(instruction).catch(e=>screenError(e))}
function screenError(e){base('<div class="panel"><h2>לא ניתן להפעיל את המעקב</h2><p>יש לאפשר גישה למצלמה ולהפעיל את הניסוי דרך HTTPS או localhost.</p><p class="status">'+(e?.message||'')+'</p><button class="btn" id="retry">נסה/י שוב</button></div>');retry.onclick=()=>screen12(1)}
function screenMovementInstructions(){base(img('EM_instructions.jpg','slide')+'<button class="btn" id="movementContinue">המשך</button>');movementContinue.onclick=()=>screen12(1)}
function screen12(block=1){base('<div class="panel"><h2>מכינים את המצלמה למעקב עיניים</h2><p>נא לאשר גישה למצלמה ולהישאר מול המסך.</p><p id="wgStatus">מפעילים את מערכת המעקב…</p></div>');startWebgazer().then(()=>{wgStatus.textContent='המצלמה פעילה';setTimeout(()=>calibrate(block),300)}).catch(screenError)}
function screen13(block){base(img('b_STM.jpg','slide')+'<p>כשתהיה/י מוכן/נה לחץ/י על רווח</p>');key(e=>{if(e.code==='Space')countdown(block===1?'main':'block2')})}
function makeRows(sex){const U=sex==='F'?'UNf':'UNm',known=sex==='F'?S.female:S.male;const f1=known[0]||`${sex}1.webp`,f2=known[1]||`${sex}2.webp`;return Array.from({length:16},(_,i)=>{const familiar=i<8?(i%2?f1:f2):null;const p=Array.from({length:4},(_,j)=>familiar&&j===i%4?familiar:`${U}${(i*3+j*2)%14+1}.webp`);const present=Boolean(familiar);const s=present?`${U}${(i*5)%14+1}.webp`:(i%2?f1:f2);return {p,s,c:i%2?'i':'e',ffi:present}}).sort(()=>Math.random()-.5)}
function mainStart(block){const sex=block===1?(Math.random()<.5?'F':'M'):(S.lastSex==='F'?'M':'F');S.lastSex=sex;const rows=makeRows(sex);let i=0;const go=()=>{if(i>=rows.length)return block===1?screen13(2):screen16();const r=rows[i++];const faces=r.p;const begin=()=>{base('<div class="trial-grid">'+faces.map((x,j)=>img(x,'pos p'+(j+1))).join('')+'</div>');const t0=performance.now();if(r.ffi)track(t0,sex,i);setTimeout(()=>{base('<div class="bottom-fix">+</div>');setTimeout(()=>response([...faces,r.s,r.c],go),3000)},5000)};base('<div class="fix">+</div>');Promise.all([preload(faces),new Promise(x=>setTimeout(x,5000))]).then(begin)};go()}
function track(t0,sex,trial){const stop=t0+5000;const f=()=>{const now=performance.now();if(now>=stop)return;S.raw.push({participant:S.id,block:sex,trial,timestamp:now-t0,gazeX:lastGaze?.x??null,gazeY:lastGaze?.y??null,screenWidth:innerWidth,screenHeight:innerHeight,phase:now-t0<=1000?'Phase1':'Phase2'});requestAnimationFrame(f)};requestAnimationFrame(f)}
function screen16(){stopFaceMonitor();try{webgazer.pause?.();webgazer.end?.()}catch(e){}wgReady=false;base('<div class="panel"><h2>מעקב העיניים הסתיים</h2><p>כעת תתבצע משימת דירוג קצרה.</p><button class="btn" id="ratingStart">המשך</button></div>');ratingStart.onclick=ratings}
function ratings(){const all=[...Array.from({length:14},(_,i)=>`UNf${i+1}.webp`),...S.female,...Array.from({length:14},(_,i)=>`UNm${i+1}.webp`),...S.male];let i=0;const next=()=>{if(i>=all.length)return finish();base('<h2>באיזה מידה פרצוף זה תפס לך את העין?</h2>'+img(all[i],'rating-face')+'<p>1 = במידה מועטה מאוד, 9 = במידה רבה מאוד</p><div class="scale">'+[1,2,3,4,5,6,7,8,9].map(n=>`<button class="btn" data-r="${n}">${n}</button>`).join('')+'</div>');document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.ratings.push({stimulus:all[i],rating:Number(b.dataset.r)});i++;next()})};next()}
function finish(){const p={participant_summary:{ParticipantNo:S.id,Age:S.age,Gender:S.gender,Calibration_Attempts_block1:S.cal1,Calibration_Attempts_block2:S.cal2,Calibration_Accuracy_Score_Block1:S.calAcc1,Calibration_Accuracy_Score_Block2:S.calAcc2,raw_gaze_count:S.raw.length,ratings:S.ratings},raw_gaze:S.raw,trials:S.trials};localStorage.setItem('participant_'+S.id+'_data',JSON.stringify(p));base(img('biu_logo.png','logo')+'<div class="panel"><h1>תודה רבה על השתתפותך 😊</h1><p>הניסוי הסתיים בהצלחה.</p></div>')}
function exit(t){base('<div class="panel"><h2>'+t+'</h2></div>')}
preloadAll();
</script>
</body>
</html>
