<script>

const firebaseConfig = {

const db = firebase.firestore();

// ==========================================
// Assets & State
// ==========================================
const A = 'https://raw.githubusercontent.com/Imbar1/EyeMovement/main/resources/';
const assets = [
  'biu_logo.png',
  'NoHeadMovements.png',
  ...Array.from({length:14}, (_,i) => `UNf${i+1}.webp`),
  ...Array.from({length:14}, (_,i) => `UNm${i+1}.webp`)
];

const S = {
  id: '',
  age: '',
  gender: '',
  raw: [],
  trials: []
};

const root = document.getElementById('app');
let isFaceSetupScreen = false;
let totalCalibSamples = 0;
let currentTrialCalibAttempts = 0;

const imageCache = new Map();
function loadImageCached(name) {
  const key = String(name).split('/').pop();
  if (imageCache.has(key)) return imageCache.get(key);
  const p = new Promise(resolve => {
    const im = new Image();
    im.decoding = 'async';
    im.onload = async () => { try { if (im.decode) await im.decode(); } catch(e) {} resolve(im); };
    im.onerror = () => { console.warn('Asset failed:', key); resolve(null); };
    im.src = A + encodeURIComponent(key);
  });
  imageCache.set(key, p);
  return p;
}

const picture = (n, c = '') => `<img class="${c}" src="${A + encodeURIComponent(n)}" alt="${n}" loading="eager">`;
function base(h) { root.innerHTML = `<section class="screen">${h}</section>`; }
function k(fn) { document.onkeydown = e => fn(e); }

function enterFullscreen() {
  const elem = document.documentElement;
  if (elem.requestFullscreen) elem.requestFullscreen().catch(()=>{});
  else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
}

// ==========================================
// MediaPipe Face Mesh & Polynomial Regression Model
// ==========================================
let faceMesh = null;
let cameraUtils = null;
let currentFeatures = null;
let calibDataX = [];
let calibDataY = [];
let weightsX = null;
let weightsY = null;

let smoothGazeX = null;
let smoothGazeY = null;
let goodStateStartTime = 0;
let isAligned = false;

function solveLinearRegression(X, Y) {
  const N = X.length;
  const K = X[0].length;
  let XTX = Array.from({length: K}, () => new Array(K).fill(0));
  for (let i = 0; i < K; i++) {
    for (let j = 0; j < K; j++) {
      for (let n = 0; n < N; n++) {
        XTX[i][j] += X[n][i] * X[n][j];
      }
    }
  }
  for (let i = 0; i < K; i++) XTX[i][i] += 1e-3;

  let I = Array.from({length: K}, (_, i) => Array.from({length: K}, (_, j) => i === j ? 1 : 0));
  let M = XTX.map(row => [...row]);

  for (let i = 0; i < K; i++) {
    let pivot = M[i][i];
    if (Math.abs(pivot) < 1e-9) pivot = 1e-9;
    for (let j = 0; j < K; j++) {
      M[i][j] /= pivot;
      I[i][j] /= pivot;
    }
    for (let k = 0; k < K; k++) {
      if (k !== i) {
        let factor = M[k][i];
        for (let j = 0; j < K; j++) {
          M[k][j] -= factor * M[i][j];
          I[k][j] -= factor * I[i][j];
        }
      }
    }
  }
  let invXT = Array.from({length: K}, () => new Array(N).fill(0));
  for (let i = 0; i < K; i++) {
    for (let n = 0; n < N; n++) {
      for (let j = 0; j < K; j++) {
        invXT[i][n] += I[i][j] * X[n][j];
      }
    }
  }
  let W = new Array(K).fill(0);
  for (let i = 0; i < K; i++) {
    for (let n = 0; n < N; n++) {
      W[i] += invXT[i][n] * Y[n];
    }
  }
  return W;
}

function predictGaze() {
  if (!weightsX || !weightsY || !currentFeatures) return null;
  let rawX = 0, rawY = 0;
  for (let i = 0; i < currentFeatures.length; i++) {
    rawX += currentFeatures[i] * weightsX[i];
    rawY += currentFeatures[i] * weightsY[i];
  }
  rawX = Math.max(0, Math.min(window.innerWidth, rawX));
  rawY = Math.max(0, Math.min(window.innerHeight, rawY));

  if (smoothGazeX === null) {
    smoothGazeX = rawX;
    smoothGazeY = rawY;
  } else {
    smoothGazeX = smoothGazeX * 0.70 + rawX * 0.30;
    smoothGazeY = smoothGazeY * 0.70 + rawY * 0.30;
  }
  return { x: smoothGazeX, y: smoothGazeY };
}

function initFaceMeshSystem() {
  if (faceMesh) return Promise.resolve(true);

  const video = document.getElementById('webcamVideo');
  const canvas = document.getElementById('meshCanvas');
  const ctx = canvas.getContext('2d');
  const popup = document.getElementById('cameraPopup');
  const statusTxt = document.getElementById('cameraStatusText');

  faceMesh = new FaceMesh({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
  });

  faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  faceMesh.onResults(results => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
      const lm = results.multiFaceLandmarks[0];
      if (typeof drawConnectors === 'function' && typeof FACEMESH_TESSELATION !== 'undefined') {
        drawConnectors(ctx, lm, FACEMESH_TESSELATION, {color: '#00FFFF', lineWidth: 0.3});
      }

      const lIris = lm[468], rIris = lm[473];
      const lOut = lm[33], lIn = lm[133];
      const rOut = lm[263], rIn = lm[362];
      const lTop = lm[159], lBot = lm[145];
      const lEyeH = Math.hypot(lTop.x - lBot.x, lTop.y - lBot.y);
      const lEyeW = Math.hypot(lOut.x - lIn.x, lOut.y - lIn.y);

      if (lEyeH / (lEyeW || 0.01) < 0.12) {
        currentFeatures = null;
        return;
      }

      const mLx = (lOut.x + lIn.x) / 2;
      const mLy = (lOut.y + lIn.y) / 2;
      const mRx = (rOut.x + rIn.x) / 2;
      const mRy = (rOut.y + rIn.y) / 2;
      const eyeDistance = Math.hypot(mRx - mLx, mRy - mLy) || 0.1;

      const dxL = (lIris.x - mLx) / eyeDistance;
      const dyL = (lIris.y - mLy) / eyeDistance;
      const dxR = (rIris.x - mRx) / eyeDistance;
      const dyR = (rIris.y - mRy) / eyeDistance;
      const noseBridge = lm[6];

      currentFeatures = [
        1,
        dxL, dyL,
        dxR, dyR,
        noseBridge.x, noseBridge.y,
        dxL * dxL, dyL * dyL,
        dxR * dxR, dyR * dyR
      ];

      const nose = lm[1];
      const centered = nose.x > 0.25 && nose.x < 0.75 && nose.y > 0.20 && nose.y < 0.80;

      if (centered) {
        isAligned = true;
        popup.classList.remove('bad');
        popup.classList.add('good');
        statusTxt.textContent = 'הפנים זוהו';
        if (!goodStateStartTime) goodStateStartTime = performance.now();
        if (isFaceSetupScreen) {
          popup.classList.add('show');
        } else if (performance.now() - goodStateStartTime >= 200) {
          popup.classList.remove('show');
        }
      } else {
        isAligned = false;
        goodStateStartTime = 0;
        popup.classList.remove('good');
        popup.classList.add('bad', 'show');
        statusTxt.textContent = 'חריגה מהמסגרת';
      }
    } else {
      currentFeatures = null;
      isAligned = false;
      goodStateStartTime = 0;
      popup.classList.remove('good');
      popup.classList.add('bad', 'show');
      statusTxt.textContent = 'פנים לא זוהו';
    }

    if (isFaceSetupScreen) {
      const calBtn = document.getElementById('goCalBtn');
      if (calBtn) calBtn.disabled = !isAligned;
    }
  });

  cameraUtils = new Camera(video, {
    onFrame: async () => { await faceMesh.send({image: video}); },
    width: 320,
    height: 240
  });

  return cameraUtils.start().then(() => {
    popup.classList.add('show');
    return true;
  });
}

// ==========================================
// Screens & Onboarding
// ==========================================
async function preload() {
  base(`<div class="panel"><h1>מכינים את ניסוי הוולידציה</h1><p>אנא המתן/י בזמן שכל התמונות נטענות...</p><progress id="pr" max="${assets.length}" value="0" style="width:60%;height:22px;"></progress><p id="pc">0%</p></div>`);
  const progress = document.getElementById('pr');
  const percent = document.getElementById('pc');
  let completed = 0;
  await Promise.all(assets.map(async name => {
    await loadImageCached(name);
    completed++;
    progress.value = completed;
    percent.textContent = Math.round(completed / assets.length * 100) + '%';
  }));
  screen1();
}

function screen1() {
  base(`
    <div class="panel">
      <h1>בדיקת תיקוף למעקב תנועות עיניים</h1>
      <p style="font-size:21px;">נא להזין מספר נבדק/ת ופרטים בסיסיים:</p>

}

function screenRequirements() {
  base(`
    <div class="panel" style="max-width: 820px; text-align: right;">
      <h2 style="text-align: center; color: #002060;">לפני שמתחילים – 3 תנאים הכרחיים:</h2>
      <ol style="font-size: 22px; line-height: 1.7; margin: 20px 0;">
        <li>ביצוע הניסוי בלפטופ עם מצלמה מובנית בלבד (ללא מסך חיצוני).</li>
        <li>תאורה טובה על הפנים (ללא אור חזק מאחורי הגב).</li>
        <li>ללא משקפי ראייה מקרוב שמסתירים או מחזירים השתקפות מהאישונים.</li>
      </ol>
      <div style="text-align: center;">
        <button class="btn" id="reqOk">אני עומד/ת בתנאים – המשך</button>
      </div>
    </div>
  `);
  document.getElementById('reqOk').onclick = screenInstructions;
}

let miniCalibTimer = null;

function startMiniCalibAnimation() {
  const container = document.getElementById('miniCalibAnimArea');
  if (!container) return;

  const pts = [
    { x: 50, y: 50 },
    { x: 18, y: 18 },
    { x: 82, y: 18 },
    { x: 82, y: 82 },
    { x: 18, y: 82 },
    { x: 50, y: 50 }
  ];

  let stepIdx = 0;

  function playStep() {
    if (!document.getElementById('miniCalibAnimArea')) return;
    const curr = pts[stepIdx];
    const next = pts[(stepIdx + 1) % pts.length];

    container.innerHTML = `
      <div style="position:absolute;left:${curr.x}%;top:${curr.y}%;transform:translate(-50%,-50%);width:22px;height:22px;display:flex;align-items:center;justify-content:center;">
        <div style="width:7px;height:7px;background:#ffffff;border:1px solid #002060;border-radius:50%;position:absolute;z-index:2;box-shadow:0 0 6px #ffffff;"></div>
        <div class="mini-shrink-ring"></div>
      </div>
    `;

    miniCalibTimer = setTimeout(() => {
      let progress = 0;
      function drawLineStep() {
        if (!document.getElementById('miniCalibAnimArea')) return;
        progress += 0.12;
        if (progress > 1) progress = 1;
        const curX = curr.x + (next.x - curr.x) * progress;
        const curY = curr.y + (next.y - curr.y) * progress;

        container.innerHTML = `
          <svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;">
            <line x1="${curr.x}%" y1="${curr.y}%" x2="${curX}%" y2="${curY}%" stroke="#ffffff" stroke-dasharray="3 3" stroke-width="2" opacity="0.95" />
          </svg>
          <div style="position:absolute;left:${curX}%;top:${curY}%;transform:translate(-50%,-50%);width:6px;height:6px;background:#ffffff;border:1px solid #002060;border-radius:50%;box-shadow:0 0 4px #ffffff;"></div>
        `;

        if (progress < 1) {
          miniCalibTimer = setTimeout(drawLineStep, 35);
        } else {
          stepIdx = (stepIdx + 1) % pts.length;
          miniCalibTimer = setTimeout(playStep, 100);
        }
      }
      drawLineStep();
    }, 600);
  }

  playStep();
}

function screenInstructions() {
  if (miniCalibTimer) clearTimeout(miniCalibTimer);
  base(`
    <div class="panel" style="width: min(1020px, 95vw); text-align: right; padding: 22px 30px;">
      <h2 style="text-align: center; color: #002060; margin-bottom: 10px;">איך עובדת המשימה?</h2>
      <p style="font-size: 20px; line-height: 1.5; margin-bottom: 8px;">
        הניסוי קצר וכולל <strong>16 סבבים</strong>. בכל סבב יקרה הרצף הבא:
      </p>
      <ul style="font-size: 19px; line-height: 1.55; margin-bottom: 12px; list-style-type: disc; padding-right: 24px;">
        <li><strong>שלב כיול קצר:</strong> עקוב/י בעיניים בלבד אחר הנקודה הלבנה שנעה על המסך (מרכז ➔ פינות ➔ מרכז) <strong>מבלי להזיז את הראש כלל</strong>.</li>

// ==========================================
// 6-Point Calibration Engine
// ==========================================
function runTransition(fromPt, toPt, duration, onComplete) {
  const startTime = performance.now();
  base(`
    <div class="calib-stage">
      <svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;">
        <line x1="${fromPt.x}%" y1="${fromPt.y}%" x2="${toPt.x}%" y2="${toPt.y}%"
              stroke="#ffffff" stroke-dasharray="6 6" stroke-width="3" opacity="0.7" />
      </svg>
      <div id="transDot" style="position:absolute;width:20px;height:20px;background:#ffffff;border:2px solid #002060;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 10px #ffffff;left:${fromPt.x}%;top:${fromPt.y}%;"></div>
    </div>
  `);
  const dot = document.getElementById('transDot');
  function step(now) {
    const progress = Math.min((now - startTime) / duration, 1);
    if (dot) {
      dot.style.left = (fromPt.x + (toPt.x - fromPt.x) * progress) + '%';
      dot.style.top = (fromPt.y + (toPt.y - fromPt.y) * progress) + '%';
    }
    if (progress < 1) requestAnimationFrame(step);
    else onComplete();
  }
  requestAnimationFrame(step);
}

function run6PointCalibration(onComplete) {
  document.getElementById('cameraPopup')?.classList.remove('show');
  const points = [
    { x: 50, y: 50 },
    { x: 10, y: 10 },
    { x: 90, y: 10 },
    { x: 90, y: 90 },
    { x: 10, y: 90 },
    { x: 50, y: 50 }
  ];

  calibDataX = [];
  calibDataY = [];
  totalCalibSamples = 0;
  smoothGazeX = null;
  smoothGazeY = null;
  const samplesPerPoint = [0, 0, 0, 0, 0, 0];

  let index = 0;

  function failCalibration(reasonMsg) {
    const popup = document.getElementById('cameraPopup');
    if (popup) popup.classList.add('show');
    base(`
      <div class="panel" style="text-align: center; max-width: 780px;">
        <h2 style="color: #b32626;">שגיאה בכיול תנועות העיניים</h2>
        <p style="font-size: 22px; margin: 16px 0;">${reasonMsg}</p>
        <p style="font-size: 20px;">נא להתייצב מול המצלמה (עד שהמסגרת בצד שמאל ירוקה) ולעקוב בעיניים אחר כל 6 הנקודות מבלי להזיז את הראש.</p>
        <p style="color: #002060; font-size: 24px; font-weight: bold; margin-top: 20px;">כדי לנסות שוב לחץ/י על מקש "רווח"</p>
      </div>
    `);
    k(e => {
      if (e.code === 'Space' || e.key === ' ') {
        e.preventDefault();
        document.onkeydown = null;
        currentTrialCalibAttempts++;
        run6PointCalibration(onComplete);
      }
    });
  }

  function runNextPoint() {
    if (index >= points.length) {
      const validSamples = calibDataX.length;
      const minRequiredValid = 35;
      const ratioOk = totalCalibSamples > 0 && (validSamples / totalCalibSamples) >= 0.50;
      const allPointsCovered = samplesPerPoint.every(c => c >= 4);

      if (validSamples < minRequiredValid || !ratioOk || !allPointsCovered) {
        failCalibration('הפנים יצאו מהמסגרת, העיניים היו עצומות או שלא זוהית בצורה רציפה במהלך הכיול.');
        return;
      }

      const X = calibDataX.map(d => d.feat);
      const Yx = calibDataX.map(d => d.target);
      const Yy = calibDataY.map(d => d.target);
      const candWX = solveLinearRegression(X, Yx);
      const candWY = solveLinearRegression(X, Yy);

      // Verify that eyes actually moved across the calibration points and tracked them consistently
      const meanDx = X.reduce((s, r) => s + (r[1] + r[3]) / 2, 0) / X.length;
      const meanDy = X.reduce((s, r) => s + (r[2] + r[4]) / 2, 0) / X.length;
      const stdDx = Math.sqrt(X.reduce((s, r) => s + (((r[1] + r[3]) / 2 - meanDx) ** 2), 0) / X.length);
      const stdDy = Math.sqrt(X.reduce((s, r) => s + (((r[2] + r[4]) / 2 - meanDy) ** 2), 0) / X.length);

      let sqErrX = 0, sqErrY = 0;
      for (let i = 0; i < X.length; i++) {
        let px = 0, py = 0;
        for (let j = 0; j < X[i].length; j++) {
          px += X[i][j] * candWX[j];
          py += X[i][j] * candWY[j];
        }
        sqErrX += (px - Yx[i]) ** 2;
        sqErrY += (py - Yy[i]) ** 2;
      }
      const rmseNormX = Math.sqrt(sqErrX / X.length) / window.innerWidth;
      const rmseNormY = Math.sqrt(sqErrY / X.length) / window.innerHeight;

      if (stdDx < 0.015 || stdDy < 0.008 || rmseNormX > 0.35 || rmseNormY > 0.35 || isNaN(rmseNormX) || isNaN(rmseNormY)) {
        failCalibration('לא זוהתה תנועת עיניים עקבית אחר 6 נקודות הכיול. יש לעקוב בעיניים אחר כל נקודה מבלי להזיז את הראש.');
        return;
      }

      weightsX = candWX;
      weightsY = candWY;
      onComplete();
      return;
    }

    const startPointLogic = () => {
      const pt = points[index];
      const currentPtIdx = index;
      base(`
        <div class="calib-stage">
          <div class="calib-target" style="left:${pt.x}%;top:${pt.y}%">
            <div class="calib-center-dot"></div>
            <div class="calib-ring"></div>
          </div>
        </div>
      `);

      const targetX = (pt.x / 100) * window.innerWidth;
      const targetY = (pt.y / 100) * window.innerHeight;
      const startTimePoint = performance.now();
      const duration = 1200;
      const ignoreInitialMs = 250;
      let lastSampleTime = 0;

      function sampleLoop(now) {
        const elapsed = now - startTimePoint;
        if (elapsed >= ignoreInitialMs && elapsed < duration) {
          if (now - lastSampleTime >= 30) {
            lastSampleTime = now;
            totalCalibSamples++;
            if (currentFeatures && isAligned) {
              calibDataX.push({ feat: [...currentFeatures], target: targetX });
              calibDataY.push({ feat: [...currentFeatures], target: targetY });
              samplesPerPoint[currentPtIdx]++;
            }
          }
        }
        if (elapsed < duration) requestAnimationFrame(sampleLoop);
        else { index++; runNextPoint(); }
      }
      requestAnimationFrame(sampleLoop);
    };

    if (index > 0) runTransition(points[index - 1], points[index], 400, startPointLogic);
    else startPointLogic();
  }

  runNextPoint();
}

// ==========================================
// 16 Unfamiliar Trials: Explicit Dot-Probe / Validation Grid
// Timeline per trial (5000ms total):
//   0 -  500ms : Baseline (4 unfamiliar faces, no highlight)
// 500 - 2750ms : Target 1 highlighted (2250ms)
//2750 - 5000ms : Target 2 highlighted (2250ms, different quadrant)
// ==========================================
function generate16ValidationTrials() {
  // 8 Female unfamiliar arrays + 8 Male unfamiliar arrays (exact unfamiliar pools)
  const femaleSets = [
    ['UNf5.webp','UNf9.webp','UNf2.webp','UNf4.webp'],
    ['UNf10.webp','UNf3.webp','UNf6.webp','UNf8.webp'],
    ['UNf14.webp','UNf4.webp','UNf7.webp','UNf10.webp'],
    ['UNf13.webp','UNf1.webp','UNf5.webp','UNf11.webp'],
    ['UNf12.webp','UNf7.webp','UNf8.webp','UNf14.webp'],
    ['UNf4.webp','UNf5.webp','UNf11.webp','UNf6.webp'],
    ['UNf9.webp','UNf11.webp','UNf12.webp','UNf3.webp'],
    ['UNf1.webp','UNf14.webp','UNf13.webp','UNf2.webp']
  ];

  const maleSets = [
    ['UNm5.webp','UNm9.webp','UNm2.webp','UNm4.webp'],
    ['UNm10.webp','UNm3.webp','UNm6.webp','UNm8.webp'],
    ['UNm14.webp','UNm4.webp','UNm7.webp','UNm10.webp'],
    ['UNm13.webp','UNm1.webp','UNm5.webp','UNm11.webp'],
    ['UNm12.webp','UNm7.webp','UNm8.webp','UNm14.webp'],
    ['UNm4.webp','UNm5.webp','UNm11.webp','UNm6.webp'],
    ['UNm9.webp','UNm11.webp','UNm12.webp','UNm3.webp'],
    ['UNm1.webp','UNm14.webp','UNm13.webp','UNm2.webp']
  ];

  // Counterbalanced pairs of (target1, target2) across locations 1..4 (each location appears 4 times as T1 and 4 times as T2)
  const targetPairs = [
    [1, 3], [2, 4], [3, 1], [4, 2],
    [1, 2], [2, 3], [3, 4], [4, 1],
    [1, 4], [2, 1], [3, 2], [4, 3],
    [1, 3], [2, 4], [3, 1], [4, 2]
  ].sort(() => Math.random() - 0.5);

  const combined = [
    ...femaleSets.map(faces => ({ block: 'F', faces })),
    ...maleSets.map(faces => ({ block: 'M', faces }))
  ].sort(() => Math.random() - 0.5);

  return combined.map((item, idx) => ({
    block: item.block,
    faces: item.faces,
    target1: targetPairs[idx][0],
    target2: targetPairs[idx][1]
  }));
}

function runValidationExperiment() {
  document.body.style.cursor = 'none';
  const trialsList = generate16ValidationTrials();
  let trialIdx = 0;

  const nextTrial = () => {
    if (trialIdx >= trialsList.length) {
      document.body.style.cursor = 'default';
      finishSavingScreen();
      return;
    }

    const tr = trialsList[trialIdx++];
    const tno = trialIdx;
    currentTrialCalibAttempts = 1;

    base(`
      <div style="text-align: center;">
        <div style="font-size: 46px; font-weight: bold; color: #ffffff; text-shadow: 0 2px 8px rgba(0,0,0,0.35);">
          סבב ${tno} מתוך ${trialsList.length}
        </div>
      </div>
    `);

    setTimeout(() => {
      run6PointCalibration(() => {
        base(`
          <div class="trial-grid" style="visibility:hidden">
            ${tr.faces.map((f, i) => `
              <div id="card_${i+1}" class="face-card p${i+1}">
                <div class="target-badge">התמקד/י כאן</div>
                ${picture(f)}
              </div>
            `).join('')}
          </div>
        `);

      const imgElements = Array.from(document.querySelectorAll('.trial-grid img'));
      Promise.all(imgElements.map(img => img.decode ? img.decode().catch(()=>{}) : Promise.resolve())).then(() => {
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            const grid = document.querySelector('.trial-grid');
            if (!grid) return;
            grid.style.visibility = 'visible';

            const t0 = performance.now();
            const isExcluded = currentTrialCalibAttempts > 3;

            S.trials.push({
              participant: S.id,
              trial: tno,
              block: tr.block,
              face1: tr.faces[0],
              face2: tr.faces[1],
              face3: tr.faces[2],
              face4: tr.faces[3],
              target1: tr.target1,
              target2: tr.target2,
              calibAttempts: currentTrialCalibAttempts,
              excluded: isExcluded ? 1 : 0
            });

            // Switch highlight at 500ms -> Target 1
            const t1Timer = setTimeout(() => {
              document.getElementById(`card_${tr.target1}`)?.classList.add('target-active');
            }, 500);

            // Switch highlight at 2750ms -> Target 2
            const t2Timer = setTimeout(() => {
              document.getElementById(`card_${tr.target1}`)?.classList.remove('target-active');
              document.getElementById(`card_${tr.target2}`)?.classList.add('target-active');
            }, 2750);

            // Track gaze for 5000ms
            trackValidationTrial(t0, tr.block, tno, tr.target1, tr.target2, isExcluded);

            // End trial at 5000ms -> 1500ms fixation -> next trial
            setTimeout(() => {
              clearTimeout(t1Timer);
              clearTimeout(t2Timer);
              base(`<div class="bottom-fix">+</div>`);
              setTimeout(nextTrial, 1500);
            }, 5000);
          });
        });
      });
      });
    }, 1500);
  };

  nextTrial();
}

function trackValidationTrial(t0, block, trial, target1, target2, isExcluded) {
  const stopAt = t0 + 5000;
  const inc1exc0 = isExcluded ? 0 : 1;

  const sampleFrame = () => {
    const now = performance.now();
    const elapsed = now - t0;
    if (now >= stopAt) return;

    let phase = 'Baseline';
    let activeTarget = 0; // 0 = no target highlighted yet (0-500ms)
    if (elapsed > 500 && elapsed <= 2750) {
      phase = 'Target1';
      activeTarget = target1;
    } else if (elapsed > 2750) {
      phase = 'Target2';
      activeTarget = target2;
    }

    const gaze = predictGaze();
    let normX = null, normY = null, quadrant = null, gaze_location = null, on_target = 0;

    if (gaze && gaze.x !== null && gaze.y !== null) {
      normX = gaze.x / window.innerWidth;
      normY = gaze.y / window.innerHeight;

      if (normX < 0.5 && normY < 0.5) { quadrant = "TopLeft"; gaze_location = 1; }
      else if (normX >= 0.5 && normY < 0.5) { quadrant = "TopRight"; gaze_location = 2; }
      else if (normX >= 0.5 && normY >= 0.5) { quadrant = "BottomRight"; gaze_location = 3; }
      else if (normX < 0.5 && normY >= 0.5) { quadrant = "BottomLeft"; gaze_location = 4; }
    }

    if (activeTarget !== 0 && gaze_location !== null && gaze_location === activeTarget) {
      on_target = 1;
    }

    S.raw.push({
      participant: S.id,
      block: block,
      trial: trial,
      included1excluded0: inc1exc0,
      timestamp: Number(elapsed.toFixed(2)),
      phase: phase,
      target1: target1,
      target2: target2,
      active_target: activeTarget,
      gazeX: gaze?.x ? Number(gaze.x.toFixed(2)) : null,
      gazeY: gaze?.y ? Number(gaze.y.toFixed(2)) : null,
      normX: normX !== null ? Number(normX.toFixed(4)) : null,
      normY: normY !== null ? Number(normY.toFixed(4)) : null,
      quadrant: quadrant,
      gaze_location: gaze_location,
      on_target: on_target,
      HIF: isAligned ? 1 : 0,
      screenWidth: window.innerWidth,
      screenHeight: window.innerHeight
    });

    requestAnimationFrame(sampleFrame);
  };

  requestAnimationFrame(sampleFrame);
}

// ==========================================
// Build Validation CSVs (Summary & Raw Gaze)
// ==========================================
function buildValidationSummaryCSV() {
  const allTrials = S.trials;
  const validTrials = allTrials.filter(t => !t.excluded);
  const validTrialNums = new Set(validTrials.map(t => t.trial));

  const mean = arr => arr.length ? (arr.reduce((a, b) => a + b, 0) / arr.length) : null;
  const pct = (num, den) => den ? ((num / den) * 100) : null;
  const fmt = val => (val !== null && val !== undefined && !isNaN(val)) ? Number(val).toFixed(2) : '';

  const noOfExcludedTrials = allTrials.filter(t => t.excluded).length;
  const perOfExcludedTrials = pct(noOfExcludedTrials, allTrials.length);

  const totalTrackingSeconds = allTrials.length * 5;
  const avgSamplingRateFPS = totalTrackingSeconds > 0 ? (S.raw.length / totalTrackingSeconds) : null;

  const validRaw = S.raw.filter(r => validTrialNums.has(r.trial));

  // Accuracy in Target 1 (full 500-2750ms) and Target 1 Settled (after 300ms saccade latency: 800-2750ms)
  const t1Samples = validRaw.filter(r => r.phase === 'Target1');
  const t1SettledSamples = validRaw.filter(r => r.phase === 'Target1' && r.timestamp >= 800);

  // Accuracy in Target 2 (full 2750-5000ms) and Target 2 Settled (after 300ms saccade latency: 3050-5000ms)
  const t2Samples = validRaw.filter(r => r.phase === 'Target2');
  const t2SettledSamples = validRaw.filter(r => r.phase === 'Target2' && r.timestamp >= 3050);

  // Overall accuracy across both active target phases
  const allActiveSamples = validRaw.filter(r => r.active_target !== 0);
  const allSettledSamples = [...t1SettledSamples, ...t2SettledSamples];

  // Chance baseline check: during Baseline (0-500ms), how often is gaze already on Target 1 by chance? (Expected ~25%)
  const baselineSamples = validRaw.filter(r => r.phase === 'Baseline');
  const baselineOnT1Pct = baselineSamples.length
    ? (baselineSamples.filter(r => r.gaze_location === r.target1).length / baselineSamples.length) * 100
    : null;

  // Per-quadrant accuracy
  const quadAcc = (q) => {
    const qSamples = allSettledSamples.filter(r => r.active_target === q);
    if (!qSamples.length) return null;
    return (qSamples.filter(r => r.on_target === 1).length / qSamples.length) * 100;
  };

  // Compute Saccade / Gaze Acquisition Latency per trial (ms from cue onset until 2 consecutive samples land on target)
  const t1Latencies = [];
  const t2Latencies = [];

  validTrials.forEach(tr => {
    const trSamples = validRaw.filter(r => r.trial === tr.trial);

    const s1 = trSamples.filter(r => r.phase === 'Target1');
    for (let i = 0; i < s1.length - 1; i++) {
      if (s1[i].on_target === 1 && s1[i+1].on_target === 1) {
        t1Latencies.push(s1[i].timestamp - 500);
        break;
      }
    }

    const s2 = trSamples.filter(r => r.phase === 'Target2');
    for (let i = 0; i < s2.length - 1; i++) {
      if (s2[i].on_target === 1 && s2[i+1].on_target === 1) {
        t2Latencies.push(s2[i].timestamp - 2750);
        break;
      }
    }
  });

  const rows = [];
  rows.push('--- VALIDATION AGGREGATED SUMMARY METRICS ---');
  const summaryHeaders = [
    'participant', 'age', 'gender',
    'total_trials', 'NoOfExcludedTrials', 'PerOfExcludedTrials', 'avg_sampling_rate_fps',
    'baseline_chance_t1_pct',
    'overall_target_accuracy_pct', 'overall_settled_accuracy_pct',
    'target1_full_accuracy_pct', 'target1_settled_accuracy_pct',
    'target2_full_accuracy_pct', 'target2_settled_accuracy_pct',
    'mean_latency_to_target1_ms', 'mean_latency_to_target2_ms',
    'accuracy_q1_TopLeft_pct', 'accuracy_q2_TopRight_pct',
    'accuracy_q3_BottomRight_pct', 'accuracy_q4_BottomLeft_pct'
  ];
  rows.push(summaryHeaders.join(','));

  const summaryValues = [
    `"${S.id}"`, `"${S.age}"`, `"${S.gender}"`,
    `"${allTrials.length}"`, `"${noOfExcludedTrials}"`, `"${fmt(perOfExcludedTrials)}"`, `"${fmt(avgSamplingRateFPS)}"`,
    `"${fmt(baselineOnT1Pct)}"`,
    `"${fmt(pct(allActiveSamples.filter(r => r.on_target === 1).length, allActiveSamples.length))}"`,
    `"${fmt(pct(allSettledSamples.filter(r => r.on_target === 1).length, allSettledSamples.length))}"`,
    `"${fmt(pct(t1Samples.filter(r => r.on_target === 1).length, t1Samples.length))}"`,
    `"${fmt(pct(t1SettledSamples.filter(r => r.on_target === 1).length, t1SettledSamples.length))}"`,
    `"${fmt(pct(t2Samples.filter(r => r.on_target === 1).length, t2Samples.length))}"`,
    `"${fmt(pct(t2SettledSamples.filter(r => r.on_target === 1).length, t2SettledSamples.length))}"`,
    `"${fmt(mean(t1Latencies))}"`,
    `"${fmt(mean(t2Latencies))}"`,
    `"${fmt(quadAcc(1))}"`,
    `"${fmt(quadAcc(2))}"`,
    `"${fmt(quadAcc(3))}"`,
    `"${fmt(quadAcc(4))}"`
  ];
  rows.push(summaryValues.join(','));

  rows.push('');
  rows.push('--- VALIDATION TRIAL-BY-TRIAL BREAKDOWN ---');
  const trialHeaders = [
    'participant', 'trial', 'block', 'face1', 'face2', 'face3', 'face4',
    'target1', 'target2', 't1_settled_acc_pct', 't2_settled_acc_pct',
    'latency_t1_ms', 'latency_t2_ms', 'calibration_attempts', 'excluded'
  ];
  rows.push(trialHeaders.join(','));

  allTrials.forEach(tr => {
    const trRaw = S.raw.filter(r => r.trial === tr.trial);
    const s1 = trRaw.filter(r => r.phase === 'Target1' && r.timestamp >= 800);
    const s2 = trRaw.filter(r => r.phase === 'Target2' && r.timestamp >= 3050);

    const acc1 = pct(s1.filter(r => r.on_target === 1).length, s1.length);
    const acc2 = pct(s2.filter(r => r.on_target === 1).length, s2.length);

    let lat1 = null;
    const s1Full = trRaw.filter(r => r.phase === 'Target1');
    for (let i = 0; i < s1Full.length - 1; i++) {
      if (s1Full[i].on_target === 1 && s1Full[i+1].on_target === 1) {
        lat1 = s1Full[i].timestamp - 500;
        break;
      }
    }

    let lat2 = null;
    const s2Full = trRaw.filter(r => r.phase === 'Target2');
    for (let i = 0; i < s2Full.length - 1; i++) {
      if (s2Full[i].on_target === 1 && s2Full[i+1].on_target === 1) {
        lat2 = s2Full[i].timestamp - 2750;
        break;
      }
    }

    rows.push([
      `"${S.id}"`, `"${tr.trial}"`, `"${tr.block}"`,
      `"${tr.face1}"`, `"${tr.face2}"`, `"${tr.face3}"`, `"${tr.face4}"`,
      `"${tr.target1}"`, `"${tr.target2}"`,
      `"${fmt(acc1)}"`, `"${fmt(acc2)}"`,
      `"${fmt(lat1)}"`, `"${fmt(lat2)}"`,
      `"${tr.calibAttempts}"`, `"${tr.excluded}"`
    ].join(','));
  });

  return rows.join('\n');
}

function buildValidationRawGazeCSV() {
  if (!S.raw || S.raw.length === 0) return '';
  const headers = [
    'participant', 'block', 'trial', 'included1excluded0', 'timestamp', 'phase',
    'target1', 'target2', 'active_target', 'gazeX', 'gazeY', 'normX', 'normY',
    'quadrant', 'gaze_location', 'on_target', 'HIF', 'screenWidth', 'screenHeight'
  ];
  const rows = [headers.join(',')];
  S.raw.forEach(r => {
    const row = headers.map(h => {
      const val = r[h] === null || r[h] === undefined ? '' : r[h];
      return `"${String(val).replace(/"/g, '""')}"`;
    });
    rows.push(row.join(','));
  });
  return rows.join('\n');
}

function downloadCSV(csvContent, fileName) {
  if (!csvContent) return;
  const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  const url = URL.createObjectURL(blob);
  link.setAttribute('href', url);
  link.setAttribute('download', fileName);
  link.style.visibility = 'hidden';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// ==========================================
// Save to Dedicated Firestore Collection: 'validation_participants'
// ==========================================
function finishSavingScreen() {
  if (cameraUtils) cameraUtils.stop();
  const popup = document.getElementById('cameraPopup');
  if (popup) {
    popup.classList.remove('show', 'good', 'bad');
    popup.style.display = 'none';
  }

  base(`${picture('biu_logo.png','logo')}<div class="panel"><h1>שומר נתוני ולידציה...</h1><p>אנא המתן/י, הנתונים נשמרים תחת מספר משתתף ${S.id}. <span style="color: darkred; font-weight: bold;">אין לסגור את הדף.</span></p></div>`);

  const csvSummary = buildValidationSummaryCSV();
  const csvRaw = buildValidationRawGazeCSV();

  db.collection('validation_participants').doc(`val_participant_${S.id}`).set({
    participantId: S.id,
    age: S.age || null,
    gender: S.gender || null,
    summaryCSV: csvSummary,
    rawGazeCSV: csvRaw,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  })
  .then(() => {
    finalScreen(false);
  })
  .catch((error) => {
    console.error("Firestore save error:", error);
    downloadCSV(csvSummary, `val_participant_${S.id}_summary.csv`);
    downloadCSV(csvRaw, `val_participant_${S.id}_raw_gaze.csv`);
    finalScreen(true);
  });
}

function finalScreen(hasError = false) {
  const msg = hasError
    ? "הניסוי הסתיים. הייתה שגיאת חיבור לענן, ולכן קובצי ה-CSV הורדו אוטומטית למחשב כגיבוי."
    : "הניסוי הסתיים והנתונים נשמרו בהצלחה בשרת!";
  base(`
    ${picture('biu_logo.png','logo')}
    <div class="panel">
      <h1>תודה רבה על ההשתתפות! 😊</h1>
      <p style="font-size:22px;">${msg}</p>
      <h2 style="margin-top:24px;color:#ffea00;">ניתן לצאת כעת מהדף.</h2>
    </div>
  `);
}

preload();
</script>
