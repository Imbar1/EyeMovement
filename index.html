const A='https://raw.githubusercontent.com/Imbar1/EyeMovement/main/resources/';
const assets=['biu_logo.png','forward.png','only_forward.jpg','back_and_forward.jpg','glasses_YN.jpg','consent_pic.jpg','confir.png','b_women_pics.jpg','b_men_pics.jpg','SMT_instructions.jpg','SMT_example.jpg','twoSessInst.jpg','b_practice.jpg','b_STM.jpg','b_sig_rate.jpg','EM_instructions.jpg',...Array.from({length:10},(_,i)=>`P${i+1}.webp`),...Array.from({length:14},(_,i)=>`UNf${i+1}.webp`),...Array.from({length:14},(_,i)=>`UNm${i+1}.webp`),...Array.from({length:12},(_,i)=>`F${i+1}.webp`),...Array.from({length:12},(_,i)=>`M${i+1}.webp`)];

const root=document.getElementById('app');

const imageCache=new Map();
function loadImageCached(name){
  const key=String(name).split('/').pop();
  if(imageCache.has(key)) return imageCache.get(key);
  const p=new Promise(resolve=>{
    const im=new Image();
    im.decoding='async';
    im.onload=async()=>{try{if(im.decode) await im.decode()}catch(e){} resolve(im)};
    im.onerror=()=>{console.warn('Asset failed to load:',key);resolve(null)};
    im.src=assetUrl(key);
  });
  imageCache.set(key,p);
  return p;
}
function preloadTrial(names){return Promise.all(names.map(loadImageCached))}
const enc=n=>A+encodeURIComponent(n);
const assetUrl=n=>enc(n);
const picture=(n,c='')=>`<img class="${c}" src="${assetUrl(n)}" alt="${n}" loading="eager">`;
function base(h){root.innerHTML=`<section class="screen">${h}</section>`}
function k(fn){document.onkeydown=e=>fn(e)}

// פונקציית עזר למעבר למסך מלא
function enterFullscreen() {
  const elem = document.documentElement;
  if (elem.requestFullscreen) {
    elem.requestFullscreen();
  } else if (elem.mozRequestFullScreen) { /* Firefox */
    elem.mozRequestFullScreen();
  } else if (elem.webkitRequestFullscreen) { /* Chrome, Safari & Opera */
    elem.webkitRequestFullscreen();
  } else if (elem.msRequestFullscreen) { /* IE/Edge */
    elem.msRequestFullscreen();
  }
}

// ==========================================
// MediaPipe Face Mesh & Custom Regression Model
// ==========================================
let faceMesh = null;
let cameraUtils = null;
let currentFeatures = null;
let calibDataX = [];
let calibDataY = [];
let weightsX = null;
let weightsY = null;

let goodStateStartTime = 0;
let isAligned = false;

function solveLinearRegression(X, Y) {
  const N = X.length;
  const K = X[0].length;
  let XTX = Array.from({length: K}, () => new Array(K).fill(0));
  for(let i=0; i<K; i++) {
    for(let j=0; j<K; j++) {
      for(let n=0; n<N; n++) {
        XTX[i][j] += X[n][i] * X[n][j];
      }
    }
  }
  for(let i=0; i<K; i++) XTX[i][i] += 1e-4;

  let I = Array.from({length: K}, (_, i) => Array.from({length: K}, (_, j) => i === j ? 1 : 0));
  let M = XTX.map(row => [...row]);

  for(let i=0; i<K; i++) {
    let pivot = M[i][i];
    if(Math.abs(pivot) < 1e-9) pivot = 1e-9;
    for(let j=0; j<K; j++) {
      M[i][j] /= pivot;
      I[i][j] /= pivot;
    }
    for(let k=0; k<K; k++) {
      if(k !== i) {
        let factor = M[k][i];
        for(let j=0; j<K; j++) {
          M[k][j] -= factor * M[i][j];
          I[k][j] -= factor * I[i][j];
        }
      }
    }
  }
  let invXT = Array.from({length: K}, () => new Array(N).fill(0));
  for(let i=0; i<K; i++) {
    for(let n=0; n<N; n++) {
      for(let j=0; j<K; j++) {
        invXT[i][n] += I[i][j] * X[n][j];
      }
    }
  }
  let W = new Array(K).fill(0);
  for(let i=0; i<K; i++) {
    for(let n=0; n<N; n++) {
      W[i] += invXT[i][n] * Y[n];
    }
  }
  return W;
}

function predictGaze() {
  if(!weightsX || !weightsY || !currentFeatures) return null;
  let x = 0, y = 0;
  for(let i=0; i<currentFeatures.length; i++) {
    x += currentFeatures[i] * weightsX[i];
    y += currentFeatures[i] * weightsY[i];
  }
  return {x, y};
}

function initFaceMeshSystem() {
  if(faceMesh) return Promise.resolve(true);

  const video = document.getElementById('webcamVideo');
  const canvas = document.getElementById('meshCanvas');
  const ctx = canvas.getContext('2d');
  const popup = document.getElementById('cameraPopup');
  const statusTxt = document.getElementById('cameraStatusText');

  faceMesh = new FaceMesh({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
  });

  faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  faceMesh.onResults(results => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
      const lm = results.multiFaceLandmarks[0];
      
      if (typeof drawConnectors === 'function' && typeof FACEMESH_TESSELATION !== 'undefined') {
        drawConnectors(ctx, lm, FACEMESH_TESSELATION, {color: '#00FFFF', lineWidth: 0.5});
      }

      ctx.fillStyle = '#00FFFF';
      for(let i=0; i<lm.length; i+=10) {
        ctx.beginPath();
        ctx.arc(lm[i].x * canvas.width, lm[i].y * canvas.height, 1.2, 0, 2 * Math.PI);
        ctx.fill();
      }

      ctx.fillStyle = '#FF007F';
      [468, 473].forEach(i => {
        ctx.beginPath();
        ctx.arc(lm[i].x * canvas.width, lm[i].y * canvas.height, 2.5, 0, 2 * Math.PI);
        ctx.fill();
      });

      const lIris = lm[468], rIris = lm[473], nose = lm[1];
      currentFeatures = [1, lIris.x, lIris.y, rIris.x, rIris.y, nose.x, nose.y];

      const centered = nose.x > 0.25 && nose.x < 0.75 && nose.y > 0.20 && nose.y < 0.80;

      if (centered) {
        isAligned = true;
        popup.classList.remove('bad');
        popup.classList.add('good');
        statusTxt.textContent = 'הפנים זוהו';

        if (!goodStateStartTime) goodStateStartTime = performance.now();
        if (performance.now() - goodStateStartTime >= 200) {
          popup.classList.remove('show');
        }
      } else {
        isAligned = false;
        goodStateStartTime = 0;
        popup.classList.remove('good');
        popup.classList.add('bad', 'show');
        statusTxt.textContent = 'חריגה מהמסגרת';
      }
    } else {
      currentFeatures = null;
      isAligned = false;
      goodStateStartTime = 0;
      popup.classList.remove('good');
      popup.classList.add('bad', 'show');
      statusTxt.textContent = 'פנים לא זוהו';
    }
  });

  cameraUtils = new Camera(video, {
    onFrame: async () => {
      await faceMesh.send({image: video});
    },
    width: 320,
    height: 240
  });

  return cameraUtils.start().then(() => {
    popup.classList.add('show');
    return true;
  });
}

async function preload(){
  base(`<div class="panel"><h1>נא להמתין בזמן שכל חומרי הניסוי נטענים</h1><p>אנא המתן/י עד לסיום הטעינה. אין לסגור את החלון.</p><progress id="pr" max="${assets.length}" value="0"></progress><p id="pc">0%</p></div>`);

    percent.textContent=Math.round(completed/assets.length*100)+'%';
  }));
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));

}

// שינוי 2: מעבר למסך מלא לאחר הזנת מספר משתתף
function screen1(){base(`<div class="panel"><h1>ברוכים הבאים למחקר</h1><p>נא הזן/י את מספר המשתתף/ת.</p><input id="pid" class="input" inputmode="numeric"><br><button class="btn" id="go">המשך</button><p id="err" class="status"></p></div>`);document.getElementById('go').addEventListener('click',()=>{const value=document.getElementById('pid').value.trim();if(!value){document.getElementById('err').textContent='נא להזין מספר';return}S.id=value;enterFullscreen(); /* הפעלת מסך מלא */screenDemographics()})}
function screenDemographics(){base(`<div class="panel"><h2>פרטים אישיים</h2><p>נא להזין/י את גילך ולבחור מגדר.</p><label for="age">גיל</label><br><input id="age" class="input" type="text" inputmode="numeric" autocomplete="off"><br><label for="gender">מגדר</label><br><select id="gender" class="input"><option value="">יש לבחור</option><option value="זכר">זכר</option><option value="נקבה">נקבה</option></select><br><button class="btn" id="demoGo">המשך</button><p id="demoErr" class="status"></p></div>`);document.getElementById('demoGo').addEventListener('click',()=>{const age=document.getElementById('age').value.trim();const gender=document.getElementById('gender').value;if(!age){document.getElementById('demoErr').textContent='נא להזין גיל';return}if(!gender){document.getElementById('demoErr').textContent='נא לבחור מגדר';return}S.age=age;S.gender=gender;screen2()})}

function consentScreen(){base(`<div class="panel consent-form"><h2>טופס הסכמה מדעת להשתתפות בניסוי At First Glance</h2><p><strong>שם המחקר:</strong> At First Glance</p><p><strong>שם החוקר האחראי:</strong> אמבר מזרחי, המחלקה לקרימינולוגיה, אוניברסיטת בר-אילן.</p><p><strong>מטרת המחקר:</strong> מטרת המחקר הינה לבחון את זיהוי פריטים (זיכרון) בעת הצגת פריטים שונים על המסך, בהתאם להוראות שיוצגו בהמשך.</p><p><strong>מה תתבקש/י לעשות במחקר?</strong><br>בניסוי זה תבקש/י לבצע משימה מסוימת שבמהלכה ימדדו תנועות עינייך ביחידות של מספרים. נדגיש כי פנייך לא יוקלטו!</p><p><strong>כמה זמן ייקח המחקר?</strong> משך הניסוי הוא כ-15 דק'.</p><p><strong>מהם הסיכונים האפשריים הכרוכים בהשתתפות במחקר?</strong> אין סיכונים.</p><p><strong>איזו תועלת תצמח לך מהמחקר?</strong><br>תוכל/י לקבל חצי קופון. בנוסף, תוצאות הניסוי עשויות לתרום להבנה התאורטית של מבחן ה-CIT אשר מהווה תנאי חשוב ליישומו של מבחן זה.</p><p><strong>איך נשמור על המידע שנאגר במסגרת הניסוי?</strong><br>כדי להבטיח את שמירת החיסיון של המידע האישי שלך, כל נתוני המידע יקודדו ויישמרו במחשב באופן אנונימי ונפרד מהפרטים המזהים. בנוסף, לא יעשה שימוש מזהה כלשהו בנתונים שלך בפורום כלשהו או בפרסום מדעי או תקשורתי כלשהו.</p><p><strong>מה יקרה אם תרצה להפסיק את הניסוי באמצע?</strong><br>ההשתתפות בניסוי היא על בסיס התנדבותי. לפיכך – זכותך להפסיק את השתתפותך בניסוי בכל עת ומכל סיבה שהיא. לא תהינה שום השלכות לכך שבחרת להפסיק את הניסוי והחלטה זו לא תפגע בך בשום אופן. בנוסף, את הקרדיט היחסי עבור הניסוי תקבל גם במקרה שתחליט לפרוש.</p><p>במקרה הצורך ניתן ליצור קשר עם החוקרת האחראית – <strong>אמבר מזרחי</strong> – בכל שאלה ועניין בטלפון 050-3477040 ובאי-מייל imbar.mizrahi123@gmail.com.</p><p><strong>מידע ליצירת קשר לעזרה במקרה של פגיעה מהמחקר</strong><br>במידה ותרצה לשוחח על מחקר זה עם משהו שאינו מעורב ישירות במחקר, תוכל לדבר עם <strong>ד&quot;ר יהונתן לוי</strong> בכתובת המייל הבאה: jonathan.levy@biu.ac.il.</p><div class="consent-actions"><button class="btn" id="agree">אני מסכים/ה להשתתף בניסוי</button><button class="btn no-btn" id="decline">אני לא מ function trial(row,done){
  const faces=row.slice(0,4).map(x=>String(x).endsWith('.webp')?String(x):String(x)+'.webp');
  base('<div class="fix">+</div>');
  const loadPromise=preloadTrial(faces);

  Promise.all([loadPromise,timerPromise]).then(()=>{
    // שינוי 3: העכבר מוסתר כאן באמצעות ה-CSS של .trial-grid
    base(`<div class="trial-grid" style="visibility:hidden">${faces.map((x,i)=>picture(x,'pos p'+(i+1))).join('')}</div>`);

      const grid=document.querySelector('.trial-grid');

  }).catch(err=>{console.error('Trial preload failed',err);if(typeof done==='function')done();});

function response(row,done){

  const t=performance.now();
  let answered=false;
  let timeoutId=null;
  document.onkeydown=null;
  document.onkeydown=e=>{
    const key=String(e.key||'').toLowerCase();
    const q=e.code==='KeyI'||key==='i'||key==='ך'?'i':e.code==='KeyE'||key==='e'||key==='ק'?'e':'';
    if(!q||answered)return;
    e.preventDefault();
    e.stopImmediatePropagation();
    answered=true;
    clearTimeout(timeoutId);
    document.onkeydown=null;
    S.trials.push({phase:'practice',rt:performance.now()-t,key:q,correct:q===row[5]});
    const finishAnswer=()=>{if(typeof done==='function')done()};
    if(showFeedback){base(`<h2 style="color:${q===row[5]?'#00a83b':'#b32626'}">${q===row[5]?'תשובה נכונה':'תשובה שגויה'}</h2>`);setTimeout(finishAnswer,700)}
    else finishAnswer()
  };
  timeoutId=setTimeout(()=>{
    if(answered)return;
    answered=true;
    document.onkeydown=null;
    if(showFeedback){base('<h2 style="color:#9b3f3f">לאט מידי</h2>');setTimeout(()=>{if(typeof done==='function')done()},700)}
    else if(typeof done==='function')done()
  },2000);
  window.focus();
}

function calibrate(block){
  let attempts = 1;
  const points = [
    {x:10,y:10},{x:50,y:10},{x:90,y:10},
    {x:10,y:50},{x:50,y:50},{x:90,y:50},
    {x:10,y:90},{x:50,y:90},{x:90,y:90}
  ];

  calibDataX = [];
  calibDataY = [];

  const instruction = () => {
    base('<div class="panel"><h2>הוראות כיול</h2><p>הסתכל/י על הנקודה הלבנה ולחץ/י עליה 5 פעמים. שמור/י על הראש יציב.</p><button class="btn" id="startCal">התחל כיול</button></div>');
    document.getElementById('startCal').onclick = run;
  };

  const run = () => {
    let index = 0;
    const next = () => {
      if(index >= points.length){
        if(calibDataX.length >= 10) {
          const X = calibDataX.map(d => d.feat);
          const Yx = calibDataX.map(d => d.target);
          const Yy = calibDataY.map(d => d.target);
          weightsX = solveLinearRegression(X, Yx);
          weightsY = solveLinearRegression(X, Yy);
        }
        if(block === 1){ S.cal1 = attempts; S.calAcc1 = 100; }
        else { S.cal2 = attempts; S.calAcc2 = 100; }
        screen13(block);
        return;
      }
      const q = points[index];
      base(`<div class="calibration"><button type="button" class="calpoint" id="target" aria-label="נקודת כיול" style="left:${q.x}%;top:${q.y}%"></button></div>`);
      const target = document.getElementById('target');
      let clicks = 0, locked = false;

      target.addEventListener('click', event => {
        if(locked) return;
        event.preventDefault();
        
        if(currentFeatures) {
          const targetX = (q.x / 100) * window.innerWidth;
          const targetY = (q.y / 100) * window.innerHeight;
          calibDataX.push({ feat: [...currentFeatures], target: targetX });
          calibDataY.push({ feat: [...currentFeatures], target: targetY });
        }

        clicks++;
        target.textContent = clicks;
        if(clicks >= 5){
          locked = true;
          target.classList.add('done');
          setTimeout(()=>{ index++; next(); }, 300);
        }
      }, {passive:false});
    };
    next();
  };
  instruction();
}

function track(t0,sex,trial){
  const stopAt=t0+5000;
  const f=()=>{
    const now=performance.now();
    if(now>=stopAt)return;
    const gaze = predictGaze();
    S.raw.push({
      participant:S.id,
      block:sex,
      trial,
      timestamp:now-t0,
      gazeX:gaze?.x??null,
      gazeY:gaze?.y??null,
      screenWidth:innerWidth,
      screenHeight:innerHeight,
      phase:now-t0<=1000?'Phase1':'Phase2'
    });
    requestAnimationFrame(f);
  };
  requestAnimationFrame(f);
}

  const go=()=>{
    if(!ratings.i)ratings.i=0;
    if(ratings.i>=all.length) return finishSavingScreen(); // שינוי 5: מעבר למסך השמירה

    // שימוש במחלקות ה-CSS החדשות לעיצוב
    base(`
      <div class="rating-instruction-text">באיזה מידה פרצוף זה תפס לך את העין?</div>
      ${picture(all[ratings.i],'rating-face')}
      <div class="rating-labels">
        <span>1 = במידה מועטה מאוד</span>
        <span>9 = במידה רבה מאוד</span>
      </div>
      <div class="scale">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="ratings.rate(${n})">${n}</button>`).join('')}
      </div>
    `);
  };
  ratings.rate=n=>{
    S.ratings.push({stimulus:all[ratings.i],rating:n});
    ratings.i++;
    go();
  };
  go();
}

// שינוי 5: מסך ביניים "שומר נתונים" ווידוא שמירה ב-Firebase
function finishSavingScreen() {
  // הצגת מסך ההמתנה
  base(`${picture('biu_logo.png','logo')}<div class="panel"><h1>אנא המתן/ני בזמן שהנתונים נשמרים</h1><p>הנתונים נשלחים לשרת תחת מספר משתתף ${S.id}. אנא אל תסגור/י את הדף.</p></div>`);

  const dataToSave = {
    participant_summary:{
      ParticipantNo:S.id,
      Age:S.age,
      Gender:S.gender,
      Calibration_Attempts_block1:S.cal1,
      Calibration_Attempts_block2:S.cal2,
      Calibration_Accuracy_Score_Block1:S.calAcc1,
      Calibration_Accuracy_Score_Block2:S.calAcc2,
      raw_gaze_count:S.raw.length,
      ratings:S.ratings
    },
    raw_gaze:S.raw,
    trials:S.trials,
    timestamp: new Date().toISOString()
  };

  // גיבוי מקומי בתוך הדפדפן (localStorage)
  localStorage.setItem('participant_'+S.id+'_data',JSON.stringify(dataToSave));

  // שמירה בענן ב-Firebase Firestore
  // אנחנו משתמשים במספר המשתתף (S.id) כשם המסמך (.doc(String(S.id)))
  db.collection("participants").doc(String(S.id)).set(dataToSave)
    .then(() => {
      // השמירה הצליחה - עוברים למסך הסיום הסופי
      console.log("הנתונים נשמרו בהצלחה ב-Firebase.");
      finalScreen();
    })
    .catch((error) => {
      // חלילה יש שגיאה - מציגים הודעה אבל עדיין מאפשרים לסיים (כי יש גיבוי מקומי)
      console.error("שגיאה בשמירת נתונים ל-Firebase:", error);
      finalScreen(true); // מעבירים true כדי לציין שהייתה שגיאה
    });
}

// שינוי 6: מסך סיום סופי עם תוספת "ניתן לצאת"
function finalScreen(hasError = false) {
  let message = "הניסוי הסתיים והנתונים נשמרו בהצלחה.";
  if (hasError) {
    message = "הניסוי הסתיים. הייתה שגיאה בשמירה לענן, אך הנתונים נשמרו בגיבוי המקומי של הדפדפן.";
  }

  base(`
    ${picture('biu_logo.png','logo')}
    <div class="panel">
      <h1>תודה רבה על השתתפותך 😊</h1>
      <p>${message}</p>
      <h2 style="margin-top: 30px; color: #ffea00;">כעת ניתן לצאת מדף זה.</h2>
    </div>
  `);
}

function exit(t){base(`<div class="panel"><h2>${t}</h2></div>`)}

// טעינה מקדימה של כל המשאבים
preload();
</script>
</body>
</html>
