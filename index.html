// ==========================================

const A='https://raw.githubusercontent.com/Imbar1/EyeMovement/main/resources/';
const assets=['biu_logo.png','forward.png','only_forward.jpg','back_and_forward.jpg','glasses_YN.jpg','consent_pic.jpg','confir.png','b_women_pics.jpg','b_men_pics.jpg','SMT_instructions.jpg','SMT_example.jpg','twoSessInst.jpg','b_practice.jpg','b_STM.jpg','b_sig_rate.jpg','EM_instructions.jpg',...Array.from({length:10},(_,i)=>`P${i+1}.webp`),...Array.from({length:14},(_,i)=>`UNf${i+1}.webp`),...Array.from({length:14},(_,i)=>`UNm${i+1}.webp`),...Array.from({length:12},(_,i)=>`F${i+1}.webp`),...Array.from({length:12},(_,i)=>`M${i+1}.webp`)];
const S={id:'',age:'',gender:'',female:[],male:[],raw:[],trials:[],ratings:[],cal1:0,cal2:0,calAcc1:0,calAcc2:0};

let practiceErrors = 0;

const imageCache=new Map();
function loadImageCached(name){
  const key=String(name).split('/').pop();
  if(imageCache.has(key)) return imageCache.get(key);
  const p=new Promise(resolve=>{
    const im=new Image();
    im.decoding='async';
    im.onload=async()=>{try{if(im.decode) await im.decode()}catch(e){} resolve(im)};
    im.onerror=()=>{console.warn('Asset failed to load:',key);resolve(null)};
    im.src=assetUrl(key);
  });
  imageCache.set(key,p);
  return p;
}
function preloadTrial(names){return Promise.all(names.map(loadImageCached))}
const enc=n=>A+encodeURIComponent(n);
const assetUrl=n=>enc(n);
const picture=(n,c='')=>`<img class="${c}" src="${assetUrl(n)}" alt="${n}" loading="eager">`;
function base(h){root.innerHTML=`<section class="screen">${h}</section>`}
function k(fn){document.onkeydown=e=>fn(e)}

function enterFullscreen() {

// ==========================================
// MediaPipe Face Mesh & Polynomial Regression Model
// ==========================================
let faceMesh = null;
let cameraUtils = null;
let currentFeatures = null;
let calibDataX = [];
let calibDataY = [];
let weightsX = null;
let weightsY = null;

let smoothGazeX = null;
let smoothGazeY = null;

let goodStateStartTime = 0;
let isAligned = false;

function solveLinearRegression(X, Y) {
  const N = X.length;
  const K = X[0].length;
  let XTX = Array.from({length: K}, () => new Array(K).fill(0));
  for(let i=0; i<K; i++) {
    for(let j=0; j<K; j++) {
      for(let n=0; n<N; n++) {
        XTX[i][j] += X[n][i] * X[n][j];
      }
    }
  }
  for(let i=0; i<K; i++) XTX[i][i] += 1e-3;

  let I = Array.from({length: K}, (_, i) => Array.from({length: K}, (_, j) => i === j ? 1 : 0));
  let M = XTX.map(row => [...row]);

  for(let i=0; i<K; i++) {
    let pivot = M[i][i];
    if(Math.abs(pivot) < 1e-9) pivot = 1e-9;
    for(let j=0; j<K; j++) {
      M[i][j] /= pivot;
      I[i][j] /= pivot;
    }
    for(let k=0; k<K; k++) {
      if(k !== i) {
        let factor = M[k][i];
        for(let j=0; j<K; j++) {
          M[k][j] -= factor * M[i][j];
          I[k][j] -= factor * I[i][j];
        }
      }
    }
  }
  let invXT = Array.from({length: K}, () => new Array(N).fill(0));
  for(let i=0; i<K; i++) {
    for(let n=0; n<N; n++) {
      for(let j=0; j<K; j++) {
        invXT[i][n] += I[i][j] * X[n][j];
      }
    }
  }
  let W = new Array(K).fill(0);
  for(let i=0; i<K; i++) {
    for(let n=0; n<N; n++) {
      W[i] += invXT[i][n] * Y[n];
    }
  }
  return W;
}

function predictGaze() {
  if(!weightsX || !weightsY || !currentFeatures) return null;
  let rawX = 0, rawY = 0;
  for(let i=0; i<currentFeatures.length; i++) {
    rawX += currentFeatures[i] * weightsX[i];
    rawY += currentFeatures[i] * weightsY[i];
  }

  rawX = Math.max(0, Math.min(window.innerWidth, rawX));
  rawY = Math.max(0, Math.min(window.innerHeight, rawY));

  if (smoothGazeX === null) {
    smoothGazeX = rawX;
    smoothGazeY = rawY;
  } else {
    smoothGazeX = smoothGazeX * 0.70 + rawX * 0.30;
    smoothGazeY = smoothGazeY * 0.70 + rawY * 0.30;
  }

  return { x: smoothGazeX, y: smoothGazeY };
}

function initFaceMeshSystem() {
  if(faceMesh) return Promise.resolve(true);

  const video = document.getElementById('webcamVideo');
  const canvas = document.getElementById('meshCanvas');
  const ctx = canvas.getContext('2d');
  const popup = document.getElementById('cameraPopup');
  const statusTxt = document.getElementById('cameraStatusText');

  faceMesh = new FaceMesh({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
  });

  faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  faceMesh.onResults(results => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
      const lm = results.multiFaceLandmarks[0];
      
      if (typeof drawConnectors === 'function' && typeof FACEMESH_TESSELATION !== 'undefined') {
        drawConnectors(ctx, lm, FACEMESH_TESSELATION, {color: '#00FFFF', lineWidth: 0.3});
      }

      const lIris = lm[468], rIris = lm[473];
      const lOut = lm[33], lIn = lm[133];
      const rOut = lm[263], rIn = lm[362];

      const lTop = lm[159], lBot = lm[145];
      const lEyeH = Math.hypot(lTop.x - lBot.x, lTop.y - lBot.y);
      const lEyeW = Math.hypot(lOut.x - lIn.x, lOut.y - lIn.y);

      if (lEyeH / (lEyeW || 0.01) < 0.12) {
        currentFeatures = null;
        return;
      }

      const mLx = (lOut.x + lIn.x) / 2;
      const mLy = (lOut.y + lIn.y) / 2;
      const mRx = (rOut.x + rIn.x) / 2;
      const mRy = (rOut.y + rIn.y) / 2;

      const eyeDistance = Math.hypot(mRx - mLx, mRy - mLy) || 0.1;

      const dxL = (lIris.x - mLx) / eyeDistance;
      const dyL = (lIris.y - mLy) / eyeDistance;
      const dxR = (rIris.x - mRx) / eyeDistance;
      const dyR = (rIris.y - mRy) / eyeDistance;

      const noseBridge = lm[6];

      currentFeatures = [
        1,
        dxL, dyL,
        dxR, dyR,
        noseBridge.x, noseBridge.y,
        dxL * dxL, dyL * dyL,
        dxR * dxR, dyR * dyR
      ];

      const nose = lm[1];
      const centered = nose.x > 0.25 && nose.x < 0.75 && nose.y > 0.20 && nose.y < 0.80;

      if (centered) {
        isAligned = true;
        popup.classList.remove('bad');
        popup.classList.add('good');
        statusTxt.textContent = 'הפנים זוהו';

        if (!goodStateStartTime) goodStateStartTime = performance.now();
        if (performance.now() - goodStateStartTime >= 200) {
          popup.classList.remove('show');
        }
      } else {
        isAligned = false;
        goodStateStartTime = 0;
        popup.classList.remove('good');
        popup.classList.add('bad', 'show');
        statusTxt.textContent = 'חריגה מהמסגרת';
      }
    } else {
      currentFeatures = null;
      isAligned = false;
      goodStateStartTime = 0;
      popup.classList.remove('good');
      popup.classList.add('bad', 'show');
      statusTxt.textContent = 'פנים לא זוהו';
    }
  });

  cameraUtils = new Camera(video, {
    onFrame: async () => {
      await faceMesh.send({image: video});
    },
    width: 320,
    height: 240
  });

  return cameraUtils.start().then(() => {
    popup.classList.add('show');
    return true;
  });
}

// ==========================================
// Calibration & Visual Transitions (400ms)
// ==========================================
function runTransition(fromPt, toPt, duration, onComplete) {
  const startTime = performance.now();
  
  base(`
    <div class="calib-stage">
      <svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;">
        <line x1="${fromPt.x}%" y1="${fromPt.y}%" x2="${toPt.x}%" y2="${toPt.y}%" 
              stroke="#ffffff" stroke-dasharray="6 6" stroke-width="3" opacity="0.7" />
      </svg>
      <div id="transDot" style="position:absolute;width:20px;height:20px;background:#ffffff;border:2px solid #002060;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 10px #ffffff;left:${fromPt.x}%;top:${fromPt.y}%;"></div>
    </div>
  `);

  const dot = document.getElementById('transDot');

  function step(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);

    const curX = fromPt.x + (toPt.x - fromPt.x) * progress;
    const curY = fromPt.y + (toPt.y - fromPt.y) * progress;

    if (dot) {
      dot.style.left = curX + '%';
      dot.style.top = curY + '%';
    }

    if (progress < 1) {
      requestAnimationFrame(step);
    } else {
      onComplete();
    }
  }

  requestAnimationFrame(step);
}

function run6PointCalibration(onComplete, isSimulation = false) {
  document.getElementById('cameraPopup')?.classList.remove('show');

  const points = [
    { x: 50, y: 50 }, // 1. מרכז
    { x: 10, y: 10 }, // 2. שמאל-למעלה
    { x: 90, y: 10 }, // 3. ימין-למעלה
    { x: 90, y: 90 }, // 4. ימין-למטה
    { x: 10, y: 90 }, // 5. שמאל-למטה
    { x: 50, y: 50 }  // 6. חזרה למרכז
  ];

  if (!isSimulation) {
    calibDataX = [];
    calibDataY = [];
    smoothGazeX = null;
    smoothGazeY = null;
  }

  let index = 0;

  function runNextPoint() {
    if (index >= points.length) {
      if (!isSimulation && calibDataX.length >= 8) {
        const X = calibDataX.map(d => d.feat);
        const Yx = calibDataX.map(d => d.target);
        const Yy = calibDataY.map(d => d.target);
        weightsX = solveLinearRegression(X, Yx);
        weightsY = solveLinearRegression(X, Yy);
      }
      onComplete();
      return;
    }

    const startPointLogic = () => {
      const pt = points[index];
      base(`
        <div class="calib-stage">
          <div class="calib-target" style="left:${pt.x}%;top:${pt.y}%">
            <div class="calib-center-dot"></div>
            <div class="calib-ring"></div>
          </div>
        </div>
      `);

      const targetX = (pt.x / 100) * window.innerWidth;
      const targetY = (pt.y / 100) * window.innerHeight;
      const startTimePoint = performance.now();
      const duration = 1200;
      const ignoreInitialMs = 250;

      function sampleLoop() {
        const elapsed = performance.now() - startTimePoint;

        if (!isSimulation && elapsed >= ignoreInitialMs && elapsed < duration) {
          if (currentFeatures) {
            calibDataX.push({ feat: [...currentFeatures], target: targetX });
            calibDataY.push({ feat: [...currentFeatures], target: targetY });
          }
        }

        if (elapsed < duration) {
          requestAnimationFrame(sampleLoop);
        } else {
          index++;
          runNextPoint();
        }
      }

      requestAnimationFrame(sampleLoop);
    };

    if (index > 0) {
      runTransition(points[index - 1], points[index], 400, startPointLogic);
    } else {
      startPointLogic();
    }
  }

  runNextPoint();
}

function trial(row, done, isPractice = false){
  const faces=row.slice(0,4).map(x=>String(x).endsWith('.webp')?String(x):String(x)+'.webp');
  const loadPromise=preloadTrial(faces);

  run6PointCalibration(() => {
    loadPromise.then(()=>{
      base(`<div class="trial-grid" style="visibility:hidden">${faces.map((x,i)=>picture(x,'pos p'+(i+1))).join('')}</div>`);
      requestAnimationFrame(()=>{
        const grid=document.querySelector('.trial-grid');
        if(!grid)return;
        grid.style.visibility='visible';

        setTimeout(()=>{
          base('<div class="bottom-fix">+</div>');
          setTimeout(()=>response(row,done),3000);
        },5000);
      });
    }).catch(err=>{console.error('Trial preload failed',err);if(typeof done==='function')done();});
  }, isPractice);
}

function response(row,done){
  const singleName=String(row[4]).endsWith('.webp')?String(row[4]):String(row[4])+'.webp';
  base(`${picture(singleName,'center')}<div class="question">האם הפרצוף הזה הופיע במסך הקודם?</div><div class="keys"><span class="yes">I = כן</span><span class="no">E = לא</span></div>`);
  const t=performance.now();
  let answered=false;
  let timeoutId=null;
  document.onkeydown=null;
  document.onkeydown=e=>{
    const key=String(e.key||'').toLowerCase();
    const q=e.code==='KeyI'||key==='i'||key==='ך'?'i':e.code==='KeyE'||key==='e'||key==='ק'?'e':'';
    if(!q||answered)return;
    e.preventDefault();
    e.stopImmediatePropagation();
    answered=true;
    clearTimeout(timeoutId);
    document.onkeydown=null;
    
    const isCorrect = q === row[row.length-1];
    if (showFeedback && !isCorrect) {
      practiceErrors++;
    }

    S.trials.push({phase:(showFeedback ? 'practice' : 'main'),rt:performance.now()-t,key:q,correct:isCorrect});
    autoSavePartial();

    const finishAnswer=()=>{if(typeof done==='function')done()};
    if(showFeedback){base(`<h2 style="color:${isCorrect?'#00a83b':'#b32626'}">${isCorrect?'תשובה נכונה':'תשובה שגויה'}</h2>`);setTimeout(finishAnswer,700)}
    else finishAnswer()
  };
  timeoutId=setTimeout(()=>{
    if(answered)return;
    answered=true;
    document.onkeydown=null;
    
    if (showFeedback) {
      practiceErrors++;
    }

    S.trials.push({phase:(showFeedback ? 'practice' : 'main'),rt:null,key:null,correct:false,timeout:true});
    autoSavePartial();

    if(showFeedback){base('<h2 style="color:#9b3f3f">לאט מידי</h2>');setTimeout(()=>{if(typeof done==='function')done()},700)}
    else if(typeof done==='function')done()
  },2000);
  window.focus();
}

        • <strong>הנקודה השישית והאחרונה ממוקמת במרכז המסך.</strong> מיד בסיומה יופיעו 4 הפרצופים.
      </p>
      <p style="font-size:20px; margin-top:30px;">ברגע שתרגיש/י מוכן/נה יש ללחוץ על מקש <strong>"רווח"</strong> כדי להתחיל.</p>
    </div>
  `);
  k(e=>{if(e.code==='Space')countdown(block===1?'main':'block2')});
}

function mainStart(block){
  showFeedback=false;
  document.body.style.cursor = 'none';
  
  const sex=block===1?(Math.random()<.5?'F':'M'):(S.lastSex==='F'?'M':'F');
  S.lastSex=sex;
  const familiar=(sex==='F'?S.female:S.male).map(x=>String(x).split('/').pop());
  const f1=familiar[0]||`${sex}1.webp`,f2=familiar[1]||`${sex}2.webp`;
  
  const rows=sex==='F'?[
    {ffi:1,p:[f1,'UNf13.webp','UNf10.webp','UNf5.webp'],s:'UNf6.webp',c:'e'},
    {ffi:1,p:['UNf2.webp',f1,'UNf14.webp','UNf1.webp'],s:f1,c:'i'},
    {ffi:1,p:['UNf6.webp','UNf12.webp',f1,'UNf9.webp'],s:'UNf5.webp',c:'e'},
    {ffi:1,p:['UNf7.webp','UNf8.webp','UNf3.webp',f1],s:'UNf3.webp',c:'i'},
    {ffi:1,p:[f2,'UNf10.webp','UNf9.webp','UNf7.webp'],s:'UNf4.webp',c:'e'},
    {ffi:1,p:['UNf8.webp',f2,'UNf4.webp','UNf12.webp'],s:f2,c:'i'},
    {ffi:1,p:['UNf3.webp','UNf6.webp',f2,'UNf13.webp'],s:'UNf2.webp',c:'e'},
    {ffi:1,p:['UNf11.webp','UNf2.webp','UNf1.webp',f2],s:'UNf1.webp',c:'i'},
    {ffi:0,p:['UNf5.webp','UNf9.webp','UNf2.webp','UNf4.webp'],s:'UNf3.webp',c:'e'},
    {ffi:0,p:['UNf10.webp','UNf3.webp','UNf6.webp','UNf8.webp'],s:'UNf6.webp',c:'i'},
    {ffi:0,p:['UNf14.webp','UNf4.webp','UNf7.webp','UNf10.webp'],s:'UNf1.webp',c:'e'},
    {ffi:0,p:['UNf13.webp','UNf1.webp','UNf5.webp','UNf11.webp'],s:'UNf5.webp',c:'i'},
    {ffi:0,p:['UNf12.webp','UNf7.webp','UNf8.webp','UNf14.webp'],s:f1,c:'e'},
    {ffi:0,p:['UNf4.webp','UNf5.webp','UNf11.webp','UNf6.webp'],s:'UNf4.webp',c:'i'},
    {ffi:0,p:['UNf9.webp','UNf11.webp','UNf12.webp','UNf3.webp'],s:f2,c:'e'},
    {ffi:0,p:['UNf1.webp','UNf14.webp','UNf13.webp','UNf2.webp'],s:'UNf2.webp',c:'i'}
  ].sort(()=>Math.random()-.5):[
    {ffi:1,p:[f1,'UNm13.webp','UNm10.webp','UNm5.webp'],s:'UNm6.webp',c:'e'},
    {ffi:1,p:['UNm2.webp',f1,'UNm14.webp','UNm1.webp'],s:f1,c:'i'},
    {ffi:1,p:['UNm6.webp','UNm12.webp',f1,'UNm9.webp'],s:'UNm5.webp',c:'e'},
    {ffi:1,p:['UNm7.webp','UNm8.webp','UNm3.webp',f1],s:'UNm3.webp',c:'i'},
    {ffi:1,p:[f2,'UNm10.webp','UNm9.webp','UNm7.webp'],s:'UNm4.webp',c:'e'},
    {ffi:1,p:['UNm8.webp',f2,'UNm4.webp','UNm12.webp'],s:f2,c:'i'},
    {ffi:1,p:['UNm3.webp','UNm6.webp',f2,'UNm13.webp'],s:'UNm2.webp',c:'e'},
    {ffi:1,p:['UNm11.webp','UNm2.webp','UNm1.webp',f2],s:'UNm1.webp',c:'i'},
    {ffi:0,p:['UNm5.webp','UNm9.webp','UNm2.webp','UNm4.webp'],s:'UNm3.webp',c:'e'},
    {ffi:0,p:['UNm10.webp','UNm3.webp','UNm6.webp','UNm8.webp'],s:'UNm6.webp',c:'i'},
    {ffi:0,p:['UNm14.webp','UNm4.webp','UNm7.webp','UNm10.webp'],s:'UNm1.webp',c:'e'},
    {ffi:0,p:['UNm13.webp','UNm1.webp','UNm5.webp','UNm11.webp'],s:'UNm5.webp',c:'i'},
    {ffi:0,p:['UNm12.webp','UNm7.webp','UNm8.webp','UNm14.webp'],s:f1,c:'e'},
    {ffi:0,p:['UNm4.webp','UNm5.webp','UNm11.webp','UNm6.webp'],s:'UNm4.webp',c:'i'},
    {ffi:0,p:['UNm9.webp','UNm11.webp','UNm12.webp','UNm3.webp'],s:f2,c:'e'},
    {ffi:0,p:['UNm1.webp','UNm14.webp','UNm13.webp','UNm2.webp'],s:'UNm2.webp',c:'i'}
  ].sort(()=>Math.random()-.5);

  let trialIndex=0;
  const go=()=>{
    if(trialIndex>=rows.length){
      document.body.style.cursor = 'default';
      if(block === 1) {
        screenFaceSetup(2); 
      } else {
        screen16();
      }
      return;
    }
    const r=rows[trialIndex++];
    const faces=r.p.map(x=>String(x).endsWith('.webp')?String(x):String(x)+'.webp');
    const tno=trialIndex;

    const loadPromise=preloadTrial(faces);

    run6PointCalibration(() => {
      loadPromise.then(() => {
        base(`<div class="trial-grid">${faces.map((x,j)=>picture(x,'pos p'+(j+1))).join('')}</div>`);
        
        const t0=performance.now();
        track(t0, sex, tno, r.ffi);

        setTimeout(()=>{
          base('<div class="bottom-fix">+</div>');
          setTimeout(()=>response([...faces,r.s,r.c],go),3000);
        },5000);
      }).catch(err=>{console.error('Main trial preload failed',err);go();});
    }, false);
  };
  go();
}

function track(t0, sex, trial, ffi){
  const stopAt=t0+5000;
  const f=()=>{
    const now=performance.now();
    if(now>=stopAt)return;
    
    const gaze = predictGaze();
    let normX = null, normY = null, quadrant = null;

    if (gaze && gaze.x !== null && gaze.y !== null) {
      normX = gaze.x / window.innerWidth;
      normY = gaze.y / window.innerHeight;

      if (normX < 0.5 && normY < 0.5) quadrant = "TopLeft";
      else if (normX >= 0.5 && normY < 0.5) quadrant = "TopRight";
      else if (normX >= 0.5 && normY >= 0.5) quadrant = "BottomRight";
      else if (normX < 0.5 && normY >= 0.5) quadrant = "BottomLeft";
    }

    S.raw.push({
      participant: S.id,
      block: sex,
      trial: trial,
      ffi: ffi,
      timestamp: Number((now - t0).toFixed(2)),
      gazeX: gaze?.x ? Number(gaze.x.toFixed(2)) : null,
      gazeY: gaze?.y ? Number(gaze.y.toFixed(2)) : null,
      normX: normX !== null ? Number(normX.toFixed(4)) : null,
      normY: normY !== null ? Number(normY.toFixed(4)) : null,
      quadrant: quadrant,
      screenWidth: window.innerWidth,
      screenHeight: window.innerHeight,
      phase: (now - t0) <= 1000 ? 'Phase1' : 'Phase2'
    });

    requestAnimationFrame(f);
  };
  requestAnimationFrame(f);
}

function screen16(){
  if(cameraUtils) cameraUtils.stop();
  document.getElementById('cameraPopup')?.classList.remove('show');
  const popup = document.getElementById('cameraPopup');
  if (popup) {
    popup.classList.remove('show', 'good', 'bad');
    popup.style.display = 'none';
  }
  base('<div class="panel"><h2>מעקב העיניים הסתיים</h2><p>אפשר להירגע. כעת תתבצע משימת דירוג קצרה.</p></div><button class="btn" id="b">המשך</button>');
  b.onclick=()=>instr('b_sig_rate.jpg','ratings');
}

function ratings(){
  const all=[...Array.from({length:14},(_,i)=>`UNf${i+1}.webp`),...S.female,...Array.from({length:14},(_,i)=>`UNm${i+1}.webp`),...S.male];
  const go=()=>{
    if(!ratings.i)ratings.i=0;
    if(ratings.i>=all.length) return finishSavingScreen();

    base(`
      <div class="rating-instruction-text">באיזה מידה פרצוף זה תפס לך את העין?</div>
      ${picture(all[ratings.i],'rating-face')}
      <div class="rating-labels">
        <span>9 = במידה רבה מאוד</span>
        <span>1 = במידה מועטה מאוד</span>
      </div>
      <div class="scale">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="ratings.rate(${n})">${n}</button>`).join('')}
      </div>
    `);
  };
  ratings.rate=n=>{
    S.ratings.push({stimulus:all[ratings.i],rating:n});
    ratings.i++;
    go();
  };
  go();
}

// ==========================================
// CSV Conversion & Download Helpers
// ==========================================
function buildSummaryCSV() {
  const rows = [];
  rows.push(['participant', 'age', 'gender', 'record_type', 'item_id', 'phase', 'rt', 'key', 'correct', 'timeout', 'rating'].join(','));

  S.trials.forEach((t, idx) => {
    rows.push([
      `"${S.id}"`,
      `"${S.age}"`,
      `"${S.gender}"`,
      `"trial"`,
      `"${idx + 1}"`,
      `"${t.phase || ''}"`,
      `"${t.rt !== null && t.rt !== undefined ? Number(t.rt).toFixed(2) : ''}"`,
      `"${t.key || ''}"`,
      `"${t.correct ? 1 : 0}"`,
      `"${t.timeout ? 1 : 0}"`,
      `""`
    ].join(','));
  });

  S.ratings.forEach(r => {
    rows.push([
      `"${S.id}"`,
      `"${S.age}"`,
      `"${S.gender}"`,
      `"rating"`,
      `"${r.stimulus || ''}"`,
      `""`,
      `""`,
      `""`,
      `""`,
      `""`,
      `"${r.rating}"`
    ].join(','));
  });

  return rows.join('\n');
}

function buildRawGazeCSV() {
  if (!S.raw || S.raw.length === 0) return '';
  const headers = ['participant', 'block', 'trial', 'ffi', 'timestamp', 'gazeX', 'gazeY', 'normX', 'normY', 'quadrant', 'screenWidth', 'screenHeight', 'phase'];
  const rows = [headers.join(',')];

  S.raw.forEach(r => {
    const row = headers.map(h => {
      const val = r[h] === null || r[h] === undefined ? '' : r[h];
      return `"${String(val).replace(/"/g, '""')}"`;
    });
    rows.push(row.join(','));
  });

  return rows.join('\n');
}

function downloadCSV(csvContent, fileName) {
  if (!csvContent) return;
  const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  const url = URL.createObjectURL(blob);
  link.setAttribute('href', url);
  link.setAttribute('download', fileName);
  link.style.visibility = 'hidden';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// ==========================================
// Firebase Storage Save Flow
// ==========================================
function finishSavingScreen() {
  base(`${picture('biu_logo.png','logo')}<div class="panel"><h1>אנא המתן/ני בזמן שהנתונים נשמרים</h1><p>קובצי ה-CSV נשלחים לשרת תחת מספר משתתף ${S.id}. <span style="color: darkred; font-weight: bold;">אנא אל תסגור/י את הדף.</span></p></div>`);

  const csvSummary = buildSummaryCSV();
  const csvRaw = buildRawGazeCSV();

  const summaryRef = storage.ref(`data/participant_${S.id}_summary.csv`);
  const rawRef = storage.ref(`data/participant_${S.id}_raw_gaze.csv`);

  Promise.all([
    summaryRef.putString(csvSummary, 'raw', { contentType: 'text/csv' }),
    rawRef.putString(csvRaw, 'raw', { contentType: 'text/csv' })
  ])
  .then(() => {
    console.log("קובצי ה-CSV הועלו בהצלחה ל-Firebase Storage!");
    finalScreen(false);
  })
  .catch((error) => {
    console.error("שגיאה בהעלאת קובצי ה-CSV לענן:", error);
    downloadCSV(csvSummary, `participant_${S.id}_summary.csv`);
    downloadCSV(csvRaw, `participant_${S.id}_raw_gaze.csv`);
    finalScreen(true);
  });
}

function finalScreen(hasError = false) {
  let message = "הניסוי הסתיים והנתונים נשמרו בהצלחה בשרת בפורמט CSV.";
  if (hasError) {
    message = "הניסוי הסתיים. הייתה שגיאה בחיבור לענן, לכן קובצי ה-CSV הורדו באופן אוטומטי למחשב שלך כגיבוי.";
  }

  base(`
    ${picture('biu_logo.png','logo')}
    <div class="panel">
      <h1>תודה רבה על השתתפותך 😊</h1>
      <p>${message}</p>
      <h2 style="margin-top: 30px; color: #ffea00;">כעת ניתן לצאת מדף זה.</h2>
    </div>
  `);
}

function exit(t){
  document.body.style.cursor = 'default';
  base(`<div class="panel"><h2>${t}</h2></div>`);
}

preload();
