const assets=['biu_logo.png','forward.png','only_forward.jpg','back_and_forward.jpg','glasses_YN.jpg','consent_pic.jpg','confir.png','SMT_instructions.jpg','SMT_example.jpg','twoSessInst.jpg','b_practice.jpg','b_STM.jpg','NoHeadMovements.png',...Array.from({length:10},(_,i)=>`P${i+1}.webp`),...Array.from({length:14},(_,i)=>`UNf${i+1}.webp`),...Array.from({length:14},(_,i)=>`UNm${i+1}.webp`),...Array.from({length:12},(_,i)=>`F${i+1}.webp`),...Array.from({length:12},(_,i)=>`M${i+1}.webp`)];

const imageCache=new Map();
function loadImageCached(name){
  const key=String(name).split('/').pop();
  if(imageCache.has(key)) return imageCache.get(key);
  const p=new Promise(resolve=>{
    const im=new Image();
    im.decoding='async';
    im.onload=async()=>{try{if(im.decode) await im.decode()}catch(e){} resolve(im)};
    im.onerror=()=>{console.warn('Asset failed to load:',key);resolve(null)};
    im.src=assetUrl(key);
  });
  imageCache.set(key,p);
  return p;
}

// ==========================================
// MediaPipe Face Mesh & Polynomial Regression Model
// ==========================================
let faceMesh = null;
let cameraUtils = null;
let currentFeatures = null;
let calibDataX = [];
let calibDataY = [];
let totalCalibSamples = 0;
let weightsX = null;
let weightsY = null;

let smoothGazeX = null;
let smoothGazeY = null;

let goodStateStartTime = 0;
let isAligned = false;

function solveLinearRegression(X, Y) {
  const N = X.length;
  const K = X[0].length;
  let XTX = Array.from({length: K}, () => new Array(K).fill(0));
  for(let i=0; i<K; i++) {
    for(let j=0; j<K; j++) {
      for(let n=0; n<N; n++) {
        XTX[i][j] += X[n][i] * X[n][j];
      }
    }
  }
  for(let i=0; i<K; i++) XTX[i][i] += 1e-3;

  let I = Array.from({length: K}, (_, i) => Array.from({length: K}, (_, j) => i === j ? 1 : 0));
  let M = XTX.map(row => [...row]);

  for(let i=0; i<K; i++) {
    let pivot = M[i][i];
    if(Math.abs(pivot) < 1e-9) pivot = 1e-9;
    for(let j=0; j<K; j++) {
      M[i][j] /= pivot;
      I[i][j] /= pivot;
    }
    for(let k=0; k<K; k++) {
      if(k !== i) {
        let factor = M[k][i];
        for(let j=0; j<K; j++) {
          M[k][j] -= factor * M[i][j];
          I[k][j] -= factor * I[i][j];
        }
      }
    }
  }
  let invXT = Array.from({length: K}, () => new Array(N).fill(0));
  for(let i=0; i<K; i++) {
    for(let n=0; n<N; n++) {
      for(let j=0; j<K; j++) {
        invXT[i][n] += I[i][j] * X[n][j];
      }
    }
  }
  let W = new Array(K).fill(0);
  for(let i=0; i<K; i++) {
    for(let n=0; n<N; n++) {
      W[i] += invXT[i][n] * Y[n];
    }
  }
  return W;
}

function predictGaze() {
  if(!weightsX || !weightsY || !currentFeatures) return null;
  let rawX = 0, rawY = 0;
  for(let i=0; i<currentFeatures.length; i++) {
    rawX += currentFeatures[i] * weightsX[i];
    rawY += currentFeatures[i] * weightsY[i];
  }

  rawX = Math.max(0, Math.min(window.innerWidth, rawX));
  rawY = Math.max(0, Math.min(window.innerHeight, rawY));

  if (smoothGazeX === null) {
    smoothGazeX = rawX;
    smoothGazeY = rawY;
  } else {
    smoothGazeX = smoothGazeX * 0.70 + rawX * 0.30;
    smoothGazeY = smoothGazeY * 0.70 + rawY * 0.30;
  }

  return { x: smoothGazeX, y: smoothGazeY };
}

function initFaceMeshSystem() {
  if(faceMesh) return Promise.resolve(true);

  const video = document.getElementById('webcamVideo');
  const canvas = document.getElementById('meshCanvas');
  const ctx = canvas.getContext('2d');
  const popup = document.getElementById('cameraPopup');
  const statusTxt = document.getElementById('cameraStatusText');

  faceMesh = new FaceMesh({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
  });

  faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  faceMesh.onResults(results => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
      const lm = results.multiFaceLandmarks[0];
      
      if (typeof drawConnectors === 'function' && typeof FACEMESH_TESSELATION !== 'undefined') {
        drawConnectors(ctx, lm, FACEMESH_TESSELATION, {color: '#00FFFF', lineWidth: 0.3});
      }

      const lIris = lm[468], rIris = lm[473];
      const lOut = lm[33], lIn = lm[133];
      const rOut = lm[263], rIn = lm[362];

      const lTop = lm[159], lBot = lm[145];
      const lEyeH = Math.hypot(lTop.x - lBot.x, lTop.y - lBot.y);
      const lEyeW = Math.hypot(lOut.x - lIn.x, lOut.y - lIn.y);

      if (lEyeH / (lEyeW || 0.01) < 0.12) {
        currentFeatures = null;
        return;
      }

      const mLx = (lOut.x + lIn.x) / 2;
      const mLy = (lOut.y + lIn.y) / 2;
      const mRx = (rOut.x + rIn.x) / 2;
      const mRy = (rOut.y + rIn.y) / 2;

      const eyeDistance = Math.hypot(mRx - mLx, mRy - mLy) || 0.1;

      const dxL = (lIris.x - mLx) / eyeDistance;
      const dyL = (lIris.y - mLy) / eyeDistance;
      const dxR = (rIris.x - mRx) / eyeDistance;
      const dyR = (rIris.y - mRy) / eyeDistance;

      const noseBridge = lm[6];

      currentFeatures = [
        1,
        dxL, dyL,
        dxR, dyR,
        noseBridge.x, noseBridge.y,
        dxL * dxL, dyL * dyL,
        dxR * dxR, dyR * dyR
      ];

      const nose = lm[1];
      const centered = nose.x > 0.25 && nose.x < 0.75 && nose.y > 0.20 && nose.y < 0.80;
      const isForceShown = isFaceSetupScreen || (performance.now() < forceShowPopupUntil);

      if (centered) {
        isAligned = true;
        popup.classList.remove('bad');
        popup.classList.add('good');
        statusTxt.textContent = 'הפנים זוהו';

        if (!goodStateStartTime) goodStateStartTime = performance.now();
        if (isForceShown) {
          popup.classList.add('show');
        } else if (performance.now() - goodStateStartTime >= 200) {
          popup.classList.remove('show');
        }
      } else {
        isAligned = false;
        goodStateStartTime = 0;
        popup.classList.remove('good');
        popup.classList.add('bad', 'show');
        statusTxt.textContent = 'חריגה מהמסגרת';
      }
    } else {
      currentFeatures = null;
      isAligned = false;
      goodStateStartTime = 0;
      popup.classList.remove('good');
      popup.classList.add('bad', 'show');
      statusTxt.textContent = 'פנים לא זוהו';
    }

    if (isFaceSetupScreen) {
      const calBtn = document.getElementById('goCalBtn');
      if (calBtn) calBtn.disabled = !isAligned;
    }
  });

  cameraUtils = new Camera(video, {
    onFrame: async () => {
      await faceMesh.send({image: video});
    },
    width: 320,
    height: 240
  });

  return cameraUtils.start().then(() => {
    popup.classList.add('show');
    return true;
  });
}

function startMiniCalibAnimation() {
  const container = document.getElementById('miniCalibContainer');
  if(!container) return;

  const pts = [
    { x: 50, y: 50 },
    { x: 15, y: 15 },
    { x: 85, y: 15 },
    { x: 85, y: 85 },
    { x: 15, y: 85 },
    { x: 50, y: 50 }
  ];

  let stepIdx = 0;

  function playStep() {
    if(!document.getElementById('miniCalibContainer')) return;

    const curr = pts[stepIdx];
    const next = pts[(stepIdx + 1) % pts.length];

    container.innerHTML = `
      <div style="position:absolute;left:${curr.x}%;top:${curr.y}%;transform:translate(-50%,-50%);width:22px;height:22px;display:flex;align-items:center;justify-content:center;">
        <div style="width:7px;height:7px;background:#ffffff;border:1px solid #002060;border-radius:50%;position:absolute;z-index:2;box-shadow:0 0 6px #ffffff;"></div>
        <div class="mini-shrink-ring"></div>
      </div>
    `;

    miniCalibTimer = setTimeout(() => {
      let progress = 0;

      function drawLineStep() {
        if(!document.getElementById('miniCalibContainer')) return;

        progress += 0.10;
        if(progress > 1) progress = 1;

        const curX = curr.x + (next.x - curr.x) * progress;
        const curY = curr.y + (next.y - curr.y) * progress;

        container.innerHTML = `
          <svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;">
            <line x1="${curr.x}%" y1="${curr.y}%" x2="${curX}%" y2="${curY}%" stroke="#ffffff" stroke-dasharray="3 3" stroke-width="2" opacity="0.95" />
          </svg>
          <div style="position:absolute;left:${curX}%;top:${curY}%;transform:translate(-50%,-50%);width:6px;height:6px;background:#ffffff;border:1px solid #002060;border-radius:50%;box-shadow:0 0 4px #ffffff;"></div>
        `;

        if(progress < 1) {
          miniCalibTimer = setTimeout(drawLineStep, 35);
        } else {
          stepIdx = (stepIdx + 1) % pts.length;
          miniCalibTimer = setTimeout(playStep, 100);
        }
      }

      drawLineStep();
    }, 650);
  }

  playStep();
}

const prac=[['P4','P6','P2','P8','P2','i'],['P1','P3','P5','P7','P9','e'],['P6','P8','P4','P10','P8','i'],['P3','P9','P7','P5','P1','e']];

// ==========================================
// Calibration & Visual Transitions (400ms)
// ==========================================
function runTransition(fromPt, toPt, duration, onComplete) {
  const startTime = performance.now();
  
  base(`
    <div class="calib-stage">
      <svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;">
        <line x1="${fromPt.x}%" y1="${fromPt.y}%" x2="${toPt.x}%" y2="${toPt.y}%" 
              stroke="#ffffff" stroke-dasharray="6 6" stroke-width="3" opacity="0.7" />
      </svg>
      <div id="transDot" style="position:absolute;width:20px;height:20px;background:#ffffff;border:2px solid #002060;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 10px #ffffff;left:${fromPt.x}%;top:${fromPt.y}%;"></div>
    </div>
  `);

  const dot = document.getElementById('transDot');

  function step(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);

    const curX = fromPt.x + (toPt.x - fromPt.x) * progress;
    const curY = fromPt.y + (toPt.y - fromPt.y) * progress;

    if (dot) {
      dot.style.left = curX + '%';
      dot.style.top = curY + '%';
    }

    if (progress < 1) {
      requestAnimationFrame(step);
    } else {
      onComplete();
    }
  }

  requestAnimationFrame(step);
}

function run6PointCalibration(onComplete, isSimulation = false) {
  document.getElementById('cameraPopup')?.classList.remove('show');

  const points = [
    { x: 50, y: 50 },
    { x: 10, y: 10 },
    { x: 90, y: 10 },
    { x: 90, y: 90 },
    { x: 10, y: 90 },
    { x: 50, y: 50 }
  ];

  if (!isSimulation) {
    calibDataX = [];
    calibDataY = [];
    totalCalibSamples = 0;
    smoothGazeX = null;
    smoothGazeY = null;
  }

  let index = 0;

  function runNextPoint() {
    if (index >= points.length) {
      if (!isSimulation) {
        const validSamples = calibDataX.length;
        const invalidSamples = totalCalibSamples - validSamples;
        const halfSamples = totalCalibSamples / 2;

        if ((totalCalibSamples > 0 && invalidSamples >= halfSamples) || validSamples < 60) {
          base(`
            <div class="panel" style="text-align: center;">
              <h2 style="color: #b32626;">שגיאה בכיול תנועות העיניים</h2>
              <p style="font-size: 22px; margin: 20px 0;">נראה שעיניך היו עצומות או שלא הבטת בנקודות הכיול בצורה רציפה.</p>
              <p style="font-size: 20px;">נא להקפיד להביט על כל נקודה ועל הקווים המנחים בעניים פקוחות וללא תנועות ראש.</p>
              <p style="color: #002060; font-size: 24px; font-weight: bold;">כדי להמשיך שוב לכיול יש ללחוץ על מקש "רווח"</p>
            </div>
          `);
          k(e => {
            if (e.code === 'Space' || e.key === ' ') {
              e.preventDefault();
              document.onkeydown = null;
              run6PointCalibration(onComplete, isSimulation);
            }
          });
          return;
        }

        const X = calibDataX.map(d => d.feat);
        const Yx = calibDataX.map(d => d.target);
        const Yy = calibDataY.map(d => d.target);
        weightsX = solveLinearRegression(X, Yx);
        weightsY = solveLinearRegression(X, Yy);
      }
      onComplete();
      return;
    }

    const startPointLogic = () => {
      const pt = points[index];
      base(`
        <div class="calib-stage">
          <div class="calib-target" style="left:${pt.x}%;top:${pt.y}%">
            <div class="calib-center-dot"></div>
            <div class="calib-ring"></div>
          </div>
        </div>
      `);

      const targetX = (pt.x / 100) * window.innerWidth;
      const targetY = (pt.y / 100) * window.innerHeight;
      const startTimePoint = performance.now();
      const duration = 1200;
      const ignoreInitialMs = 250;

      function sampleLoop() {
        const elapsed = performance.now() - startTimePoint;

        if (!isSimulation && elapsed >= ignoreInitialMs && elapsed < duration) {
          totalCalibSamples++;
          if (currentFeatures) {
            calibDataX.push({ feat: [...currentFeatures], target: targetX });
            calibDataY.push({ feat: [...currentFeatures], target: targetY });
          }
        }

        if (elapsed < duration) {
          requestAnimationFrame(sampleLoop);
        } else {
          index++;
          runNextPoint();
        }
      }

      requestAnimationFrame(sampleLoop);
    };

    if (index > 0) {
      runTransition(points[index - 1], points[index], 400, startPointLogic);
    } else {
      startPointLogic();
    }
  }

  runNextPoint();
}

function trial(row, done, isPractice = false){
  const faces=row.slice(0,4).map(x=>String(x).endsWith('.webp')?String(x):String(x)+'.webp');
  const loadPromise=preloadTrial(faces);

  run6PointCalibration(() => {
    loadPromise.then(async ()=>{
      await Promise.all(faces.map(x => loadImageCached(x)));
      base(`<div class="trial-grid" style="visibility:hidden">${faces.map((x,i)=>picture(x,'pos p'+(i+1))).join('')}</div>`);
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          const grid=document.querySelector('.trial-grid');
          if(!grid)return;
          grid.style.visibility='visible';

          setTimeout(()=>{
            base('<div class="bottom-fix">+</div>');
            setTimeout(()=>response(row,done, true),3000);
          },5000);
        });
      });
    }).catch(err=>{console.error('Trial preload failed',err);if(typeof done==='function')done();});
  }, isPractice);
}

function response(row, done, isPractice = false, trialMeta = null){
  const singleName=String(row[4]).endsWith('.webp')?String(row[4]):String(row[4])+'.webp';
  base(`${picture(singleName,'center')}<div class="question">האם הפרצוף הזה הופיע במסך הקודם?</div><div class="keys"><span class="yes">I = כן</span><span class="no">E = לא</span></div>`);
  const t=performance.now();
  let answered=false;
  let timeoutId=null;
  document.onkeydown=null;
  document.onkeydown=e=>{
    const key=String(e.key||'').toLowerCase();
    const q=e.code==='KeyI'||key==='i'||key==='ך'?'i':e.code==='KeyE'||key==='e'||key==='ק'?'e':'';
    if(!q||answered)return;
    e.preventDefault();
    e.stopImmediatePropagation();
    answered=true;
    clearTimeout(timeoutId);
    document.onkeydown=null;
    
    const isCorrect = q === row[row.length-1];
    if (showFeedback && !isCorrect) {
      practiceErrors++;
    }

    if (!showFeedback && trialMeta) {
      S.trials.push({
        phase: 'main',
        block: trialMeta.block,
        trial: trialMeta.trial,
        ffi: trialMeta.ffi,
        ffl: trialMeta.ffl,
        singleStimulus: trialMeta.singleStimulus,
        isFamiliarStimulus: trialMeta.isFamiliarStimulus,
        expectedAnswer: trialMeta.correctKey === 'i' ? 'yes' : 'no',
        correctKey: trialMeta.correctKey,
        key: q,
        correct: isCorrect,
        timeout: false,
        rt: performance.now() - t
      });
      autoSavePartial();
    }

    const finishAnswer=()=>{if(typeof done==='function')done()};
    if(showFeedback){base(`<h2 style="color:${isCorrect?'#00a83b':'#b32626'}">${isCorrect?'תשובה נכונה':'תשובה שגויה'}</h2>`);setTimeout(finishAnswer,700)}
    else finishAnswer()
  };
  timeoutId=setTimeout(()=>{
    if(answered)return;
    answered=true;
    document.onkeydown=null;
    
    if (showFeedback) {
      practiceErrors++;
    }

    if (!showFeedback && trialMeta) {
      S.trials.push({
        phase: 'main',
        block: trialMeta.block,
        trial: trialMeta.trial,
        ffi: trialMeta.ffi,
        ffl: trialMeta.ffl,
        singleStimulus: trialMeta.singleStimulus,
        isFamiliarStimulus: trialMeta.isFamiliarStimulus,
        expectedAnswer: trialMeta.correctKey === 'i' ? 'yes' : 'no',
        correctKey: trialMeta.correctKey,
        key: null,
        correct: false,
        timeout: true,
        rt: null
      });
      autoSavePartial();
    }

    if(showFeedback){base('<h2 style="color:#9b3f3f">לאט מידי</h2>');setTimeout(()=>{if(typeof done==='function')done()},700)}
    else if(typeof done==='function')done()
  },2000);
  window.focus();
}

function track(t0, sex, trial, ffi, ffl){
  const stopAt=t0+5000;
  const f=()=>{
    const now=performance.now();
    if(now>=stopAt)return;
    
    const gaze = predictGaze();
    let normX = null, normY = null, quadrant = null, gaze_location = null, eof = 0;

    if (gaze && gaze.x !== null && gaze.y !== null) {
      normX = gaze.x / window.innerWidth;
      normY = gaze.y / window.innerHeight;

      if (normX < 0.5 && normY < 0.5) { quadrant = "TopLeft"; gaze_location = 1; }
      else if (normX >= 0.5 && normY < 0.5) { quadrant = "TopRight"; gaze_location = 2; }
      else if (normX >= 0.5 && normY >= 0.5) { quadrant = "BottomRight"; gaze_location = 3; }
      else if (normX < 0.5 && normY >= 0.5) { quadrant = "BottomLeft"; gaze_location = 4; }
    }

    if (ffi === 1 && gaze_location !== null && gaze_location === ffl) {
      eof = 1;
    } else {
      eof = 0;
    }

    S.raw.push({
      participant: S.id,
      block: sex,
      trial: trial,
      ffi: ffi,
      ffl: ffl,
      timestamp: Number((now - t0).toFixed(2)),
      gazeX: gaze?.x ? Number(gaze.x.toFixed(2)) : null,
      gazeY: gaze?.y ? Number(gaze.y.toFixed(2)) : null,
      normX: normX !== null ? Number(normX.toFixed(4)) : null,
      normY: normY !== null ? Number(normY.toFixed(4)) : null,
      quadrant: quadrant,
      gaze_location: gaze_location,
      eof: eof,
      HIF: isAligned ? 1 : 0,
      screenWidth: window.innerWidth,
      screenHeight: window.innerHeight,
      phase: (now - t0) <= 1000 ? 'Phase1' : 'Phase2'
    });

    requestAnimationFrame(f);
  };
  requestAnimationFrame(f);
}

  if(cameraUtils) cameraUtils.stop();
  document.getElementById('cameraPopup')?.classList.remove('show');
  const popup = document.getElementById('cameraPopup');
  if (popup) {
    popup.classList.remove('show', 'good', 'bad');
    popup.style.display = 'none';
  }
  base(`
    <div class="panel" style="text-align: center; max-width: 850px; direction: rtl; font-size: 24px; line-height: 1.6; padding: 30px;">
      <h2>מעקב העיניים הסתיים</h2>
      <p style="margin-bottom: 20px;">אפשר להירגע. כעת תתבצע משימת דירוג קצרה.</p>
      <p>בשלב הבא יש לדרג (בסולם של 1-9) את המידה בה כל פרצוף תפס לך את העין.</p>
      <p style="margin-top: 15px; margin-bottom: 10px;">כאשר:</p>
      <p><span style="color: #002060; font-weight: bold;">1</span> = במידה מועטה מאוד</p>
      <p><span style="color: #002060; font-weight: bold;">9</span> = במידה רבה מאוד</p>
      <button class="btn" id="b" style="margin-top: 30px;">המשך</button>
    </div>
  `);
  document.getElementById('b').onclick=()=>ratings();
}

function ratings(){
  const all=[...Array.from({length:14},(_,i)=>`UNf${i+1}.webp`),...S.female,...Array.from({length:14},(_,i)=>`UNm${i+1}.webp`),...S.male];
  const go=()=>{
    if(!ratings.i)ratings.i=0;
    if(ratings.i>=all.length) return finishSavingScreen();

    base(`
      <div class="rating-instruction-text">באיזה מידה פרצוף זה תפס לך את העין?</div>
      ${picture(all[ratings.i],'rating-face')}
      <div class="rating-labels">
        <span>9 = במידה רבה מאוד</span>
        <span>1 = במידה מועטה מאוד</span>
      </div>
      <div class="scale">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="ratings.rate(${n})">${n}</button>`).join('')}
      </div>
    `);
  };
  ratings.rate=n=>{
    S.ratings.push({stimulus:all[ratings.i],rating:n});
    ratings.i++;
    go();
  };
  go();
}

// ==========================================
// CSV Conversion & Download Helpers
// ==========================================
function buildSummaryCSV() {
  const mainTrials = S.trials.filter(t => t.phase === 'main');

  const mean = arr => arr.length ? (arr.reduce((a, b) => a + b, 0) / arr.length) : null;
  const pct = (num, den) => den ? ((num / den) * 100) : null;
  const fmt = val => (val !== null && val !== undefined && !isNaN(val)) ? Number(val).toFixed(2) : '';

  const calcGazePct = (blockFilter = null, phaseName = 'Phase1') => {
    const samples = S.raw.filter(r => r.ffi === 1 && r.phase === phaseName && (blockFilter === null || r.block === blockFilter));
    if (!samples.length) return null;
    const eofCount = samples.filter(r => r.eof === 1).length;
    return (eofCount / samples.length) * 100;
  };

  const gazePctP1Overall = calcGazePct(null, 'Phase1');
  const gazePctP2Overall = calcGazePct(null, 'Phase2');
  const gazePctP1Female = calcGazePct('F', 'Phase1');
  const gazePctP2Female = calcGazePct('F', 'Phase2');
  const gazePctP1Male = calcGazePct('M', 'Phase1');
  const gazePctP2Male = calcGazePct('M', 'Phase2');

  const rtOverall = mean(mainTrials.filter(t => t.correct && t.rt !== null).map(t => t.rt));
  const errOverall = pct(mainTrials.filter(t => !t.correct || t.timeout).length, mainTrials.length);

  const famStimTrials = mainTrials.filter(t => t.isFamiliarStimulus === 1);
  const rtFamStim = mean(famStimTrials.filter(t => t.correct && t.rt !== null).map(t => t.rt));
  const errFamStim = pct(famStimTrials.filter(t => !t.correct || t.timeout).length, famStimTrials.length);

  const unfamStimTrials = mainTrials.filter(t => t.isFamiliarStimulus === 0);
  const rtUnfamStim = mean(unfamStimTrials.filter(t => t.correct && t.rt !== null).map(t => t.rt));
  const errUnfamStim = pct(unfamStimTrials.filter(t => !t.correct || t.timeout).length, unfamStimTrials.length);

  const yesTrials = mainTrials.filter(t => t.correctKey === 'i');
  const rtYes = mean(yesTrials.filter(t => t.correct && t.rt !== null).map(t => t.rt));
  const errYes = pct(yesTrials.filter(t => !t.correct || t.timeout).length, yesTrials.length);

  const noTrials = mainTrials.filter(t => t.correctKey === 'e');
  const rtNo = mean(noTrials.filter(t => t.correct && t.rt !== null).map(t => t.rt));
  const errNo = pct(noTrials.filter(t => !t.correct || t.timeout).length, noTrials.length);

  const familiarSet = new Set([...S.female, ...S.male].map(x => String(x).split('/').pop()));
  const famRatings = S.ratings.filter(r => familiarSet.has(String(r.stimulus).split('/').pop())).map(r => r.rating);
  const unfamRatings = S.ratings.filter(r => !familiarSet.has(String(r.stimulus).split('/').pop())).map(r => r.rating);

  const ratingFamMean = mean(famRatings);
  const ratingUnfamMean = mean(unfamRatings);

  const rows = [];

  rows.push('--- AGGREGATED SUMMARY METRICS ---');
  const summaryHeaders = [
    'participant', 'age', 'gender', 'practice_runs_count',
    'gaze_pct_fam_phase1_overall', 'gaze_pct_fam_phase2_overall',
    'gaze_pct_fam_phase1_female', 'gaze_pct_fam_phase2_female',
    'gaze_pct_fam_phase1_male', 'gaze_pct_fam_phase2_male',
    'rt_overall_mean_ms', 'error_rate_overall_pct',
    'rt_fam_stimulus_mean_ms', 'error_rate_fam_stimulus_pct',
    'rt_unfam_stimulus_mean_ms', 'error_rate_unfam_stimulus_pct',
    'rt_yes_target_mean_ms', 'error_rate_yes_target_pct',
    'rt_no_target_mean_ms', 'error_rate_no_target_pct',
    'rating_familiar_mean', 'rating_unfamiliar_mean'
  ];
  rows.push(summaryHeaders.join(','));

  const summaryValues = [
    `"${S.id}"`, `"${S.age}"`, `"${S.gender}"`, `"${S.practiceRunCount || 1}"`,
    `"${fmt(gazePctP1Overall)}"`, `"${fmt(gazePctP2Overall)}"`,
    `"${fmt(gazePctP1Female)}"`, `"${fmt(gazePctP2Female)}"`,
    `"${fmt(gazePctP1Male)}"`, `"${fmt(gazePctP2Male)}"`,
    `"${fmt(rtOverall)}"`, `"${fmt(errOverall)}"`,
    `"${fmt(rtFamStim)}"`, `"${fmt(errFamStim)}"`,
    `"${fmt(rtUnfamStim)}"`, `"${fmt(errUnfamStim)}"`,
    `"${fmt(rtYes)}"`, `"${fmt(errYes)}"`,
    `"${fmt(rtNo)}"`, `"${fmt(errNo)}"`,
    `"${fmt(ratingFamMean)}"`, `"${fmt(ratingUnfamMean)}"`
  ];
  rows.push(summaryValues.join(','));

  rows.push('');

  rows.push('--- MAIN TASK TRIALS ---');
  const trialHeaders = [
    'participant', 'block', 'trial', 'ffi', 'ffl', 'single_stimulus', 
    'is_familiar_stimulus', 'expected_answer', 'correct_key', 'response_key', 
    'correct', 'timeout', 'rt_ms'
  ];
  rows.push(trialHeaders.join(','));

  mainTrials.forEach(t => {
    rows.push([
      `"${S.id}"`,
      `"${t.block}"`,
      `"${t.trial}"`,
      `"${t.ffi}"`,
      `"${t.ffl}"`,
      `"${t.singleStimulus}"`,
      `"${t.isFamiliarStimulus}"`,
      `"${t.expectedAnswer}"`,
      `"${t.correctKey}"`,
      `"${t.key || ''}"`,
      `"${t.correct ? 1 : 0}"`,
      `"${t.timeout ? 1 : 0}"`,
      `"${t.rt !== null && t.rt !== undefined ? Number(t.rt).toFixed(2) : ''}"`
    ].join(','));
  });

  rows.push('');

  rows.push('--- FACE RATINGS ---');
  const ratingHeaders = ['participant', 'stimulus', 'is_familiar', 'rating'];
  rows.push(ratingHeaders.join(','));

  S.ratings.forEach(r => {
    const isFam = familiarSet.has(String(r.stimulus).split('/').pop()) ? 1 : 0;
    rows.push([
      `"${S.id}"`,
      `"${r.stimulus}"`,
      `"${isFam}"`,
      `"${r.rating}"`
    ].join(','));
  });

  return rows.join('\n');
}

function buildRawGazeCSV() {
  if (!S.raw || S.raw.length === 0) return '';
  const headers = [
    'participant', 'block', 'trial', 'ffi', 'ffl', 'timestamp', 
    'gazeX', 'gazeY', 'normX', 'normY', 'quadrant', 'gaze_location', 
    'eof', 'HIF', 'screenWidth', 'screenHeight', 'phase'
  ];
  const rows = [headers.join(',')];

  S.raw.forEach(r => {
    const row = headers.map(h => {
      const val = r[h] === null || r[h] === undefined ? '' : r[h];
      return `"${String(val).replace(/"/g, '""')}"`;
    });
    rows.push(row.join(','));
  });

  return rows.join('\n');
}

function downloadCSV(csvContent, fileName) {
  if (!csvContent) return;
  const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  const url = URL.createObjectURL(blob);
  link.setAttribute('href', url);
  link.setAttribute('download', fileName);
  link.style.visibility = 'hidden';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// ==========================================
// Firebase Storage Save Flow
// ==========================================
function finishSavingScreen() {
  base(`${picture('biu_logo.png','logo')}<div class="panel"><h1>אנא המתן/ני בזמן שהנתונים נשמרים</h1><p>הנתונים נשלחים לשרת תחת מספר משתתף ${S.id}. <span style="color: darkred; font-weight: bold;">אנא אל תסגור/י את הדף.</span></p></div>`);

  const csvSummary = buildSummaryCSV();
  const csvRaw = buildRawGazeCSV();

  db.collection('participants').doc(`participant_${S.id}`).set({
    participantId: S.id,
    age: S.age || null,
    gender: S.gender || null,
    summaryCSV: csvSummary,
    rawGazeCSV: csvRaw,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  })
  .then(() => {
    console.log("הנתונים נשמרו בהצלחה ב-Firestore!");
    finalScreen(false);
  })
  .catch((error) => {
    console.error("שגיאה בשמירת הנתונים ב-Firestore:", error);
    
    downloadCSV(csvSummary, `participant_${S.id}_summary.csv`);
    downloadCSV(csvRaw, `participant_${S.id}_raw_gaze.csv`);
    
    finalScreen(true);
  });
}

function finalScreen(hasError = false) {
  let message = "הניסוי הסתיים והנתונים נשמרו בהצלחה בשרת בפורמט CSV.";
  if (hasError) {
    message = "הניסוי הסתיים. הייתה שגיאה בחיבור לענן, לכן קובצי ה-CSV הורדו באופן אוטומטי למחשב שלך כגיבוי.";
  }

  base(`
    ${picture('biu_logo.png','logo')}
    <div class="panel">
      <h1>תודה רבה על השתתפותך 😊</h1>
      <p>${message}</p>
      <h2 style="margin-top: 30px; color: #ffea00;">כעת ניתן לצאת מדף זה.</h2>
    </div>
  `);
}

function exit(t){
  document.body.style.cursor = 'default';
  base(`<div class="panel"><h2>${t}</h2></div>`);
}

preload();
</script>
