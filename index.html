<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ניסוי זיכרון קצר־טווח ומעקב עיניים</title>
  
  <script src="https://unpkg.com/jspsych@8.2.1"></script>
  
  <!-- MediaPipe FaceMesh Dependencies (מונע שגיאות 404 על קבצי WASM מקומיים) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  
  <!-- WebGazer -->
  <script src="https://unpkg.com/webgazer@8.2.1"></script>
  
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #808080;
      color: #fff;
      font-family: Calibri, Arial, sans-serif;
    }

    button, input, textarea, select {
      font-family: Calibri, Arial, sans-serif;
    }

    body {
      overflow: hidden;
    }

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2vh 4vw;
    }

    .hidden {
      display: none !important;
    }

    .panel {
      max-width: 900px;
      background: #0002;
      padding: 24px;
      border-radius: 14px;
    }

    .consent-choice {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 420px;
    }

    .consent-form {
      width: min(920px, 94vw);
      max-height: 92vh;
      overflow-y: auto;
      text-align: right;
      line-height: 1.55;
    }

    .consent-form h2 {
      text-align: center;
      margin-top: 0;
    }

    .consent-form p {
      margin: 10px 0;
    }

    .consent-actions {
      text-align: center;
      margin-top: 18px;
    }

    .consent-actions .btn {
      display: block;
      margin: 10px auto;
      min-width: 310px;
    }

    h1 { font-size: 34px; }
    h2 { font-size: 30px; }

    .logo {
      position: absolute;
      top: 3vh;
      left: 20vw;
      width: 60vw;
      height: 17vh;
      object-fit: contain;
    }

    .slide, .wide {
      width: 70vw;
      height: 58vh;
      object-fit: contain;
    }

    .keyboard-nav {
      display: block;
      width: min(32vw, 360px);
      height: auto;
      max-height: 14vh;
      object-fit: contain;
      margin: 8px auto 14px;
    }

    .nav {
      position: absolute;
      bottom: 5vh;
      left: 15vw;
      width: 15vw;
      height: 6vh;
      object-fit: contain;
      cursor: pointer;
    }

    .btn {
      font-size: 22px;
      color: #fff;
      background: #4f8f52;
      border: 0;
      border-radius: 8px;
      padding: 12px 28px;
      cursor: pointer;
      margin: 8px;
      box-shadow: 0 2px 5px #0005;
    }

    .btn:hover { background: #5da660; }
    .btn:disabled { background: #777; color: #ddd; cursor: not-allowed; }

    .input {
      font-size: 24px;
      padding: 12px;
      text-align: center;
      direction: ltr;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      max-width: 800px;
    }

    .candidate {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border: 5px solid transparent;
      border-radius: 8px;
      cursor: pointer;
    }

    .candidate.sel { border-color: #00ff7f; }

    .fix {
      font-family: Arial, sans-serif;
      font-size: 128px;
      font-weight: 400;
      line-height: .8;
      color: #fff;
      text-shadow: none;
      letter-spacing: 0;
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bottom-fix {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 7vh;
      top: auto;
      height: auto;
      display: block;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 128px;
      line-height: .8;
      color: #fff;
      font-weight: 400;
    }

    .no-btn { background: #9b3f3f; color: #fff; }
    .no-btn:hover { background: #ad4b4b; }

    .count { font-size: 110px; }
    .trial-grid { position: absolute; inset: 0; }

    .pos {
      position: absolute;
      width: 40vw;
      height: 40vh;
      object-fit: contain;
    }

    .p1 { left: 10vw; top: 5vh; }
    .p2 { left: 50vw; top: 5vh; }
    .p3 { left: 50vw; top: 55vh; }
    .p4 { left: 10vw; top: 55vh; }

    .center {
      position: absolute;
      left: 30vw;
      top: 30vh;
      width: 40vw;
      height: 40vh;
      max-width: 40vw;
      max-height: 40vh;
      object-fit: contain;
      display: block;
    }

    .question {
      position: absolute;
      top: 5vh;
      left: 0;
      right: 0;
      font-size: 48px;
      font-weight: bold;
    }

    .keys {
      position: absolute;
      bottom: 4vh;
      left: 0;
      right: 0;
      height: 10vh;
      font-size: 54px;
      font-weight: bold;
      color: #063b88;
      direction: ltr;
    }

    .keys .yes { position: absolute; right: 8vw; white-space: nowrap; }
    .keys .no { position: absolute; left: 8vw; white-space: nowrap; }

    .camera {
      width: 220px;
      height: 150px;
      border: 5px solid #d33;
      background: #222;
    }

    .camera-popup {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 9999;
      background: #111c;
      padding: 6px;
      border-radius: 8px;
      display: none;
    }

    .camera-popup.show { display: block; }

    .camera-popup video, .wg-camera {
      display: block;
      width: 180px;
      height: 120px;
      object-fit: cover;
    }

    .camera-label {
      font-size: 14px;
      color: #fff;
      margin-bottom: 4px;
    }

    .camera-popup.good { border: 5px solid #35d36b; }
    .camera-popup.bad { border: 5px solid #d33; }

    .calibration { position: absolute; inset: 0; }

    .calpoint {
      position: absolute;
      width: 58px;
      height: 58px;
      background: #fff;
      border: 5px solid #222;
      border-radius: 5px;
      transform: translate(-50%, -50%);
      cursor: pointer;
      color: #222;
      font: 700 24px Calibri, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .calpoint.done { background: #35d36b; }
    .status { min-height: 30px; color: #ffe66d; }
    .selection-error { color: #9b3f3f; font-size: 26px; font-weight: bold; min-height: 34px; }

    .rating-face {
      display: block;
      width: 40vw;
      height: 40vh;
      max-width: 40vw;
      max-height: 40vh;
      object-fit: contain;
      margin: 2vh auto;
    }

    .scale { direction: ltr; }
    .scale button {
      font-size: 22px;
      width: 42px;
      height: 42px;
      margin: 4px;
    }
  </style>
</head>
<body>
  <main id="app" class="app"></main>

  <script>
    const A = 'https://raw.githubusercontent.com/Imbar1/EyeMovement/main/resources/';
    const assets = [
      'biu_logo.png', 'forward.png', 'only_forward.jpg', 'back_and_forward.jpg',
      'glasses_YN.jpg', 'consent_pic.jpg', 'confir.png', 'b_women_pics.jpg', 'b_men_pics.jpg',
      'SMT_instructions.jpg', 'SMT_example.jpg', 'twoSessInst.jpg', 'b_practice.jpg', 'b_STM.jpg',
      'b_sig_rate.jpg',
      ...Array.from({ length: 10 }, (_, i) => `P${i + 1}.webp`),
      ...Array.from({ length: 14 }, (_, i) => `UNf${i + 1}.webp`),
      ...Array.from({ length: 14 }, (_, i) => `UNm${i + 1}.webp`),
      ...Array.from({ length: 12 }, (_, i) => `F${i + 1}.webp`),
      ...Array.from({ length: 12 }, (_, i) => `M${i + 1}.webp`)
    ];

    const S = {
      id: '', age: '', gender: '', female: [], male: [], raw: [], trials: [], ratings: [],
      cal1: 0, cal2: 0, calAcc1: 0, calAcc2: 0
    };

    const root = document.getElementById('app');
    const imageCache = new Map();

    function loadImageCached(name) {
      const key = String(name).split('/').pop();
      if (imageCache.has(key)) return imageCache.get(key);

      const p = new Promise(resolve => {
        const im = new Image();
        im.decoding = 'async';
        im.onload = async () => {
          try { if (im.decode) await im.decode(); } catch (e) {}
          resolve(im);
        };
        im.onerror = () => {
          console.warn('Asset failed to load:', key);
          resolve(null);
        };
        im.src = assetUrl(key);
      });

      imageCache.set(key, p);
      return p;
    }

    function preloadTrial(names) {
      return Promise.all(names.map(loadImageCached));
    }

    const enc = n => A + encodeURIComponent(n);
    const assetUrl = n => enc(n);

    const picture = (n, c = '') => {
      const variants = n === 'biu_logo.png' 
        ? ['biu_logo.png', 'biu_logo.png', 'biu_logo.png'] 
        : [];
      const src = variants.length ? assetUrl(variants[0]) : assetUrl(n);
      const fallback = variants.length 
        ? ` onerror="if(this.dataset.try<${variants.length - 1}){this.dataset.try=(+this.dataset.try||0)+1;this.src='${A}${variants[1]}'}" data-try="0"` 
        : '';
      return `<img class="${c}" src="${src}" alt="${n}"${fallback}>`;
    };

    function base(h) {
      root.innerHTML = `<section class="screen">${h}</section>`;
    }

    function k(fn) {
      document.onkeydown = e => fn(e);
    }

    function exit(msg) {
      stopFaceMonitor();
      base(`
        <div class="panel">
          <h2>הניסוי הופסק</h2>
          <p>${msg}</p>
        </div>
      `);
    }

    async function preload() {
      base(`
        <div class="panel">
          <h1>נא להמתין בזמן שכל חומרי הניסוי נטענים</h1>
          <p>אנא המתן/י עד לסיום הטעינה. אין לסגור את החלון.</p>
          <progress id="pr" max="${assets.length}" value="0"></progress>
          <p id="pc">0%</p>
        </div>
      `);

      const progress = document.getElementById('pr');
      const percent = document.getElementById('pc');
      let completed = 0;

      await Promise.all(assets.map(async name => {
        await loadImageCached(name);
        completed++;
        progress.value = completed;
        percent.textContent = Math.round((completed / assets.length) * 100) + '%';
      }));

      await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      screen1();
    }

    function screen1() {
      base(`
        <div class="panel">
          <h1>ברוכים הבאים למחקר</h1>
          <p>נא הזן/י את מספר המשתתף/ת.</p>
          <input id="pid" class="input" inputmode="numeric"><br>
          <button class="btn" id="go">המשך</button>
          <p id="err" class="status"></p>
        </div>
      `);

      document.getElementById('go').addEventListener('click', () => {
        const value = document.getElementById('pid').value.trim();
        if (!value) {
          document.getElementById('err').textContent = 'נא להזין מספר';
          return;
        }
        S.id = value;
        screenDemographics();
      });
    }

    function screenDemographics() {
      base(`
        <div class="panel">
          <h2>פרטים אישיים</h2>
          <p>נא להזין/י את גילך ולבחור מגדר.</p>
          <label for="age">גיל</label><br>
          <input id="age" class="input" type="text" inputmode="numeric" autocomplete="off"><br>
          <label for="gender">מגדר</label><br>
          <select id="gender" class="input">
            <option value="">יש לבחור</option>
            <option value="זכר">זכר</option>
            <option value="נקבה">נקבה</option>
          </select><br>
          <button class="btn" id="demoGo">המשך</button>
          <p id="demoErr" class="status"></p>
        </div>
      `);

      document.getElementById('demoGo').addEventListener('click', () => {
        const age = document.getElementById('age').value.trim();
        const gender = document.getElementById('gender').value;

        if (!age) {
          document.getElementById('demoErr').textContent = 'נא להזין גיל';
          return;
        }
        if (!gender) {
          document.getElementById('demoErr').textContent = 'נא לבחור מגדר';
          return;
        }

        S.age = age;
        S.gender = gender;
        screen2();
      });
    }

    function screen2() {
      base(`
        <div class="panel consent-choice">
          <h2>האם את/ה מרכיב/ה משקפיים?</h2>
          <div>
            <button class="btn" id="yes">כן</button>
            <button class="btn no-btn" id="no">לא</button>
          </div>
        </div>
      `);

      document.getElementById('yes').addEventListener('click', () => 
        exit('תודה רבה על ההתעניינות במחקר שלנו. מכיוון שאת/ה מרכיב/ה משקפיים לא תוכל/י לבצע את הניסוי. סליחה ויום טוב :)')
      );
      document.getElementById('no').addEventListener('click', consentScreen);
    }

    function consentScreen() {
      base(`
        <div class="panel consent-form">
          <h2>טופס הסכמה מדעת להשתתפות בניסוי At First Glance</h2>
          <p><strong>שם המחקר:</strong> At First Glance</p>
          <p><strong>שם החוקר האחראי:</strong> אמבר מזרחי, המחלקה לקרימינולוגיה, אוניברסיטת בר-אילן.</p>
          <p><strong>מטרת המחקר:</strong> מטרת המחקר הינה לבחון את זיהוי פריטים (זיכרון) בעת הצגת פריטים שונים על המסך, בהתאם להוראות שיוצגו בהמשך.</p>
          <p><strong>מה תתבקש/י לעשות במחקר?</strong><br>בניסוי זה תבקש/י לבצע משימה מסוימת שבמהלכה ימדדו תנועות עינייך ביחידות של מספרים. נדגיש כי פנייך לא יוקלטו!</p>
          <p><strong>כמה זמן ייקח המחקר?</strong> משך הניסוי הוא כ-15 דק'.</p>
          <p><strong>מהם הסיכונים האפשריים הכרוכים בהשתתפות במחקר?</strong> אין סיכונים.</p>
          <p><strong>איזו תועלת תצמח לך מהמחקר?</strong><br>תוכל/י לקבל חצי קופון. בנוסף, תוצאות הניסוי עשויות לתרום להבנה התאורטית של מבחן ה-CIT אשר מהווה תנאי חשוב ליישומו של מבחן זה.</p>
          <p><strong>איך נשמור על המידע שנאגר במסגרת הניסוי?</strong><br>כדי להבטיח את שמירת החיסיון של המידע האישי שלך, כל נתוני המידע יקודדו ויישמרו במחשב באופן אנונימי ונפרד מהפרטים המזהים. בנוסף, לא יעשה שימוש מזהה כלשהו בנתונים שלך בפורום כלשהו או בפרסום מדעי או תקשורתי כלשהו.</p>
          <p><strong>מה יקרה אם תרצה להפסיק את הניסוי באמצע?</strong><br>ההשתתפות בניסוי היא על בסיס התנדבותי. לפיכך – זכותך להפסיק את השתתפותך בניסוי בכל עת ומכל סיבה שהיא. לא תהינה שום השלכות לכך שבחרת להפסיק את הניסוי והחלטה זו לא תפגע בך בשום אופן. בנוסף, את הקרדיט היחסי עבור הניסוי תקבל גם במקרה שתחליט לפרוש.</p>
          <p>במקרה הצורך ניתן ליצור קשר עם החוקרת האחראית – <strong>אמבר מזרחי</strong> – בכל שאלה ועניין בטלפון 050-3477040 ובאי-מייל imbar.mizrahi123@gmail.com.</p>
          <p><strong>מידע ליצירת קשר לעזרה במקרה של פגיעה מהמחקר</strong><br>במידה ותרצה לשוחח על מחקר זה עם משהו שאינו מעורב ישירות במחקר, תוכל לדבר עם <strong>ד&quot;ר יהונתן לוי</strong> בכתובת המייל הבאה: jonathan.levy@biu.ac.il.</p>
          <div class="consent-actions">
            <button class="btn" id="agree">אני מסכים/ה להשתתף בניסוי</button>
            <button class="btn no-btn" id="decline">אני לא מסכים/ה להשתתף בניסוי</button>
          </div>
        </div>
      `);

      document.getElementById('agree').addEventListener('click', screen5);
      document.getElementById('decline').addEventListener('click', () => 
        exit('תודה רבה על ההתעניינות במחקר שלנו. יום טוב :)')
      );
    }

    function instr(pic, next) {
      base(`
        ${picture(pic, 'slide')}
        <button class="btn" id="b">המשך</button>
      `);

      const button = document.getElementById('b');
      const nextFunction = window[next];

      if (typeof nextFunction !== 'function') {
        console.error('Next screen function not found:', next);
        return;
      }

      button.addEventListener('click', nextFunction);
    }

    function screen5() { instr('b_women_pics.jpg', 'screen6'); }
    function screen7() { instr('b_men_pics.jpg', 'screen8'); }

    function choose(g) {
      const ns = Array.from({ length: 12 }, (_, i) => `${g}${i + 1}.webp`);

      base(`
        <h2>בחר/י בדיוק שני פרצופים מוכרים</h2>
        <div class="grid">
          ${ns.map((n, i) => `<img class="candidate" id="c${i}" src="${enc(n)}">`).join('')}
        </div>
        <button class="btn" id="b">המשך</button>
        <p id="m" class="selection-error">נבחרו: 0 מתוך 2</p>
      `);

      ns.forEach((_, i) => {
        document.getElementById('c' + i).onclick = () => {
          const x = document.getElementById('c' + i);
          if (x.classList.contains('sel')) {
            x.classList.remove('sel');
          } else if (document.querySelectorAll('.sel').length < 2) {
            x.classList.add('sel');
          }
          m.textContent = 'נבחרו: ' + document.querySelectorAll('.sel').length + ' מתוך 2';
        };
      });

      b.onclick = () => {
        const a = [...document.querySelectorAll('.sel')].map(x => decodeURIComponent(x.src.split('/').pop()));
        if (a.length !== 2) {
          m.textContent = 'יש לבחור בדיוק שני פרצופים';
          return;
        }
        S[g === 'F' ? 'female' : 'male'] = a;
        g === 'F' ? screen7() : screen9();
      };
    }

    function screen6() { choose('F'); }
    function screen8() { choose('M'); }

    let sl = 1;
    function screen9() {
      const p = ['SMT_instructions.jpg', 'SMT_example.jpg', 'twoSessInst.jpg', 'b_practice.jpg'];
      const navImage = sl === 1 ? 'only_forward.jpg' : 'back_and_forward.jpg';

      base(`
        ${picture(p[sl - 1], 'slide')}
        <p>השתמש/י בחצים כדי לנווט</p>
        ${picture(navImage, 'keyboard-nav')}
      `);

      k(e => {
        if (e.key === 'ArrowLeft' && sl > 1) {
          e.preventDefault();
          sl--;
          screen9();
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          if (sl < 4) {
            sl++;
            screen9();
          } else {
            document.onkeydown = null;
            countdown('practice');
          }
        }
      });
    }

    function countdown(type) {
      let n = 3;
      base(`<div id="ct" class="count">3</div>`);

      const t = setInterval(() => {
        n--;
        if (n < 1) {
          clearInterval(t);
          type === 'practice' ? practice() : mainStart(type === 'block2' ? 2 : 1);
        } else {
          ct.textContent = n;
        }
      }, 1000);
    }

    let showFeedback = false;
    const prac = [
      ['P4', 'P6', 'P2', 'P8', 'P2', 'i'],
      ['P1', 'P3', 'P5', 'P7', 'P9', 'e'],
      ['P6', 'P8', 'P4', 'P10', 'P8', 'i'],
      ['P3', 'P9', 'P7', 'P5', 'P1', 'e']
    ];

    function trial(row, done) {
      const faces = row.slice(0, 4).map(x => String(x).endsWith('.webp') ? String(x) : String(x) + '.webp');
      base('<div class="fix">+</div>');

      const loadPromise = preloadTrial(faces);
      const timerPromise = new Promise(resolve => setTimeout(resolve, 5000));

      Promise.all([loadPromise, timerPromise]).then(() => {
        base(`<div class="trial-grid" style="visibility:hidden">${faces.map((x, i) => picture(x, 'pos p' + (i + 1))).join('')}</div>`);

        requestAnimationFrame(() => {
          const grid = document.querySelector('.trial-grid');
          if (!grid) return;
          grid.style.visibility = 'visible';

          setTimeout(() => {
            base('<div class="bottom-fix">+</div>');
            setTimeout(() => response(row, done), 3000);
          }, 5000);
        });
      }).catch(err => {
        console.error('Trial preload failed', err);
        if (typeof done === 'function') done();
      });
    }

    function response(row, done) {
      const singleName = String(row[4]).endsWith('.webp') ? String(row[4]) : String(row[4]) + '.webp';

      base(`
        ${picture(singleName, 'center')}
        <div class="question">האם הפרצוף הזה הופיע במסך הקודם?</div>
        <div class="keys">
          <span class="yes">I = כן</span>
          <span class="no">E = לא</span>
        </div>
      `);

      const t = performance.now();
      let answered = false;
      let timeoutId = null;

      const advance = () => {
        if (answered) return;
        answered = true;
        clearTimeout(timeoutId);
        document.onkeydown = null;
        if (typeof done === 'function') done();
      };

      document.onkeydown = null;
      document.onkeydown = e => {
        const key = String(e.key || '').toLowerCase();
        const q = e.code === 'KeyI' || key === 'i' || key === 'ך' ? 'i' : e.code === 'KeyE' || key === 'e' || key === 'ק' ? 'e' : '';

        if (!q || answered) return;

        e.preventDefault();
        e.stopImmediatePropagation();
        answered = true;
        clearTimeout(timeoutId);
        document.onkeydown = null;

        S.trials.push({
          phase: 'practice',
          rt: performance.now() - t,
          key: q,
          correct: q === row[5]
        });

        const finishAnswer = () => {
          if (typeof done === 'function') done();
        };

        if (showFeedback) {
          base(`<h2 style="color:${q === row[5] ? '#00a83b' : '#b32626'}">${q === row[5] ? 'תשובה נכונה' : 'תשובה שגויה'}</h2>`);
          setTimeout(finishAnswer, 700);
        } else {
          finishAnswer();
        }
      };

      timeoutId = setTimeout(() => {
        if (answered) return;
        answered = true;
        document.onkeydown = null;

        if (showFeedback) {
          base('<h2 style="color:#9b3f3f">לאט מידי</h2>');
          setTimeout(() => {
            if (typeof done === 'function') done();
          }, 700);
        } else if (typeof done === 'function') done();
      }, 2000);

      window.focus();
    }

    function practice() {
      showFeedback = true;
      let i = 0, finished = false;

      const go = () => {
        if (finished) return;
        if (i < prac.length) {
          trial(prac[i++], go);
        } else {
          finished = true;
          showFeedback = false;
          document.onkeydown = null;
          setTimeout(() => { screen12(1); }, 400);
        }
      };

      go();
    }

    let faceMonitor = null, faceHideTimer = null;

    function startFaceMonitor() {
      if (!window.webgazer || faceMonitor) return;

      const popup = document.createElement('div');
      popup.id = 'cameraPopup';
      popup.className = 'camera-popup show bad';
      popup.innerHTML = '<div class="camera-label">בדיקת מיקום הפנים</div>';
      document.body.appendChild(popup);

      let lastSeen = 0, lost = true;
      window.__wgFaceSeen = () => { lastSeen = performance.now(); };

      const attach = () => {
        const video = document.getElementById('webgazerVideoFeed') || document.querySelector('video');
        if (video && !popup.contains(video)) {
          video.className = 'wg-camera';
          video.autoplay = true;
          video.muted = true;
          video.playsInline = true;
          video.style.display = 'block';
          video.style.width = '180px';
          video.style.height = '120px';
          video.style.objectFit = 'cover';
          popup.appendChild(video);
        }
      };

      attach();
      setTimeout(attach, 500);
      setTimeout(attach, 1500);

      faceMonitor = setInterval(() => {
        attach();
        const visible = performance.now() - lastSeen < 700;

        if (!visible) {
          lost = true;
          popup.classList.add('show', 'bad');
          popup.classList.remove('good');
          clearTimeout(faceHideTimer);
        } else if (lost) {
          lost = false;
          popup.classList.remove('bad');
          popup.classList.add('show', 'good');
          clearTimeout(faceHideTimer);
          faceHideTimer = setTimeout(() => {
            if (!lost) popup.classList.remove('show');
          }, 750);
        }
      }, 100);

      return popup;
    }

    function stopFaceMonitor() {
      if (faceMonitor) {
        clearInterval(faceMonitor);
        faceMonitor = null;
      }
      clearTimeout(faceHideTimer);

      const p = document.getElementById('cameraPopup');
      if (p) p.remove();

      try {
        const v = webgazer.getVideoElement?.();
        if (v) v.style.display = 'none';
        webgazer.showVideoPreview(false);
        webgazer.setGazeListener(null);
      } catch (e) {}
    }

    // הפעלת WebGazer המתוקנת למניעת שגיאות ה-404 ב-MediaPipe
    async function startWebgazer() {
      if (!window.webgazer) {
        throw new Error('WebGazer לא נטען');
      }

      try {
        webgazer.saveDataAcrossSessions(false);

        if (window.FaceMesh) {
          window.FACEMESH_SCRIPT_URLS = {
            simd: 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh_solution_simd_wasm_bin.js',
            assets: 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh_solution_packed_assets_loader.js'
          };
        }

        webgazer
          .setRegression('ridge')
          .showVideoPreview(true)
          .showPredictionPoints(true)
          .setGazeListener(data => {
            if (data && Number.isFinite(data.x) && Number.isFinite(data.y)) {
              window.__wgFaceSeen?.();
              window.__lastGaze = data;
              S.raw.push({ x: data.x, y: data.y, t: Date.now() });
            }
          });

        await webgazer.begin();
        await new Promise(resolve => setTimeout(resolve, 1800));

        startFaceMonitor();
        window.__webgazerStarted = true;
        return true;
      } catch (err) {
        console.error('WebGazer initialization failed:', err);
        throw err;
      }
    }

    function calibrate(block) {
      let attempts = 1;
      const webgazerAlreadyRunning = Boolean(window.__webgazerStarted);

      const points = [
        ...[10, 50, 90].flatMap(y => [10, 50, 90].map(x => ({ x, y })))
      ];

      const instruction = () => {
        base(`
          <div class="panel">
            <h2>הוראות כיול</h2>
            <p>
              הביט/י במרובע הלבן שעל המסך ולחץ/י עליו חמש פעמים.
              שמור/י את הראש יציב והסתכל/י ישירות על המטרה.
            </p>
            <button class="btn" id="startCal">
              הבנתי, אפשר להמשיך לכיול
            </button>
          </div>
        `);

        document.getElementById('startCal').onclick = run;
      };

      const run = () => {
        let index = 0;

        const next = () => {
          if (index >= points.length) {
            try {
              webgazer.showPredictionPoints(false);
            } catch (err) {
              console.warn('Could not hide prediction points:', err);
            }

            if (block === 1) {
              S.cal1 = attempts;
              S.calAcc1 = null;
            } else {
              S.cal2 = attempts;
              S.calAcc2 = null;
            }

            screen13(block);
            return;
          }

          const q = points[index];

          base(`
            <div class="calibration">
              <button
                class="calpoint"
                id="target"
                style="left:${q.x}%;top:${q.y}%"
                aria-label="נקודת כיול"
              ></button>
            </div>
          `);

          let count = 0;
          const target = document.getElementById('target');

          target.onclick = () => {
            try {
              webgazer.recordScreenPosition(
                (q.x / 100) * window.innerWidth,
                (q.y / 100) * window.innerHeight,
                'click'
              );
            } catch (err) {
              console.warn('Could not record calibration point:', err);
            }

            count++;
            target.textContent = count;

            if (count >= 5) {
              target.classList.add('done');
              target.disabled = true;

              setTimeout(() => {
                index++;
                next();
              }, 300);
            }
          };
        };

        next();
      };

      const ready = webgazerAlreadyRunning ? Promise.resolve(true) : startWebgazer();

      ready
        .then(() => {
          webgazer.showPredictionPoints(true);
          instruction();
        })
        .catch(err => {
          console.error('Calibration stopped because WebGazer failed:', err);

          base(`
            <div class="panel">
              <h2>שגיאה בהפעלת מעקב העיניים</h2>
              <p>
                WebGazer לא הצליח להפעיל את המצלמה או את מודל מעקב העיניים.
              </p>
              <p>
                יש לוודא שהדפדפן קיבל הרשאה להשתמש במצלמה.
              </p>
              <p class="status">${String(err.message || err)}</p>
            </div>
          `);
        });
    }

    function screen12(block = 1) {
      calibrate(block);
    }

    function screen13(block) {
      base(`
        ${picture('b_STM.jpg', 'slide')}
        <p>ברגע שתרגיש/י מוכן/נה יש ללחוץ על מקש "רווח" כדי להתחיל</p>
      `);

      k(e => {
        if (e.code !== 'Space') return;

        document.onkeydown = null;

        if (block === 1) {
          countdown('main');
        } else {
          calibrate(2);
        }
      });
    }

    function mainStart(block) {
      showFeedback = false;
      try { webgazer.showPredictionPoints(false); } catch (e) {}

      const sex = block === 1 ? (Math.random() < 0.5 ? 'F' : 'M') : (S.lastSex === 'F' ? 'M' : 'F');
      S.lastSex = sex;

      const familiar = (sex === 'F' ? S.female : S.male).map(x => String(x).split('/').pop());
      const f1 = familiar[0] || `${sex}1.webp`;
      const f2 = familiar[1] || `${sex}2.webp`;

      const rows = sex === 'F' 
        ? [
            { ffi: 1, p: [f1, 'UNf13.webp', 'UNf10.webp', 'UNf5.webp'], s: 'UNf6.webp', c: 'e' },
            { ffi: 1, p: ['UNf2.webp', f1, 'UNf14.webp', 'UNf1.webp'], s: f1, c: 'i' },
            { ffi: 1, p: ['UNf6.webp', 'UNf12.webp', f1, 'UNf9.webp'], s: 'UNf5.webp', c: 'e' },
            { ffi: 1, p: ['UNf7.webp', 'UNf8.webp', 'UNf3.webp', f1], s: 'UNf3.webp', c: 'i' },
            { ffi: 1, p: [f2, 'UNf10.webp', 'UNf9.webp', 'UNf7.webp'], s: 'UNf4.webp', c: 'e' },
            { ffi: 1, p: ['UNf8.webp', f2, 'UNf4.webp', 'UNf12.webp'], s: f2, c: 'i' },
            { ffi: 1, p: ['UNf3.webp', 'UNf6.webp', f2, 'UNf13.webp'], s: 'UNf2.webp', c: 'e' },
            { ffi: 1, p: ['UNf11.webp', 'UNf2.webp', 'UNf1.webp', f2], s: 'UNf1.webp', c: 'i' },
            { ffi: 0, p: ['UNf5.webp', 'UNf9.webp', 'UNf2.webp', 'UNf4.webp'], s: 'UNf3.webp', c: 'e' },
            { ffi: 0, p: ['UNf10.webp', 'UNf3.webp', 'UNf6.webp', 'UNf8.webp'], s: 'UNf6.webp', c: 'i' },
            { ffi: 0, p: ['UNf14.webp', 'UNf4.webp', 'UNf7.webp', 'UNf10.webp'], s: 'UNf1.webp', c: 'e' },
            { ffi: 0, p: ['UNf13.webp', 'UNf1.webp', 'UNf5.webp', 'UNf11.webp'], s: 'UNf5.webp', c: 'i' },
            { ffi: 0, p: ['UNf12.webp', 'UNf7.webp', 'UNf8.webp', 'UNf14.webp'], s: f1, c: 'e' },
            { ffi: 0, p: ['UNf4.webp', 'UNf5.webp', 'UNf11.webp', 'UNf6.webp'], s: 'UNf4.webp', c: 'i' },
            { ffi: 0, p: ['UNf9.webp', 'UNf11.webp', 'UNf12.webp', 'UNf3.webp'], s: f2, c: 'e' },
            { ffi: 0, p: ['UNf1.webp', 'UNf14.webp', 'UNf13.webp', 'UNf2.webp'], s: 'UNf2.webp', c: 'i' }
          ].sort(() => Math.random() - 0.5)
        : [
            { ffi: 1, p: [f1, 'UNm13.webp', 'UNm10.webp', 'UNm5.webp'], s: 'UNm6.webp', c: 'e' },
            { ffi: 1, p: ['UNm2.webp', f1, 'UNm14.webp', 'UNm1.webp'], s: f1, c: 'i' },
            { ffi: 1, p: ['UNm6.webp', 'UNm12.webp', f1, 'UNm9.webp'], s: 'UNm5.webp', c: 'e' },
            { ffi: 1, p: ['UNm7.webp', 'UNm8.webp', 'UNm3.webp', f1], s: 'UNm3.webp', c: 'i' },
            { ffi: 1, p: [f2, 'UNm10.webp', 'UNm9.webp', 'UNm7.webp'], s: 'UNm4.webp', c: 'e' },
            { ffi: 1, p: ['UNm8.webp', f2, 'UNm4.webp', 'UNm12.webp'], s: f2, c: 'i' },
            { ffi: 1, p: ['UNm3.webp', 'UNm6.webp', f2, 'UNm13.webp'], s: 'UNm2.webp', c: 'e' },
            { ffi: 1, p: ['UNm11.webp', 'UNm2.webp', 'UNm1.webp', f2], s: 'UNm1.webp', c: 'i' },
            { ffi: 0, p: ['UNm5.webp', 'UNm9.webp', 'UNm2.webp', 'UNm4.webp'], s: 'UNm3.webp', c: 'e' },
            { ffi: 0, p: ['UNm10.webp', 'UNm3.webp', 'UNm6.webp', 'UNm8.webp'], s: 'UNm6.webp', c: 'i' },
            { ffi: 0, p: ['UNm14.webp', 'UNm4.webp', 'UNm7.webp', 'UNm10.webp'], s: 'UNm1.webp', c: 'e' },
            { ffi: 0, p: ['UNm13.webp', 'UNm1.webp', 'UNm5.webp', 'UNm11.webp'], s: 'UNm5.webp', c: 'i' },
            { ffi: 0, p: ['UNm12.webp', 'UNm7.webp', 'UNm8.webp', 'UNm14.webp'], s: f1, c: 'e' },
            { ffi: 0, p: ['UNm4.webp', 'UNm5.webp', 'UNm11.webp', 'UNm6.webp'], s: 'UNm4.webp', c: 'i' },
            { ffi: 0, p: ['UNm9.webp', 'UNm11.webp', 'UNm12.webp', 'UNm3.webp'], s: f2, c: 'e' },
            { ffi: 0, p: ['UNm1.webp', 'UNm14.webp', 'UNm13.webp', 'UNm2.webp'], s: 'UNm2.webp', c: 'i' }
          ].sort(() => Math.random() - 0.5);

      let trialIndex = 0;

      const go = () => {
        if (trialIndex >= rows.length) {
          block === 1 ? screen13(2) : screen16();
          return;
        }

        const r = rows[trialIndex++];
        const faces = r.p.map(x => String(x).endsWith('.webp') ? String(x) : String(x) + '.webp');
        const tno = trialIndex;

        base('<div class="fix">+</div>');

        const loadPromise = preloadTrial(faces);
        const timerPromise = new Promise(resolve => setTimeout(resolve, 5000));

        Promise.all([loadPromise, timerPromise]).then(() => {
          base(`<div class="trial-grid" style="visibility:hidden">${faces.map((x, j) => picture(x, 'pos p' + (j + 1))).join('')}</div>`);

          requestAnimationFrame(() => {
            const grid = document.querySelector('.trial-grid');
            if (!grid) return;
            grid.style.visibility = 'visible';

            setTimeout(() => {
              base('<div class="bottom-fix">+</div>');

              setTimeout(() => {
                const singleName = String(r.s).endsWith('.webp') ? String(r.s) : String(r.s) + '.webp';

                base(`
                  ${picture(singleName, 'center')}
                  <div class="question">האם הפרצוף הזה הופיע במסך הקודם?</div>
                  <div class="keys">
                    <span class="yes">I = כן</span>
                    <span class="no">E = לא</span>
                  </div>
                `);

                const t = performance.now();
                let answered = false;

                const advance = (key, correct) => {
                  if (answered) return;
                  answered = true;
                  document.onkeydown = null;

                  S.trials.push({
                    block,
                    trialNum: tno,
                    sex,
                    ffi: r.ffi,
                    faces: faces.join(';'),
                    single: singleName,
                    target: r.c,
                    key,
                    rt: performance.now() - t,
                    correct
                  });

                  go();
                };

                document.onkeydown = e => {
                  const key = String(e.key || '').toLowerCase();
                  const q = e.code === 'KeyI' || key === 'i' || key === 'ך' ? 'i' : e.code === 'KeyE' || key === 'e' || key === 'ק' ? 'e' : '';

                  if (!q) return;

                  e.preventDefault();
                  advance(q, q === r.c);
                };

                setTimeout(() => {
                  if (!answered) advance('timeout', false);
                }, 2000);

              }, 3000);
            }, 5000);
          });
        }).catch(err => {
          console.error('Main trial preload failed:', err);
          go();
        });
      };

      go();
    }

    function screen16() {
      stopFaceMonitor();
      instr('b_sig_rate.jpg', 'screen17');
    }

    function screen17() {
      const allFaces = [
        ...S.female.map(x => String(x).split('/').pop()),
        ...S.male.map(x => String(x).split('/').pop()),
        ...Array.from({ length: 14 }, (_, i) => `UNf${i + 1}.webp`),
        ...Array.from({ length: 14 }, (_, i) => `UNm${i + 1}.webp`)
      ].sort(() => Math.random() - 0.5);

      let idx = 0;

      const next = () => {
        if (idx >= allFaces.length) {
          finishAndSave();
          return;
        }

        const face = allFaces[idx];

        base(`
          <div class="panel">
            <h2>עד כמה הפרצוף הזה מוכר לך?</h2>
            <p>1 = לא מוכר בכלל, 9 = מוכר מאוד</p>
            ${picture(face, 'rating-face')}
            <div class="scale">
              ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => `<button class="btn" onclick="rate(${num})">${num}</button>`).join('')}
            </div>
          </div>
        `);
      };

      window.rate = score => {
        S.ratings.push({ face: allFaces[idx], rating: score });
        idx++;
        next();
      };

      next();
    }

    function downloadData(filename, text) {
      const blob = new Blob([text], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function finishAndSave() {
      base(`
        <div class="panel">
          <h2>תודה רבה על השתתפותך!</h2>
          <p>הניסוי הסתיים בהצלחה. הנתונים נשמרים כעת במחשבך.</p>
        </div>
      `);

      // 1. קובץ ניסוי ראשי
      let trialCsv = 'ID,Age,Gender,Block,TrialNum,Sex,FFI,Faces,SingleFace,Target,ResponseKey,RT,Correct\n';
      S.trials.forEach(t => {
        trialCsv += `${S.id},${S.age},${S.gender},${t.block || 'practice'},${t.trialNum || ''},${t.sex || ''},${t.ffi || ''},"${t.faces || ''}",${t.single || ''},${t.target || ''},${t.key},${Math.round(t.rt)},${t.correct}\n`;
      });
      downloadData(`sub_${S.id}_trials.csv`, trialCsv);

      // 2. קובץ דירוג פרצופים
      let ratingCsv = 'ID,Face,Rating\n';
      S.ratings.forEach(r => {
        ratingCsv += `${S.id},${r.face},${r.rating}\n`;
      });
      downloadData(`sub_${S.id}_ratings.csv`, ratingCsv);

      // 3. קובץ תנועות עיניים (Raw Gaze)
      let gazeCsv = 'ID,Timestamp,X,Y\n';
      S.raw.forEach(g => {
        gazeCsv += `${S.id},${g.t},${Math.round(g.x)},${Math.round(g.y)}\n`;
      });
      downloadData(`sub_${S.id}_gaze.csv`, gazeCsv);
    }

    // הריצה ההתחלתית
    window.onload = preload;
  </script>
</body>
</html>
