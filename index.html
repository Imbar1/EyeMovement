const imageCache=new Map();
function loadImageCached(name){
  const key=String(name).split('/').pop();
  if(imageCache.has(key)) return imageCache.get(key);
  const p=new Promise(resolve=>{
    const im=new Image();
    im.decoding='async';
    im.onload=async()=>{try{if(im.decode) await im.decode()}catch(e){} resolve(im)};
    im.onerror=()=>{console.warn('Asset failed to load:',key);resolve(null)};
    im.src=assetUrl(key);
  });
  imageCache.set(key,p);
  return p;
}

// ==========================================
// MediaPipe Face Mesh & Polynomial Regression Model
// ==========================================
let faceMesh = null;
let cameraUtils = null;
let currentFeatures = null;
let calibDataX = [];
let calibDataY = [];
let weightsX = null;
let weightsY = null;

let smoothGazeX = null;
let smoothGazeY = null;

let goodStateStartTime = 0;
let isAligned = false;

function solveLinearRegression(X, Y) {
  const N = X.length;
  const K = X[0].length;
  let XTX = Array.from({length: K}, () => new Array(K).fill(0));
  for(let i=0; i<K; i++) {
    for(let j=0; j<K; j++) {
      for(let n=0; n<N; n++) {
        XTX[i][j] += X[n][i] * X[n][j];
      }
    }
  }
  for(let i=0; i<K; i++) XTX[i][i] += 1e-3;

  let I = Array.from({length: K}, (_, i) => Array.from({length: K}, (_, j) => i === j ? 1 : 0));
  let M = XTX.map(row => [...row]);

  for(let i=0; i<K; i++) {
    let pivot = M[i][i];
    if(Math.abs(pivot) < 1e-9) pivot = 1e-9;
    for(let j=0; j<K; j++) {
      M[i][j] /= pivot;
      I[i][j] /= pivot;
    }
    for(let k=0; k<K; k++) {
      if(k !== i) {
        let factor = M[k][i];
        for(let j=0; j<K; j++) {
          M[k][j] -= factor * M[i][j];
          I[k][j] -= factor * I[i][j];
        }
      }
    }
  }
  let invXT = Array.from({length: K}, () => new Array(N).fill(0));
  for(let i=0; i<K; i++) {
    for(let n=0; n<N; n++) {
      for(let j=0; j<K; j++) {
        invXT[i][n] += I[i][j] * X[n][j];
      }
    }
  }
  let W = new Array(K).fill(0);
  for(let i=0; i<K; i++) {
    for(let n=0; n<N; n++) {
      W[i] += invXT[i][n] * Y[n];
    }
  }
  return W;
}

function predictGaze() {
  if(!weightsX || !weightsY || !currentFeatures) return null;
  let rawX = 0, rawY = 0;
  for(let i=0; i<currentFeatures.length; i++) {
    rawX += currentFeatures[i] * weightsX[i];
    rawY += currentFeatures[i] * weightsY[i];
  }

  rawX = Math.max(0, Math.min(window.innerWidth, rawX));
  rawY = Math.max(0, Math.min(window.innerHeight, rawY));

  if (smoothGazeX === null) {
    smoothGazeX = rawX;
    smoothGazeY = rawY;
  } else {
    smoothGazeX = smoothGazeX * 0.70 + rawX * 0.30;
    smoothGazeY = smoothGazeY * 0.70 + rawY * 0.30;
  }

  return { x: smoothGazeX, y: smoothGazeY };
}

function initFaceMeshSystem() {
  if(faceMesh) return Promise.resolve(true);

  const video = document.getElementById('webcamVideo');
  const canvas = document.getElementById('meshCanvas');
  const ctx = canvas.getContext('2d');
  const popup = document.getElementById('cameraPopup');
  const statusTxt = document.getElementById('cameraStatusText');

  faceMesh = new FaceMesh({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
  });

  faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  faceMesh.onResults(results => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
      const lm = results.multiFaceLandmarks[0];
      
      if (typeof drawConnectors === 'function' && typeof FACEMESH_TESSELATION !== 'undefined') {
        drawConnectors(ctx, lm, FACEMESH_TESSELATION, {color: '#00FFFF', lineWidth: 0.3});
      }

      const lIris = lm[468], rIris = lm[473];
      const lOut = lm[33], lIn = lm[133];
      const rOut = lm[263], rIn = lm[362];

      const lTop = lm[159], lBot = lm[145];
      const lEyeH = Math.hypot(lTop.x - lBot.x, lTop.y - lBot.y);
      const lEyeW = Math.hypot(lOut.x - lIn.x, lOut.y - lIn.y);

      if (lEyeH / (lEyeW || 0.01) < 0.12) {
        currentFeatures = null;
        return;
      }

      const mLx = (lOut.x + lIn.x) / 2;
      const mLy = (lOut.y + lIn.y) / 2;
      const mRx = (rOut.x + rIn.x) / 2;
      const mRy = (rOut.y + rIn.y) / 2;

      const eyeDistance = Math.hypot(mRx - mLx, mRy - mLy) || 0.1;

      const dxL = (lIris.x - mLx) / eyeDistance;
      const dyL = (lIris.y - mLy) / eyeDistance;
      const dxR = (rIris.x - mRx) / eyeDistance;
      const dyR = (rIris.y - mRy) / eyeDistance;

      const noseBridge = lm[6];

      currentFeatures = [
        1,
        dxL, dyL,
        dxR, dyR,
        noseBridge.x, noseBridge.y,
        dxL * dxL, dyL * dyL,
        dxR * dxR, dyR * dyR
      ];

      const nose = lm[1];
      const centered = nose.x > 0.25 && nose.x < 0.75 && nose.y > 0.20 && nose.y < 0.80;
      const isForceShown = performance.now() < forceShowPopupUntil;

      if (centered) {
        isAligned = true;
        popup.classList.remove('bad');
        popup.classList.add('good');
        statusTxt.textContent = 'הפנים זוהו';

        if (!goodStateStartTime) goodStateStartTime = performance.now();
        if (isForceShown) {
          popup.classList.add('show');
        } else if (performance.now() - goodStateStartTime >= 200) {
          popup.classList.remove('show');
        }
      } else {
        isAligned = false;
        goodStateStartTime = 0;
        popup.classList.remove('good');
        popup.classList.add('bad', 'show');
        statusTxt.textContent = 'חריגה מהמסגרת';
      }
    } else {
      currentFeatures = null;
      isAligned = false;
      goodStateStartTime = 0;
      popup.classList.remove('good');
      popup.classList.add('bad', 'show');
      statusTxt.textContent = 'פנים לא זוהו';
    }
  });

  cameraUtils = new Camera(video, {
    onFrame: async () => {
      await faceMesh.send({image: video});
    },
    width: 320,
    height: 240
  });

  return cameraUtils.start().then(() => {
    popup.classList.add('show');
    return true;
  });
}

function startMiniCalibAnimation() {
  const container = document.getElementById('miniCalibContainer');
  if(!container) return;

  const pts = [
    { x: 50, y: 50 },
    { x: 15, y: 15 },
    { x: 85, y: 15 },
    { x: 85, y: 85 },
    { x: 15, y: 85 },
    { x: 50, y: 50 }
  ];

  let stepIdx = 0;

  function playStep() {
    if(!document.getElementById('miniCalibContainer')) return;

    const curr = pts[stepIdx];
    const next = pts[(stepIdx + 1) % pts.length];

    container.innerHTML = `
      <div style="position:absolute;left:${curr.x}%;top:${curr.y}%;transform:translate(-50%,-50%);width:22px;height:22px;display:flex;align-items:center;justify-content:center;">
        <div style="width:7px;height:7px;background:#ffffff;border:1px solid #002060;border-radius:50%;position:absolute;z-index:2;box-shadow:0 0 6px #ffffff;"></div>
        <div class="mini-shrink-ring"></div>
      </div>
    `;

    miniCalibTimer = setTimeout(() => {
      let progress = 0;

      function drawLineStep() {
        if(!document.getElementById('miniCalibContainer')) return;

        progress += 0.10;
        if(progress > 1) progress = 1;

        const curX = curr.x + (next.x - curr.x) * progress;
        const curY = curr.y + (next.y - curr.y) * progress;

        container.innerHTML = `
          <svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;">
            <line x1="${curr.x}%" y1="${curr.y}%" x2="${curX}%" y2="${curY}%" stroke="#ffffff" stroke-dasharray="3 3" stroke-width="2" opacity="0.95" />
          </svg>
          <div style="position:absolute;left:${curX}%;top:${curY}%;transform:translate(-50%,-50%);width:6px;height:6px;background:#ffffff;border:1px solid #002060;border-radius:50%;box-shadow:0 0 4px #ffffff;"></div>
        `;

        if(progress < 1) {
          miniCalibTimer = setTimeout(drawLineStep, 35);
        } else {
          stepIdx = (stepIdx + 1) % pts.length;
          miniCalibTimer = setTimeout(playStep, 100);
        }
      }

      drawLineStep();
    }, 650);
  }

  playStep();
}

function countdown(type, callback) {
  let count = 3;
  base(`<div class="count">${count}</div>`);
  const interval = setInterval(() => {
    count--;
    if (count > 0) {
      base(`<div class="count">${count}</div>`);
    } else {
      clearInterval(interval);
      if (typeof callback === 'function') callback();
    }
  }, 1000);
}

function runCalibration(onComplete) {
  initFaceMeshSystem().then(() => {
    calibDataX = [];
    calibDataY = [];

    const calibPoints = [
      { x: 0.50, y: 0.50 },
      { x: 0.15, y: 0.15 },
      { x: 0.85, y: 0.15 },
      { x: 0.85, y: 0.85 },
      { x: 0.15, y: 0.85 },
      { x: 0.50, y: 0.50 }
    ];

    let currentPointIdx = 0;

    function showPoint() {
      if (currentPointIdx >= calibPoints.length) {
        if (calibDataX.length > 5) {
          const X = calibDataX.map(d => d.features);
          const Yx = calibDataX.map(d => d.targetX);
          const Yy = calibDataY.map(d => d.targetY);

          weightsX = solveLinearRegression(X, Yx);
          weightsY = solveLinearRegression(X, Yy);
        }
        if (onComplete) onComplete();
        return;
      }

      const pt = calibPoints[currentPointIdx];
      const targetX = pt.x * window.innerWidth;
      const targetY = pt.y * window.innerHeight;

      root.innerHTML = `
        <div class="calib-stage">
          <div class="calib-target" style="left: ${pt.x * 100}%; top: ${pt.y * 100}%;">
            <div class="calib-center-dot"></div>
            <div class="calib-ring"></div>
          </div>
        </div>
      `;

      const sampleInterval = setInterval(() => {
        if (currentFeatures && isAligned) {
          calibDataX.push({ features: [...currentFeatures], targetX: targetX });
          calibDataY.push({ features: [...currentFeatures], targetY: targetY });
        }
      }, 50);

      setTimeout(() => {
        clearInterval(sampleInterval);
        currentPointIdx++;
        showPoint();
      }, 1200);
    }

    showPoint();
  });
}

      if (practiceErrors <= 1) {
        startMainExperiment();
      } else {
        S.practiceRunCount++;
        base(`

  const fillers = Array.from({length: 14}, (_, i) => `${prefix}${i+1}.webp`);

  let trialsList = [];
  for(let i=0; i<8; i++) {
    const shuffle = [...fillers].sort(() => 0.5 - Math.random());
    const g = [selectedFaces[0], selectedFaces[1], shuffle[0], shuffle[1]].sort(() => 0.5 - Math.random());
    const isTarget = Math.random() < 0.5;
    const testFace = isTarget ? g[0] : shuffle[2];
    const expected = g.includes(testFace) ? 'i' : 'e';
    trialsList.push({ grid: g, test: testFace, expected: expected, genderType: genderType });
  }

  let trialIdx = 0;

  function stepTrial() {
    if (trialIdx >= trialsList.length) {
      currentSessionIndex++;
      if (currentSessionIndex < sessions.length) {
        screenSessionBreak();
      } else {
        saveDataAndFinish();
      }
      return;
    }

    const currentTrial = trialsList[trialIdx];
    runTrialLogic(currentTrial, false, (res) => {
      S.trials.push(res);
      autoSavePartial();
      trialIdx++;
      stepTrial();
    });
  }

  runCalibration(() => {
    stepTrial();
  });
}

// ==========================================
// Trial Core Execution Logic
// ==========================================
function runTrialLogic(trial, isPractice, callback) {
  preloadTrial([...trial.grid, trial.test]).then(() => {
    // 1. Grid display (3000ms)
    base(`
      <div class="trial-grid">
        ${picture(trial.grid[0], 'pos p1')}
        ${picture(trial.grid[1], 'pos p2')}
        ${picture(trial.grid[2], 'pos p3')}
        ${picture(trial.grid[3], 'pos p4')}
      </div>
    `);

    setTimeout(() => {
      // 2. Bottom Fixation Cross
      base(`<div class="bottom-fix">+</div>`);

      setTimeout(() => {
        // 3. Test Screen & Response listener
        const startTime = performance.now();
        base(`
          <div class="question">האם הפרצוף הזה הופיע במסך הקודם?</div>
          ${picture(trial.test, 'center')}
          <div class="keys">
            <span class="no">E = לא</span>
            <span class="yes">I = כן</span>
          </div>
        `);

        let answered = false;

        const handleResponse = (key) => {
          if (answered) return;
          answered = true;
          const rt = Math.round(performance.now() - startTime);
          const isCorrect = key.toLowerCase() === trial.expected;

          const trialResult = {
            grid: trial.grid,
            test: trial.test,
            expected: trial.expected,
            response: key,
            correct: isCorrect,
            rt: rt,
            isPractice: isPractice
          };

          if (isPractice) {
            let msg = isCorrect ? '<span style="color:#35d36b">תשובה נכונה</span>' : '<span style="color:#d33">תשובה שגויה</span>';
            base(`<h2>${msg}</h2>`);
            setTimeout(() => callback(trialResult), 1000);
          } else {
            callback(trialResult);
          }
        };

        k(e => {
          const kName = e.key.toLowerCase();
          if (kName === 'i' || kName === 'e') {
            document.onkeydown = null;
            handleResponse(kName);
          }
        });

        setTimeout(() => {
          if (!answered) {
            document.onkeydown = null;
            if (isPractice) {
              base(`<h2 style="color:#d33">לאט מדי</h2>`);
              setTimeout(() => callback({ correct: false, rt: 2500, response: 'none' }), 1000);
            } else {
              callback({ grid: trial.grid, test: trial.test, expected: trial.expected, response: 'none', correct: false, rt: 2500, isPractice: false });
            }
          }
        }, 2500);

      }, 500);
    }, 3000);
  });
}

// ==========================================
// Save Data & Finish
// ==========================================
function saveDataAndFinish() {
  clearPartialSave();
  base(`<div class="panel"><h2>שומר את נתוני הניסוי...</h2><p>אנא המתן/י, אין לסגור את הדפדפן.</p></div>`);

  const docId = `P_${S.id}_${Date.now()}`;
  db.collection('experiment_results').doc(docId).set({
    participantId: S.id,
    age: S.age,
    gender: S.gender,
    selectedFemale: S.female,
    selectedMale: S.male,
    trials: S.trials,
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    exit('תודה רבה! הניסוי הסתיים בהצלחה ונתוניך נשמרו.');
  }).catch(err => {
    console.error('Firebase save error:', err);
    exit('הניסוי הסתיים. תודה רבה על השתתפותך!');
  });
}

function exit(msg) {
  if (miniCalibTimer) clearTimeout(miniCalibTimer);
  document.onkeydown = null;
  base(`<div class="panel"><h2>${msg}</h2></div>`);
}

// Start preload on initialization
preload();
</script>
