<body>
<main id="app" class="app"></main>

<!-- חלון וידאו צף קבוע בפינה -->
<div id="cameraPopup" class="camera-popup bad">
  <div class="camera-label">מיקום פנים</div>

<script>
const A='https://raw.githubusercontent.com/Imbar1/EyeMovement/main/resources/';
const assets=['biu_logo.png','forward.png','only_forward.jpg','back_and_forward.jpg','glasses_YN.jpg','consent_pic.jpg','confir.png','b_women_pics.jpg','b_men_pics.jpg','SMT_instructions.jpg','SMT_example.jpg','twoSessInst.jpg','b_practice.jpg','b_STM.jpg','b_sig_rate.jpg','EM_instructions.jpg',...Array.from({length:10},(_,i)=>`P${i+1}.webp`),...Array.from({length:14},(_,i)=>`UNf${i+1}.webp`),...Array.from({length:14},(_,i)=>`UNm${i+1}.webp`),...Array.from({length:12},(_,i)=>`F${i+1}.webp`),...Array.from({length:12},(_,i)=>`M${i+1}.webp`)];
const S={id:'',age:'',gender:'',female:[],male:[],raw:[],trials:[],ratings:[],cal1:0,cal2:0,calAcc1:0,calAcc2:0};
const root=document.getElementById('app');

const imageCache=new Map();
function loadImageCached(name){
  const key=String(name).split('/').pop();
  if(imageCache.has(key)) return imageCache.get(key);
  const p=new Promise(resolve=>{
    const im=new Image();
    im.decoding='async';
    im.onload=async()=>{try{if(im.decode) await im.decode()}catch(e){} resolve(im)};
    im.onerror=()=>{console.warn('Asset failed to load:',key);resolve(null)};
    im.src=assetUrl(key);
  });
  imageCache.set(key,p);
  return p;
}
function preloadTrial(names){return Promise.all(names.map(loadImageCached))}
const enc=n=>A+encodeURIComponent(n);
const assetUrl=n=>enc(n);
const picture=(n,c='')=>`<img class="${c}" src="${assetUrl(n)}" alt="${n}" loading="eager">`;
function base(h){root.innerHTML=`<section class="screen">${h}</section>`}
function k(fn){document.onkeydown=e=>fn(e)}

// ==========================================
// MediaPipe Face Mesh & Custom Regression Model
// ==========================================
let faceMesh = null;
let cameraUtils = null;
let currentFeatures = null;
let calibDataX = [];
let calibDataY = [];
let weightsX = null;
let weightsY = null;

let goodStateStartTime = 0;
let isAligned = false;

// אלגוריתם רגרסיה לינארית (Least Squares Solver)
function solveLinearRegression(X, Y) {
  const N = X.length;
  const K = X[0].length;
  let XTX = Array.from({length: K}, () => new Array(K).fill(0));
  for(let i=0; i<K; i++) {
    for(let j=0; j<K; j++) {
      for(let n=0; n<N; n++) {
        XTX[i][j] += X[n][i] * X[n][j];
      }
    }
  }
  for(let i=0; i<K; i++) XTX[i][i] += 1e-4; // Regularization

  let I = Array.from({length: K}, (_, i) => Array.from({length: K}, (_, j) => i === j ? 1 : 0));
  let M = XTX.map(row => [...row]);

  for(let i=0; i<K; i++) {
    let pivot = M[i][i];
    if(Math.abs(pivot) < 1e-9) pivot = 1e-9;
    for(let j=0; j<K; j++) {
      M[i][j] /= pivot;
      I[i][j] /= pivot;
    }
    for(let k=0; k<K; k++) {
      if(k !== i) {
        let factor = M[k][i];
        for(let j=0; j<K; j++) {
          M[k][j] -= factor * M[i][j];
          I[k][j] -= factor * I[i][j];
        }
      }
    }
  }
  let invXT = Array.from({length: K}, () => new Array(N).fill(0));
  for(let i=0; i<K; i++) {
    for(let n=0; n<N; n++) {
      for(let j=0; j<K; j++) {
        invXT[i][n] += I[i][j] * X[n][j];
      }
    }
  }
  let W = new Array(K).fill(0);
  for(let i=0; i<K; i++) {
    for(let n=0; n<N; n++) {
      W[i] += invXT[i][n] * Y[n];
    }
  }
  return W;
}

function predictGaze() {
  if(!weightsX || !weightsY || !currentFeatures) return null;
  let x = 0, y = 0;
  for(let i=0; i<currentFeatures.length; i++) {
    x += currentFeatures[i] * weightsX[i];
    y += currentFeatures[i] * weightsY[i];
  }
  return {x, y};
}

function initFaceMeshSystem() {
  if(faceMesh) return Promise.resolve(true);

  const video = document.getElementById('webcamVideo');
  const canvas = document.getElementById('meshCanvas');
  const ctx = canvas.getContext('2d');
  const popup = document.getElementById('cameraPopup');
  const statusTxt = document.getElementById('cameraStatusText');

  faceMesh = new FaceMesh({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
  });

  faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  faceMesh.onResults(results => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
      const lm = results.multiFaceLandmarks[0];
      
      // נקודות מפתח: אישון שמאל (468), אישון ימין (473), קצה אף (1), פינות עיניים (33, 263)
      const lIris = lm[468], rIris = lm[473], nose = lm[1];

      // ציור נקודות תווי פנים ואישונים בתוך ה-Canvas
      ctx.fillStyle = '#00ff7f';
      [1, 33, 263, 61, 291].forEach(i => {
        ctx.beginPath();
        ctx.arc(lm[i].x * canvas.width, lm[i].y * canvas.height, 2, 0, 2 * Math.PI);
        ctx.fill();
      });

      ctx.fillStyle = '#ff0055';
      [468, 473].forEach(i => {
        ctx.beginPath();
        ctx.arc(lm[i].x * canvas.width, lm[i].y * canvas.height, 3, 0, 2 * Math.PI);
        ctx.fill();
      });

      // חילוץ וקטור מאפיינים
      currentFeatures = [1, lIris.x, lIris.y, rIris.x, rIris.y, nose.x, nose.y];

      // בדיקת מיקום פנים בתוך המסגרת
      const centered = nose.x > 0.25 && nose.x < 0.75 && nose.y > 0.20 && nose.y < 0.80;

      if (centered) {
        isAligned = true;
        popup.classList.remove('bad');
        popup.classList.add('good');
        statusTxt.textContent = 'הפנים זוהו';

        if (!goodStateStartTime) goodStateStartTime = performance.now();
        if (performance.now() - goodStateStartTime >= 200) {
          popup.classList.remove('show');
        }
      } else {
        isAligned = false;
        goodStateStartTime = 0;
        popup.classList.remove('good');
        popup.classList.add('bad', 'show');
        statusTxt.textContent = 'חריגה מהמסגרת';
      }
    } else {
      currentFeatures = null;
      isAligned = false;
      goodStateStartTime = 0;
      popup.classList.remove('good');
      popup.classList.add('bad', 'show');
      statusTxt.textContent = 'פנים לא זוהו';
    }
  });

  cameraUtils = new Camera(video, {
    onFrame: async () => {
      await faceMesh.send({image: video});
    },
    width: 320,
    height: 240
  });

  return cameraUtils.start().then(() => {
    popup.classList.add('show');
    return true;
  });
}

// ==========================================
// זרימת הניסוי והמסכים
// ==========================================
async function preload(){
  base(`<div class="panel"><h1>נא להמתין בזמן שכל חומרי הניסוי נטענים</h1><p>אנא המתן/י עד לסיום הטעינה. אין לסגור את החלון.</p><progress id="pr" max="${assets.length}" value="0"></progress><p id="pc">0%</p></div>`);
  const progress=document.getElementById('pr');
  const percent=document.getElementById('pc');
  let completed=0;
  await Promise.all(assets.map(async name=>{
    await loadImageCached(name);
    completed++;
    progress.value=completed;
    percent.textContent=Math.round(completed/assets.length*100)+'%';
  }));
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  screen1();
}

function screen1(){base(`<div class="panel"><h1>ברוכים הבאים למחקר</h1><p>נא הזן/י את מספר המשתתף/ת.</p><input id="pid" class="input" inputmode="numeric"><br><button class="btn" id="go">המשך</button><p id="err" class="status"></p></div>`);document.getElementById('go').addEventListener('click',()=>{const value=document.getElementById('pid').value.trim();if(!value){document.getElementById('err').textContent='נא להזין מספר';return}S.id=value;screenDemographics()})}
function screenDemographics(){base(`<div class="panel"><h2>פרטים אישיים</h2><p>נא להזין/י את גילך ולבחור מגדר.</p><label for="age">גיל</label><br><input id="age" class="input" type="text" inputmode="numeric" autocomplete="off"><br><label for="gender">מגדר</label><br><select id="gender" class="input"><option value="">יש לבחור</option><option value="זכר">זכר</option><option value="נקבה">נקבה</option></select><br><button class="btn" id="demoGo">המשך</button><p id="demoErr" class="status"></p></div>`);document.getElementById('demoGo').addEventListener('click',()=>{const age=document.getElementById('age').value.trim();const gender=document.getElementById('gender').value;if(!age){document.getElementById('demoErr').textContent='נא להזין גיל';return}if(!gender){document.getElementById('demoErr').textContent='נא לבחור מגדר';return}S.age=age;S.gender=gender;screen2()})}
function screen2(){base(`<div class="panel consent-choice"><h2>האם את/ה מרכיב/ה משקפיים?</h2><div><button class="btn" id="yes">כן</button><button class="btn no-btn" id="no">לא</button></div></div>`);document.getElementById('yes').addEventListener('click',()=>exit('תודה רבה על ההתעניינות במחקר שלנו. מכיוון שאת/ה מרכיב/ה משקפיים לא תוכל/י לבצע את הניסוי. סליחה ויום טוב :)'));document.getElementById('no').addEventListener('click',consentScreen)}
function consentScreen(){base(`<div class="panel consent-form"><h2>טופס הסכמה מדעת להשתתפות בניסוי At First Glance</h2><p><strong>שם המחקר:</strong> At First Glance</p><p><strong>שם החוקר האחראי:</strong> אמבר מזרחי, המחלקה לקרימינולוגיה, אוניברסיטת בר-אילן.</p><p><strong>מטרת המחקר:</strong> מטרת המחקר הינה לבחון את זיהוי פריטים (זיכרון) בעת הצגת פריטים שונים על המסך, בהתאם להוראות שיוצגו בהמשך.</p><p><strong>מה תתבקש/י לעשות במחקר?</strong><br>בניסוי זה תבקש/י לבצע משימה מסוימת שבמהלכה ימדדו תנועות עינייך ביחידות של מספרים. נדגיש כי פנייך לא יוקלטו!</p><p><strong>כמה זמן ייקח המחקר?</strong> משך הניסוי הוא כ-15 דק'.</p><p><strong>מהם הסיכונים האפשריים הכרוכים בהשתתפות במחקר?</strong> אין סיכונים.</p><p><strong>איזו תועלת תצמח לך מהמחקר?</strong><br>תוכל/י לקבל חצי קופון. בנוסף, תוצאות הניסוי עשויות לתרום להבנה התאורטית של מבחן ה-CIT אשר מהווה תנאי חשוב ליישומו של מבחן זה.</p><p><strong>איך נשמור על המידע שנאגר במסגרת הניסוי?</strong><br>כדי להבטיח את שמירת החיסיון של המידע האישי שלך, כל נתוני המידע יקודדו ויישמרו במחשב באופן אנונימי ונפרד מהפרטים המזהים. בנוסף, לא יעשה שימוש מזהה כלשהו בנתונים שלך בפורום כלשהו או בפרסום מדעי או תקשורתי כלשהו.</p><p><strong>מה יקרה אם תרצה להפסיק את הניסוי באמצע?</strong><br>ההשתתפות בניסוי היא על בסיס התנדבותי. לפיכך – זכותך להפסיק את השתתפותך בניסוי בכל עת ומכל סיבה שהיא. לא תהינה שום השלכות לכך שבחרת להפסיק את הניסוי והחלטה זו לא תפגע בך בשום אופן. בנוסף, את הקרדיט היחסי עבור הניסוי תקבל גם במקרה שתחליט לפרוש.</p><p>במקרה הצורך ניתן ליצור קשר עם החוקרת האחראית – <strong>אמבר מזרחי</strong> – בכל שאלה ועניין בטלפון 050-3477040 ובאי-מייל imbar.mizrahi123@gmail.com.</p><p><strong>מידע ליצירת קשר לעזרה במקרה של פגיעה מהמחקר</strong><br>במידה ותרצה לשוחח על מחקר זה עם משהו שאינו מעורב ישירות במחקר, תוכל לדבר עם <strong>ד&quot;ר יהונתן לוי</strong> בכתובת המייל הבאה: jonathan.levy@biu.ac.il.</p><div class="consent-actions"><button class="btn" id="agree">אני מסכים/ה להשתתף בניסוי</button><button class="btn no-btn" id="decline">אני לא מסכים/ה להשתתף בניסוי</button></div></div>`);document.getElementById('agree').addEventListener('click',screen5);document.getElementById('decline').addEventListener('click',()=>exit('תודה רבה על ההתעניינות במחקר שלנו. יום טוב :)'))}
function instr(pic,next){base(`${picture(pic,'slide')}<button class="btn" id="b">המשך</button>`);b.onclick=window[next]};
function screen5(){instr('b_women_pics.jpg','screen6')}
function screen7(){instr('b_men_pics.jpg','screen8')}

function choose(g){const ns=Array.from({length:12},(_,i)=>`${g}${i+1}.webp`);base(`<h2>בחר/י בדיוק שני פרצופים מוכרים</h2><div class="grid">${ns.map((n,i)=>`<img class="candidate" id="c${i}" src="${enc(n)}">`).join('')}</div><button class="btn" id="b">המשך</button><p id="m" class="selection-error">נבחרו: 0 מתוך 2</p>`);ns.forEach((_,i)=>document.getElementById('c'+i).onclick=()=>{const x=document.getElementById('c'+i);if(x.classList.contains('sel'))x.classList.remove('sel');else if(document.querySelectorAll('.sel').length<2)x.classList.add('sel');m.textContent='נבחרו: '+document.querySelectorAll('.sel').length+' מתוך 2'});b.onclick=()=>{const a=[...document.querySelectorAll('.sel')].map(x=>decodeURIComponent(x.src.split('/').pop()));if(a.length!==2){m.textContent='יש לבחור בדיוק שני פרצופים';return}S[g==='F'?'female':'male']=a;g==='F'?screen7():screen9()}}
function screen6(){choose('F')}

let sl=1;
function screen9(){const p=['SMT_instructions.jpg','SMT_example.jpg','twoSessInst.jpg','b_practice.jpg'];const navImage=sl===1?'only_forward.jpg':'back_and_forward.jpg';base(`${picture(p[sl-1],'slide')}<p>השתמש/י בחצים כדי לנווט</p>${picture(navImage,'keyboard-nav')}`);k(e=>{if(e.key==='ArrowLeft'&&sl>1){e.preventDefault();sl--;screen9()}else if(e.key==='ArrowRight'){e.preventDefault();if(sl<4){sl++;screen9()}else{document.onkeydown=null;countdown('practice')}}})}

function countdown(type){let n=3;base(`<div id="ct" class="count">3</div>`);const t=setInterval(()=>{n--;if(n<1){clearInterval(t);type==='practice'?practice():mainStart(type==='block2'?2:1)}else ct.textContent=n},1000)}

let showFeedback=false;
const prac=[['P4','P6','P2','P8','P2','i'],['P1','P3','P5','P7','P9','e'],['P6','P8','P4','P10','P8','i'],['P3','P9','P7','P5','P1','e']];

function trial(row,done){
  const faces=row.slice(0,4).map(x=>String(x).endsWith('.webp')?String(x):String(x)+'.webp');
  base('<div class="fix">+</div>');
  const loadPromise=preloadTrial(faces);
  const timerPromise=new Promise(resolve=>setTimeout(resolve,5000));
  Promise.all([loadPromise,timerPromise]).then(()=>{
    base(`<div class="trial-grid" style="visibility:hidden">${faces.map((x,i)=>picture(x,'pos p'+(i+1))).join('')}</div>`);
    requestAnimationFrame(()=>{
      const grid=document.querySelector('.trial-grid');
      if(!grid)return;
      grid.style.visibility='visible';
      setTimeout(()=>{
        base('<div class="bottom-fix">+</div>');
        setTimeout(()=>response(row,done),3000);
      },5000);
    });
  }).catch(err=>{console.error('Trial preload failed',err);if(typeof done==='function')done();});
}

function response(row,done){
  const singleName=String(row[4]).endsWith('.webp')?String(row[4]):String(row[4])+'.webp';
  base(`${picture(singleName,'center')}<div class="question">האם הפרצוף הזה הופיע במסך הקודם?</div><div class="keys"><span class="yes">I = כן</span><span class="no">E = לא</span></div>`);
  const t=performance.now();
  let answered=false;
  let timeoutId=null;
  document.onkeydown=null;
  document.onkeydown=e=>{
    const key=String(e.key||'').toLowerCase();
    const q=e.code==='KeyI'||key==='i'||key==='ך'?'i':e.code==='KeyE'||key==='e'||key==='ק'?'e':'';
    if(!q||answered)return;
    e.preventDefault();
    e.stopImmediatePropagation();
    answered=true;
    clearTimeout(timeoutId);
    document.onkeydown=null;
    S.trials.push({phase:'practice',rt:performance.now()-t,key:q,correct:q===row[5]});
    const finishAnswer=()=>{if(typeof done==='function')done()};
    if(showFeedback){base(`<h2 style="color:${q===row[5]?'#00a83b':'#b32626'}">${q===row[5]?'תשובה נכונה':'תשובה שגויה'}</h2>`);setTimeout(finishAnswer,700)}
    else finishAnswer()
  };
  timeoutId=setTimeout(()=>{
    if(answered)return;
    answered=true;
    document.onkeydown=null;
    if(showFeedback){base('<h2 style="color:#9b3f3f">לאט מידי</h2>');setTimeout(()=>{if(typeof done==='function')done()},700)}
    else if(typeof done==='function')done()
  },2000);
  window.focus();
}

function practice(){showFeedback=true;let i=0,finished=false;const go=()=>{if(finished)return;if(i<prac.length){trial(prac[i++],go)}else{finished=true;showFeedback=false;document.onkeydown=null;setTimeout(screenMovementInstructions,400)}};go()}

function calibrate(block){
  let attempts = 1;
  const points = [
    {x:10,y:10},{x:50,y:10},{x:90,y:10},
    {x:10,y:50},{x:50,y:50},{x:90,y:50},
    {x:10,y:90},{x:50,y:90},{x:90,y:90}
  ];

  calibDataX = [];
  calibDataY = [];

  const instruction = () => {
    base('<div class="panel"><h2>הוראות כיול</h2><p>הסתכל/י על הנקודה הלבנה ולחץ/י עליה 5 פעמים. שמור/י על הראש יציב.</p><button class="btn" id="startCal">התחל כיול</button></div>');
    document.getElementById('startCal').onclick = run;
  };

  const run = () => {
    let index = 0;
    const next = () => {
      if(index >= points.length){
        // חישוב מודל הרגרסיה בסיום הכיול
        if(calibDataX.length >= 10) {
          const X = calibDataX.map(d => d.feat);
          const Yx = calibDataX.map(d => d.target);
          const Yy = calibDataY.map(d => d.target);
          weightsX = solveLinearRegression(X, Yx);
          weightsY = solveLinearRegression(X, Yy);
        }
        if(block === 1){ S.cal1 = attempts; S.calAcc1 = 100; }
        else { S.cal2 = attempts; S.calAcc2 = 100; }
        screen13(block);
        return;
      }
      const q = points[index];
      base(`<div class="calibration"><button type="button" class="calpoint" id="target" aria-label="נקודת כיול" style="left:${q.x}%;top:${q.y}%"></button></div>`);
      const target = document.getElementById('target');
      let clicks = 0, locked = false;

      target.addEventListener('click', event => {
        if(locked) return;
        event.preventDefault();
        
        if(currentFeatures) {
          const targetX = (q.x / 100) * window.innerWidth;
          const targetY = (q.y / 100) * window.innerHeight;
          calibDataX.push({ feat: [...currentFeatures], target: targetX });
          calibDataY.push({ feat: [...currentFeatures], target: targetY });
        }

        clicks++;
        target.textContent = clicks;
        if(clicks >= 5){
          locked = true;
          target.classList.add('done');
          setTimeout(()=>{ index++; next(); }, 300);
        }
      }, {passive:false});
    };
    next();
  };
  instruction();
}

  k(e=>{if(e.code==='Space')countdown(block===1?'main':'block2')});
}

    {ffi:0,p:['UNf14.webp','UNf4.webp','UNf7.webp','UNf10.webp'],s:'UNf1.webp',c:'e'},

  ].sort(()=>Math.random()-.5):[

      requestAnimationFrame(()=>{
        const grid=document.querySelector('.trial-grid');
        if(!grid)return;
        grid.style.visibility='visible';
        const t0=performance.now();
        if(r.ffi)track(t0,sex,tno);
        setTimeout(()=>{
          base('<div class="bottom-fix">+</div>');
          setTimeout(()=>response([...faces,r.s,r.c],go),3000);

function track(t0,sex,trial){
  const stopAt=t0+5000;
  const f=()=>{
    const now=performance.now();
    if(now>=stopAt)return;
    const gaze = predictGaze();
    S.raw.push({
      participant:S.id,
      block:sex,
      trial,
      timestamp:now-t0,
      gazeX:gaze?.x??null,
      gazeY:gaze?.y??null,
      screenWidth:innerWidth,
      screenHeight:innerHeight,
      phase:now-t0<=1000?'Phase1':'Phase2'
    });
    requestAnimationFrame(f);
  };
  requestAnimationFrame(f);
}

function screen16(){
  if(cameraUtils) cameraUtils.stop();
  document.getElementById('cameraPopup')?.classList.remove('show');
  base('<div class="panel"><h2>מעקב העיניים הסתיים</h2><p>אפשר להירגע. כעת תתבצע משימת דירוג קצרה.</p></div><button class="btn" id="b">המשך</button>');
  b.onclick=()=>instr('b_sig_rate.jpg','ratings');

function ratings(){
  const all=[...Array.from({length:14},(_,i)=>`UNf${i+1}.webp`),...S.female,...Array.from({length:14},(_,i)=>`UNm${i+1}.webp`),...S.male];
  const go=()=>{
    if(!ratings.i)ratings.i=0;
    if(ratings.i>=all.length)return finish();
    base(`<h2>באיזה מידה פרצוף זה תפס לך את העין?</h2>${picture(all[ratings.i],'rating-face')}<p>1 = במידה מועטה מאוד 9 = במידה רבה מאוד</p><div class="scale">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="ratings.rate(${n})">${n}</button>`).join('')}</div>`);
  };
  ratings.rate=n=>{
    S.ratings.push({stimulus:all[ratings.i],rating:n});
    ratings.i++;
    go();
  };
  go();
}

function finish(){
  const p={
    participant_summary:{
      ParticipantNo:S.id,
      Age:S.age,
      Gender:S.gender,
      Calibration_Attempts_block1:S.cal1,
      Calibration_Attempts_block2:S.cal2,
      Calibration_Accuracy_Score_Block1:S.calAcc1,
      Calibration_Accuracy_Score_Block2:S.calAcc2,
      raw_gaze_count:S.raw.length,
      ratings:S.ratings
    },
    raw_gaze:S.raw,
    trials:S.trials
  };
  localStorage.setItem('participant_'+S.id+'_data',JSON.stringify(p));
  base(`${picture('biu_logo.png','logo')}<div class="panel"><h1>תודה רבה על השתתפותך 😊</h1><p>הניסוי הסתיים בהצלחה.</p></div>`);
}
